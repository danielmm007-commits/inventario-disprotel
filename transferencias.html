<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transferencias DISPROTEL</title><script src="https://unpkg.com/@zxing/browser@0.2.0"></script><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f7f9;color:#17313d;margin:0;padding:14px}.wrap{max-width:720px;margin:auto}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 7px 24px rgba(0,0,0,.08);margin:14px 0}h1,h2{margin-top:0}.muted{color:#60737c;font-size:13px}label{display:block;font-weight:700;margin:13px 0 6px}input,select,textarea{width:100%;padding:13px;border:1px solid #cbd8de;border-radius:11px;font-size:16px;background:#fff}textarea{min-height:70px}button{width:100%;border:0;border-radius:12px;padding:14px;background:#17313d;color:#fff;font-size:16px;font-weight:700;margin-top:12px}.secondary{background:#e8eef1;color:#17313d}.accept{background:#26734d}.reject,.danger{background:#8a2d2d}.hidden{display:none!important}.msg{padding:12px;border-radius:10px;margin-top:12px;display:none}.ok{display:block;background:#e8f6ed;color:#1b6c43}.err{display:block;background:#fdecec;color:#9d2525}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.serialList{max-height:300px;overflow:auto;border:1px solid #d7e1e5;border-radius:12px;padding:6px}.serialRow{display:flex;gap:10px;align-items:flex-start;padding:10px;border-bottom:1px solid #edf2f4}.serialRow:last-child{border-bottom:0}.serialRow input{width:22px;height:22px;margin:1px 0 0}.serialMeta{flex:1}.serialMeta b{display:block}.counter{font-weight:700;margin-top:8px}.scanbox{margin-top:10px;padding:10px;background:#f4f7f9;border-radius:12px}.scanbox video{width:100%;max-height:320px;background:#111;border-radius:12px}.cartItem,.pending{background:#f4f7f9;border-radius:12px;padding:12px;margin-top:8px}.cartItem{display:flex;gap:10px;align-items:flex-start}.cartText{flex:1}.cartItem button{width:auto;margin:0;padding:8px 10px;font-size:13px}.badge,.pill{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:700}.badge{background:#e8eef1}.pill{background:#fff3cd;color:#725b00}.summary{background:#eef6f9;border-radius:12px;padding:12px;margin-top:12px}.empty{color:#60737c;padding:12px 0}.stock{font-weight:700;color:#26734d}.pendingItems{margin:10px 0 0;padding-left:18px}.pendingItems li{margin:5px 0}</style></head><body><div class="wrap"><section class="card" id="login"><h1>Transferencias · Prueba</h1><div class="muted">El lote no cambia de ubicación hasta que quien recibe lo acepte.</div><label>Usuario</label><input id="usuario" placeholder="Ej. luis"><label>PIN</label><input id="pin" inputmode="numeric"><button id="entrar">Entrar</button><div id="loginMsg" class="msg"></div></section><div id="app" class="hidden"><section class="card"><h2 id="quien"></h2><div id="rol" class="muted"></div><button id="salir" class="secondary">Cambiar usuario</button></section><section class="card"><h2>Enviar transferencia</h2><label>Enviar a</label><select id="receptor"></select><label>Tipo de artículo</label><select id="tipo"><option value="SERIAL">Equipo por serial</option><option value="CANTIDAD">Material por cantidad</option></select><div id="serialWrap"><label>Equipos disponibles</label><div id="serialList" class="serialList"></div><div id="seleccionados" class="muted counter"></div><div class="grid"><button id="agregarSeleccionados">Agregar seleccionados</button><button id="abrirCamara" class="secondary">📷 Escanear</button></div><button id="cerrarCamara" class="secondary hidden">Cerrar cámara</button><div id="scanBox" class="scanbox hidden"><video id="video" playsinline></video><div class="muted">Cada serial leído se agrega al carrito.</div></div></div><div id="cantWrap" class="hidden"><label>Producto disponible</label><select id="producto"></select><div id="stockInfo" class="muted"></div><label>Cantidad</label><input id="cantidad" type="number" min="1" step="1"><button id="agregarCantidad">Agregar al carrito</button></div><label>Motivo</label><input id="motivo" value="Apoyo entre técnicos"><label>Observación</label><textarea id="obs" placeholder="Opcional"></textarea></section><section class="card"><h2>Resumen de transferencia</h2><div id="carrito"></div><div id="totales" class="summary hidden"></div><button id="enviar" class="hidden">ENVIAR TRANSFERENCIA</button><button id="vaciar" class="secondary hidden">Vaciar carrito</button><div id="envMsg" class="msg"></div></section><section class="card"><h2>Transferencias pendientes por recibir</h2><button id="actualizar" class="secondary">Actualizar pendientes</button><div id="pendientes"></div><div id="pendMsg" class="msg"></div></section></div></div><script>const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-transferencias';let US='',PIN='',ctx=null,carrito=[],scanControls=null;const $=id=>document.getElementById(id);function msg(id,t,ok=false){const e=$(id);e.className='msg '+(ok?'ok':'err');e.textContent=t}function clear(id){const e=$(id);e.className='msg';e.textContent=''}async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:US,pin:PIN,action,...payload})});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw new Error(d.error||'Error');return d}function llenar(){const usados=new Set(carrito.filter(x=>x.tipo_control==='SERIAL').map(x=>x.serial));const disponibles=ctx.seriales.filter(s=>!usados.has(s.serial));$('receptor').innerHTML='<option value="">Selecciona</option>'+ctx.personas.map(p=>`<option value="${p.id}">${p.nombre} · ${p.unidad_grupo}</option>`).join('');$('serialList').innerHTML=disponibles.length?disponibles.map(s=>`<label class="serialRow"><input type="checkbox" class="serialCheck" value="${s.serial}"><span class="serialMeta"><b>${s.producto}</b><span>${s.codigo} · ${s.serial}</span></span></label>`).join(''):'<div class="empty">No hay equipos disponibles.</div>';$('producto').innerHTML='<option value="">Selecciona</option>'+ctx.cantidades.map(p=>{const enCarrito=carrito.filter(x=>x.tipo_control==='CANTIDAD'&&x.producto_id===p.id).reduce((a,x)=>a+x.cantidad,0),rest=Math.max(0,p.disponible-enCarrito);return `<option value="${p.id}" data-stock="${rest}" ${rest<=0?'disabled':''}>${p.codigo} · ${p.producto} — disponibles: ${rest}</option>`}).join('');actualizarStock();renderCarrito();actualizarSeleccionados()}async function refrescar(){ctx=await api('context');llenar()}async function entrar(){clear('loginMsg');US=$('usuario').value.trim();PIN=$('pin').value.trim();try{await refrescar();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('quien').textContent=ctx.me.nombre;$('rol').textContent=`${ctx.me.rol} · ${ctx.me.grupo} · Inventario: ${ctx.ubicacion.ubicacion}`;await pendientes()}catch(e){msg('loginMsg',e.message)}}function actualizarSeleccionados(){const n=document.querySelectorAll('.serialCheck:checked').length;$('seleccionados').textContent=n?`${n} equipo${n===1?'':'s'} seleccionado${n===1?'':'s'}`:'Ningún equipo seleccionado'}function actualizarStock(){const o=$('producto').selectedOptions[0],st=Number(o?.dataset?.stock||0);$('stockInfo').innerHTML=st?`Disponible para agregar: <span class="stock">${st}</span>`:'';if(st)$('cantidad').max=st;else $('cantidad').removeAttribute('max')}function renderCarrito(){if(!carrito.length){$('carrito').innerHTML='<div class="empty">Todavía no has agregado artículos.</div>';$('totales').classList.add('hidden');$('enviar').classList.add('hidden');$('vaciar').classList.add('hidden');return}$('carrito').innerHTML=carrito.map((x,i)=>`<div class="cartItem"><div class="cartText"><span class="badge">${x.tipo_control}</span><br><b>${x.detalle}</b></div><button class="danger" onclick="quitar(${i})">Quitar</button></div>`).join('');const s=carrito.filter(x=>x.tipo_control==='SERIAL').length,q=carrito.filter(x=>x.tipo_control==='CANTIDAD').reduce((a,x)=>a+x.cantidad,0);$('totales').innerHTML=`<b>${carrito.length} líneas</b><br>${s} equipos serializados · ${q} unidades por cantidad`;$('totales').classList.remove('hidden');$('enviar').classList.remove('hidden');$('vaciar').classList.remove('hidden')}function quitar(i){carrito.splice(i,1);llenar()}function agregarSerialCodigo(code){const serial=String(code||'').trim().toUpperCase();if(!serial)return;const s=ctx.seriales.find(x=>x.serial.toUpperCase()===serial);if(!s){msg('envMsg',`El serial ${serial} no está disponible en ${ctx.ubicacion.ubicacion}.`);return}if(carrito.some(x=>x.tipo_control==='SERIAL'&&x.serial===s.serial)){msg('envMsg','Ese serial ya está en el carrito.');return}carrito.push({tipo_control:'SERIAL',serial:s.serial,detalle:`${s.producto} · ${s.serial}`});clear('envMsg');llenar()}function agregarSeleccionados(){clear('envMsg');const vals=[...document.querySelectorAll('.serialCheck:checked')].map(x=>x.value);if(!vals.length){msg('envMsg','Marca al menos un equipo.');return}for(const serial of vals){const s=ctx.seriales.find(x=>x.serial===serial);if(s&&!carrito.some(x=>x.tipo_control==='SERIAL'&&x.serial===serial))carrito.push({tipo_control:'SERIAL',serial:s.serial,detalle:`${s.producto} · ${s.serial}`})}llenar()}function agregarCantidad(){clear('envMsg');const id=$('producto').value,cant=Number($('cantidad').value),o=$('producto').selectedOptions[0],stock=Number(o?.dataset?.stock||0);if(!id||!Number.isInteger(cant)||cant<=0){msg('envMsg','Selecciona un material y cantidad válida.');return}if(cant>stock){msg('envMsg',`Solo puedes agregar ${stock} unidades más.`);return}const p=ctx.cantidades.find(x=>x.id===id),ex=carrito.find(x=>x.tipo_control==='CANTIDAD'&&x.producto_id===id);if(ex){ex.cantidad+=cant;ex.detalle=`${ex.cantidad} × ${p.producto}`}else carrito.push({tipo_control:'CANTIDAD',producto_id:id,cantidad:cant,detalle:`${cant} × ${p.producto}`});$('cantidad').value='';llenar()}function cerrarCamara(){try{scanControls?.stop()}catch{}scanControls=null;const v=$('video');if(v.srcObject){for(const t of v.srcObject.getTracks())t.stop();v.srcObject=null}$('scanBox').classList.add('hidden');$('cerrarCamara').classList.add('hidden');$('abrirCamara').classList.remove('hidden')}async function abrirCamara(){clear('envMsg');try{$('scanBox').classList.remove('hidden');$('cerrarCamara').classList.remove('hidden');$('abrirCamara').classList.add('hidden');const reader=new ZXingBrowser.BrowserMultiFormatReader();let last='',ts=0;scanControls=await reader.decodeFromVideoDevice(undefined,$('video'),result=>{if(result){const c=result.getText().trim().toUpperCase(),n=Date.now();if(c===last&&n-ts<1500)return;last=c;ts=n;agregarSerialCodigo(c)}})}catch{cerrarCamara();msg('envMsg','No pude abrir la cámara. Revisa el permiso.')}}async function pendientes(){clear('pendMsg');try{const d=await api('pending-batch');const a=d.pendientes||[];$('pendientes').innerHTML=a.length?a.map(t=>{const items=(t.items||[]).map(i=>`<li>${i.tipo_control==='SERIAL'?(i.producto?.producto||'')+' · '+(i.serial?.serial||''):`${i.cantidad} × ${i.producto?.producto||''}`}</li>`).join('');return `<div class="pending"><span class="pill">PENDIENTE</span><br><b>${t.id_transferencia}</b><br>De: ${t.entrega?.nombre||''} (${t.entrega?.unidad_grupo||''})<br>Origen: ${t.origen?.ubicacion||''} → ${t.destino?.ubicacion||''}<ul class="pendingItems">${items}</ul><span class="muted">${t.motivo||''}</span><div class="grid"><button class="accept" onclick="responder('${t.id}','ACEPTAR')">Aceptar lote</button><button class="reject" onclick="responder('${t.id}','RECHAZAR')">Rechazar lote</button></div></div>`}).join(''):'<div class="empty">No tienes transferencias pendientes.</div>'}catch(e){msg('pendMsg',e.message)}}async function responder(id,decision){try{const nota=decision==='RECHAZAR'?prompt('Motivo del rechazo (opcional):')||'':'';const d=await api('respond-batch',{transferencia_id:id,decision,nota});msg('pendMsg',`Lote ${d.estado.toLowerCase()}.`,true);await refrescar();await pendientes()}catch(e){msg('pendMsg',e.message)}}document.addEventListener('change',e=>{if(e.target.classList?.contains('serialCheck'))actualizarSeleccionados()});$('entrar').onclick=entrar;$('salir').onclick=()=>{cerrarCamara();location.reload()};$('actualizar').onclick=async()=>{await refrescar();await pendientes()};$('producto').onchange=actualizarStock;$('agregarSeleccionados').onclick=agregarSeleccionados;$('agregarCantidad').onclick=agregarCantidad;$('abrirCamara').onclick=abrirCamara;$('cerrarCamara').onclick=cerrarCamara;$('tipo').onchange=()=>{const s=$('tipo').value==='SERIAL';$('serialWrap').classList.toggle('hidden',!s);$('cantWrap').classList.toggle('hidden',s);if(!s)cerrarCamara()};$('vaciar').onclick=()=>{carrito=[];llenar();clear('envMsg')};$('enviar').onclick=async()=>{clear('envMsg');try{const p={receptor_id:$('receptor').value,items:carrito.map(({detalle,...x})=>x),motivo:$('motivo').value.trim(),observacion:$('obs').value.trim()};const d=await api('create-batch',p);msg('envMsg',`Transferencia ${d.id_transferencia} enviada a ${d.para}. ${d.total_lineas} líneas quedaron PENDIENTES hasta que acepte.`,true);carrito=[];$('obs').value='';await refrescar()}catch(e){msg('envMsg',e.message);await refrescar()}};</script></body></html>
