<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transferencias DISPROTEL</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f7f9;color:#17313d;margin:0;padding:14px}.wrap{max-width:640px;margin:auto}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 7px 24px rgba(0,0,0,.08);margin:14px 0}h1,h2{margin-top:0}.muted{color:#60737c;font-size:13px}label{display:block;font-weight:700;margin:13px 0 6px}input,select,textarea{width:100%;padding:13px;border:1px solid #cbd8de;border-radius:11px;font-size:16px;background:#fff}textarea{min-height:70px}button{width:100%;border:0;border-radius:12px;padding:14px;background:#17313d;color:white;font-size:16px;font-weight:700;margin-top:12px}.secondary{background:#e8eef1;color:#17313d}.accept{background:#26734d}.reject{background:#8a2d2d}.hidden{display:none!important}.msg{padding:12px;border-radius:10px;margin-top:12px;display:none}.ok{display:block;background:#e8f6ed;color:#1b6c43}.err{display:block;background:#fdecec;color:#9d2525}.item{background:#f4f7f9;border-radius:12px;padding:13px;margin-top:10px}.pill{display:inline-block;background:#fff3cd;color:#725b00;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{margin-top:8px}</style></head><body><div class="wrap"><section class="card" id="login"><h1>Transferencias · Prueba</h1><div class="muted">El material no cambia de responsable hasta que quien recibe lo acepte.</div><label>Usuario</label><input id="usuario" placeholder="Ej. luis"><label>PIN</label><input id="pin" inputmode="numeric"><button id="entrar">Entrar</button><div id="loginMsg" class="msg"></div></section><div id="app" class="hidden"><section class="card"><h2 id="quien"></h2><div id="rol" class="muted"></div><button id="salir" class="secondary">Cambiar usuario</button></section><section class="card"><h2>Enviar transferencia</h2><label>Enviar a</label><select id="receptor"></select><label>Tipo</label><select id="tipo"><option value="SERIAL">Equipo por serial</option><option value="CANTIDAD">Material por cantidad</option></select><div id="serialWrap"><label>Serial</label><input id="serial" placeholder="Escribe el serial"></div><div id="cantWrap" class="hidden"><label>Producto</label><select id="producto"></select><label>Cantidad</label><input id="cantidad" type="number" min="1" step="1"></div><label>Motivo</label><input id="motivo" value="Apoyo entre técnicos"><label>Observación</label><textarea id="obs" placeholder="Opcional"></textarea><button id="enviar">Solicitar transferencia</button><div id="envMsg" class="msg"></div></section><section class="card"><h2>Mis transferencias pendientes</h2><button id="actualizar" class="secondary">Actualizar pendientes</button><div id="pendientes"></div><div id="pendMsg" class="msg"></div></section></div></div><script>const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-transferencias';let US='',PIN='',ctx=null;const $=id=>document.getElementById(id);function msg(id,t,ok=false){const e=$(id);e.className='msg '+(ok?'ok':'err');e.textContent=t}function clear(id){const e=$(id);e.className='msg';e.textContent=''}async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:US,pin:PIN,action,...payload})});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw new Error(d.error||'Error');return d}async function entrar(){clear('loginMsg');US=$('usuario').value.trim();PIN=$('pin').value.trim();try{ctx=await api('context');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('quien').textContent=ctx.me.nombre;$('rol').textContent=`${ctx.me.rol} · ${ctx.me.grupo}`;$('receptor').innerHTML='<option value="">Selecciona</option>'+ctx.personas.map(p=>`<option value="${p.id}">${p.nombre} · ${p.unidad_grupo}</option>`).join('');$('producto').innerHTML='<option value="">Selecciona</option>'+ctx.productos.filter(p=>!p.requiere_serial).map(p=>`<option value="${p.id}">${p.codigo} · ${p.producto}</option>`).join('');await pendientes()}catch(e){msg('loginMsg',e.message)}}async function pendientes(){clear('pendMsg');try{const d=await api('pending');const a=d.pendientes||[];$('pendientes').innerHTML=a.length?a.map(t=>{const det=t.tipo_control==='SERIAL'?`${t.serial?.serial||''} · ${t.producto?.producto||''}`:`${t.cantidad} × ${t.producto?.producto||''}`;return `<div class="item"><span class="pill">PENDIENTE</span><br><b>${det}</b><br>De: ${t.entrega?.nombre||''} (${t.entrega?.unidad_grupo||''})<br>Para: ${t.recibe?.nombre||''} (${t.recibe?.unidad_grupo||''})<br><span class="muted">${t.motivo||''}</span><div class="grid"><button class="accept" onclick="responder('${t.id}','ACEPTAR')">Aceptar</button><button class="reject" onclick="responder('${t.id}','RECHAZAR')">Rechazar</button></div></div>`}).join(''):'<div class="muted" style="margin-top:12px">No tienes transferencias pendientes.</div>'}catch(e){msg('pendMsg',e.message)}}async function responder(id,decision){try{const nota=decision==='RECHAZAR'?prompt('Motivo del rechazo (opcional):')||'':'';const d=await api('respond',{transferencia_id:id,decision,nota});msg('pendMsg',`Transferencia ${d.estado.toLowerCase()}.`,true);await pendientes()}catch(e){msg('pendMsg',e.message)}}$('entrar').onclick=entrar;$('salir').onclick=()=>location.reload();$('actualizar').onclick=pendientes;$('tipo').onchange=()=>{const s=$('tipo').value==='SERIAL';$('serialWrap').classList.toggle('hidden',!s);$('cantWrap').classList.toggle('hidden',s)};$('enviar').onclick=async()=>{clear('envMsg');try{const tipo=$('tipo').value,p={receptor_id:$('receptor').value,tipo_control:tipo,motivo:$('motivo').value.trim(),observacion:$('obs').value.trim()};if(tipo==='SERIAL')p.serial=$('serial').value.trim();else{p.producto_id=$('producto').value;p.cantidad=Number($('cantidad').value)}const d=await api('create',p);msg('envMsg',`${d.detalle} → ${d.para}. Quedó PENDIENTE hasta que acepte.`,true);$('serial').value='';$('cantidad').value=''}catch(e){msg('envMsg',e.message)}};</script></body></html>
