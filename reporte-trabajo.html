<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de trabajo · DISPROTEL</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f7f9;color:#17313d;margin:0;padding:14px}.wrap{max-width:900px;margin:auto}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 7px 24px rgba(0,0,0,.08);margin:14px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#f7fafb;border-radius:12px;padding:12px}.label{font-size:12px;color:#60737c}.value{font-weight:800;margin-top:3px}.muted{color:#60737c;font-size:13px}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#e8f6ed;color:#1b6c43;font-size:12px;font-weight:800;margin:3px}.line{padding:10px 0;border-bottom:1px solid #e5ecef}.line:last-child{border-bottom:0}button,a.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:#17313d;color:#fff;font-size:15px;font-weight:800;margin-top:10px;text-decoration:none;text-align:center}.secondary{background:#e8eef1;color:#17313d}.msg{padding:12px;border-radius:10px;margin-top:12px}.err{background:#fdecec;color:#9d2525}.ok{background:#e8f6ed;color:#1b6c43}.hidden{display:none!important}@media(max-width:620px){.row{grid-template-columns:1fr}.card{padding:14px}}</style></head><body><div class="wrap"><section class="card"><h1>📋 REPORTE DE TRABAJO</h1><div id="contenido" class="muted">Cargando...</div><button id="pdf" class="hidden">📄 GENERAR PDF</button><button id="volver" class="secondary">← REGRESAR</button></section></div><script>const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-reporte-orden';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let REP=null;function ses(){for(const k of ['disprotel_ordenes_oficina_test','disprotel_ip_test','disprotel_trabajos_test']){try{const x=JSON.parse(sessionStorage.getItem(k)||'null');if(x?.usuario&&x?.pin)return x}catch{}}return null}function oid(){return new URLSearchParams(location.search).get('orden')||''}function fmt(v){if(!v)return'—';try{return new Date(v).toLocaleString('es-EC')}catch{return v}}function ev(t){return({SERIAL:'Serial / equipo',VIVIENDA:'Fachada',EQUIPOS_GENERAL:'Equipos instalados',SPEEDTEST:'Speedtest',TV:'TV funcionando'})[t]||t}async function load(){const s=ses();if(!s)return $('contenido').innerHTML='<div class="msg err">No hay una sesión activa. Regresa al módulo desde donde abriste el reporte.</div>';try{const r=await fetch(API+'?t='+Date.now(),{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:s.usuario,pin:s.pin,action:'summary',orden_id:oid()})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');REP=d.reporte;render(REP);$('pdf').classList.remove('hidden')}catch(e){$('contenido').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}function render(r){const o=r.orden||{},c=r.cliente||{},sol=r.solicitante||{},t=r.tecnico||{},sv=r.servicio||{},i=r.instalacion||{},items=r.items||[],e=r.evidencias||[];$('contenido').innerHTML=`<div class="msg ok"><b>${o.estado==='COMPLETADA'||r.cierre?'✅ TRABAJO CONCLUIDO':'REPORTE EN PROCESO'}</b>${r.cierre?`<br>${esc(r.cierre.cerrado_por||'')} · ${esc(fmt(r.cierre.cerrado_at))}`:''}</div><div class="row"><div class="item"><div class="label">OT</div><div class="value">${esc(o.id_orden||'—')}</div></div><div class="item"><div class="label">Cliente</div><div class="value">${esc(c.nombre||'—')}</div></div><div class="item"><div class="label">Solicitado por</div><div class="value">${esc(sol.nombre||'—')}</div></div><div class="item"><div class="label">Técnico / Grupo</div><div class="value">${esc(t.nombre||'—')} · ${esc(t.grupo||'—')}</div></div><div class="item"><div class="label">Servicio / Plan</div><div class="value">${sv.tv?'INTERNET + TV':'INTERNET'} · ${esc(sv.plan||'—')}</div></div><div class="item"><div class="label">IP confirmada</div><div class="value">${esc(sv.ip||'—')}</div></div></div><div class="item" style="margin-top:10px"><div class="label">Dirección</div><div class="value">${esc(c.direccion||'—')}</div></div><h3 style="margin-bottom:4px">📦 Equipos y materiales</h3>${items.map(x=>{const p=x.producto||{},ser=x.serial?.serial;return `<div class="line"><b>${esc(p.producto||p.codigo||'ARTÍCULO')}</b>${ser?` · SERIAL ${esc(ser)}`:` · ${esc(x.cantidad||0)} ${esc(x.unidad||'UNIDAD')}`}</div>`}).join('')||'<div class="muted">Sin artículos.</div>'}<h3 style="margin-bottom:4px;margin-top:18px">📷 Evidencias</h3><div>${e.map(x=>`<span class="badge">✅ ${esc(ev(x.tipo_foto))}</span>`).join('')||'<span class="muted">Sin evidencias.</span>'}</div>${i.observacion?`<h3 style="margin-bottom:4px;margin-top:18px">📝 Observaciones</h3><div>${esc(i.observacion)}</div>`:''}`}
async function pdf(){const r=REP;if(!r)return;if(!window.jspdf){await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)})}const {jsPDF}=window.jspdf,doc=new jsPDF();let y=18;const o=r.orden||{},c=r.cliente||{},sol=r.solicitante||{},t=r.tecnico||{},sv=r.servicio||{},i=r.instalacion||{};doc.setFontSize(16);doc.setFont('helvetica','bold');doc.text('DISPROTEL - REPORTE DE TRABAJO',14,y);y+=10;doc.setFontSize(10);const ln=(a,b)=>{doc.setFont('helvetica','bold');doc.text(a,14,y);doc.setFont('helvetica','normal');const z=doc.splitTextToSize(String(b||'—'),140);doc.text(z,58,y);y+=Math.max(7,z.length*5)};ln('OT:',o.id_orden);ln('Cliente:',c.nombre);ln('Solicitado por:',sol.nombre);ln('Técnico:',t.nombre);ln('Grupo:',t.grupo);ln('Dirección:',c.direccion);ln('Servicio:',sv.tv?'INTERNET + TV':'INTERNET');ln('Plan:',sv.plan);ln('IP:',sv.ip);ln('Fecha:',fmt(i.fecha_hora||i.fecha_registro));y+=4;doc.setFont('helvetica','bold');doc.text('EQUIPOS Y MATERIALES',14,y);y+=7;doc.setFont('helvetica','normal');for(const x of r.items||[]){const p=x.producto||{},ser=x.serial?.serial,tx='- '+(p.producto||p.codigo||'ARTÍCULO')+(ser?' · SERIAL '+ser:' · '+(x.cantidad||0)+' '+(x.unidad||'UNIDAD'));const z=doc.splitTextToSize(tx,180);doc.text(z,14,y);y+=z.length*5;if(y>275){doc.addPage();y=18}}y+=4;doc.setFont('helvetica','bold');doc.text('EVIDENCIAS',14,y);y+=7;doc.setFont('helvetica','normal');for(const x of r.evidencias||[]){doc.text('✓ '+ev(x.tipo_foto),14,y);y+=5}if(r.cierre){y+=5;doc.setFont('helvetica','bold');doc.text('TRABAJO CONCLUIDO · '+(r.cierre.cerrado_por||'')+' · '+fmt(r.cierre.cerrado_at),14,y)}doc.save('Reporte-'+(o.id_orden||'OT')+'.pdf')} $('pdf').onclick=pdf;$('volver').onclick=()=>history.length>1?history.back():location.href='index.html';load();</script></body></html>
