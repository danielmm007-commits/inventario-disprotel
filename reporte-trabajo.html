<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de trabajo · DISPROTEL</title><style>@page{size:A4;margin:12mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#eef2f5;color:#17313d;margin:0;padding:18px}.toolbar{max-width:210mm;margin:0 auto 12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.toolbar button{border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;background:#17313d;color:#fff}.toolbar .secondary{background:#dfe7eb;color:#17313d}.sheet{width:210mm;min-height:297mm;margin:0 auto;background:#fff;padding:14mm;box-shadow:0 8px 30px rgba(0,0,0,.12)}h1{margin:0 0 4px;font-size:22px}.sub{font-size:12px;color:#60737c;margin-bottom:14px}.status{padding:9px 11px;border-radius:8px;background:#e8f6ed;color:#1b6c43;font-weight:800;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{border:1px solid #dbe3e7;border-radius:8px;padding:9px}.label{font-size:10px;color:#60737c;text-transform:uppercase}.value{font-size:13px;font-weight:800;margin-top:3px;overflow-wrap:anywhere}.full{grid-column:1/-1}.section{margin-top:16px}.section h2{font-size:14px;margin:0 0 7px;padding-bottom:5px;border-bottom:2px solid #17313d}.line{padding:6px 0;border-bottom:1px solid #e5ecef;font-size:12px}.line:last-child{border-bottom:0}.badge{display:inline-block;padding:5px 7px;border-radius:999px;background:#e8f6ed;color:#1b6c43;font-size:10px;font-weight:800;margin:2px}.foot{margin-top:18px;padding-top:8px;border-top:1px solid #cfd9de;font-size:10px;color:#60737c}.msg{padding:12px;border-radius:8px}.err{background:#fdecec;color:#9d2525}@media(max-width:900px){body{padding:8px}.toolbar{grid-template-columns:1fr}.sheet{width:100%;min-height:auto;padding:14px}.grid{grid-template-columns:1fr}}@media print{body{background:#fff;padding:0}.toolbar{display:none!important}.sheet{width:auto;min-height:auto;margin:0;padding:0;box-shadow:none}.section,.item{break-inside:avoid}.foot{position:relative}}</style></head><body><div class="toolbar"><button id="volver" class="secondary">← REGRESAR</button><button id="imprimir">🖨️ IMPRIMIR / GUARDAR PDF</button></div><main id="hoja" class="sheet"><div id="contenido">Cargando reporte...</div></main><script>const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-reporte-orden';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function ses(){for(const k of ['disprotel_ordenes_oficina_test','disprotel_ip_test','disprotel_trabajos_test']){try{const x=JSON.parse(sessionStorage.getItem(k)||'null');if(x?.usuario&&x?.pin)return x}catch{}}return null}function oid(){return new URLSearchParams(location.search).get('orden')||''}function fmt(v){if(!v)return'—';try{return new Date(v).toLocaleString('es-EC')}catch{return String(v)}}function ev(t){return({SERIAL:'Serial / equipo',VIVIENDA:'Fachada',EQUIPOS_GENERAL:'Equipos instalados',SPEEDTEST:'Speedtest',TV:'TV funcionando'})[t]||t}async function load(){const s=ses();if(!s)return $('contenido').innerHTML='<div class="msg err">No hay una sesión activa. Regresa al módulo desde donde abriste el reporte.</div>';try{const r=await fetch(API+'?t='+Date.now(),{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:s.usuario,pin:s.pin,action:'summary',orden_id:oid()})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');render(d.reporte||{})}catch(e){$('contenido').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}function render(r){const o=r.orden||{},c=r.cliente||{},sol=r.solicitante||{},t=r.tecnico||{},sv=r.servicio||{},i=r.instalacion||{},items=r.items||[],e=r.evidencias||[],cerrado=o.estado==='COMPLETADA'||r.cierre;const gps=i.latitud!=null&&i.longitud!=null?i.latitud+', '+i.longitud:'—';$('contenido').innerHTML=`<h1>DISPROTEL · REPORTE DE TRABAJO</h1><div class="sub">Documento generado desde la orden técnica registrada en el sistema.</div><div class="status">${cerrado?'✅ TRABAJO CONCLUIDO':'⚠️ REPORTE EN PROCESO'}${r.cierre?` · ${esc(r.cierre.cerrado_por||'')} · ${esc(fmt(r.cierre.cerrado_at))}`:''}</div><div class="grid"><div class="item"><div class="label">OT</div><div class="value">${esc(o.id_orden||'—')}</div></div><div class="item"><div class="label">Estado</div><div class="value">${cerrado?'TRABAJO CONCLUIDO':esc(o.estado||'—')}</div></div><div class="item full"><div class="label">Cliente</div><div class="value">${esc(c.nombre||'—')}</div></div><div class="item"><div class="label">Solicitado por</div><div class="value">${esc(sol.nombre||'—')}</div></div><div class="item"><div class="label">Técnico / Grupo</div><div class="value">${esc(t.nombre||'—')} · ${esc(t.grupo||'—')}</div></div><div class="item"><div class="label">Servicio / Plan</div><div class="value">${sv.tv?'INTERNET + TV':'INTERNET'} · ${esc(sv.plan||'—')}</div></div><div class="item"><div class="label">IP confirmada</div><div class="value">${esc(sv.ip||'—')}</div></div><div class="item full"><div class="label">Dirección</div><div class="value">${esc(c.direccion||'—')}</div></div><div class="item"><div class="label">Fecha / hora del trabajo</div><div class="value">${esc(fmt(i.fecha_hora||i.fecha_registro))}</div></div><div class="item"><div class="label">Ubicación GPS</div><div class="value">${esc(gps)}</div></div></div><section class="section"><h2>Equipos y materiales utilizados</h2>${items.map(x=>{const p=x.producto||{},ser=x.serial?.serial;return `<div class="line"><b>${esc(p.producto||p.codigo||'ARTÍCULO')}</b>${ser?` · SERIAL ${esc(ser)}`:` · ${esc(x.cantidad||0)} ${esc(x.unidad||'UNIDAD')}`}</div>`}).join('')||'<div class="line">Sin artículos registrados.</div>'}</section><section class="section"><h2>Evidencias registradas</h2><div>${e.map(x=>`<span class="badge">✅ ${esc(ev(x.tipo_foto))}</span>`).join('')||'<span>Sin evidencias registradas.</span>'}</div></section>${i.observacion?`<section class="section"><h2>Observaciones</h2><div class="line">${esc(i.observacion)}</div></section>`:''}<div class="foot">DISPROTEL · Reporte asociado a la OT ${esc(o.id_orden||'—')}. Este documento corresponde al reporte oficial almacenado para esta orden.</div>`} $('imprimir').onclick=()=>window.print();$('volver').onclick=()=>history.length>1?history.back():location.href='index.html';load();</script></body></html>
