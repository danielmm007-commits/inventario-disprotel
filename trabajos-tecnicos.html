<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trabajos técnicos</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f7f9;color:#17313d;margin:0;padding:14px}.wrap{max-width:820px;margin:auto}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 7px 24px rgba(0,0,0,.08);margin:14px 0}h1,h2{margin-top:0}.muted{color:#60737c;font-size:13px}.job{border:1px solid #d7e1e5;border-radius:14px;padding:14px;margin-top:10px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2f4;font-size:12px;font-weight:700}.waiting{background:#fff3cd;color:#725b00}.done{background:#e8f6ed;color:#1b6c43}input{width:100%;padding:13px;border:1px solid #cbd8de;border-radius:11px;font-size:16px;background:#fff}label{display:block;font-weight:700;margin:12px 0 6px}button,a.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:#17313d;color:#fff;font-size:16px;font-weight:700;margin-top:10px;text-decoration:none;text-align:center}.secondary{background:#e8eef1!important;color:#17313d!important}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.msg{padding:12px;border-radius:10px;margin-top:12px}.ok{background:#e8f6ed;color:#1b6c43}.err{background:#fdecec;color:#9d2525}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="card" id="login"><h1>Trabajos técnicos</h1><div class="muted">Acepta trabajos disponibles y revisa los trabajos de tu grupo.</div><label>Usuario</label><input id="usuario"><label>PIN</label><input id="pin" inputmode="numeric"><button id="entrar">Entrar</button><div id="loginMsg"></div></section><div id="app" class="hidden"><section class="card"><h2 id="quien"></h2><div id="grupo" class="muted"></div><button id="recargar" class="secondary">🔄 Actualizar trabajos</button><button id="salir" class="secondary">Cambiar usuario</button></section><section class="card"><h2>🔔 Trabajos disponibles</h2><div id="disponibles"></div></section><section class="card"><h2>Mis trabajos / grupo</h2><div id="mios"></div></section><div id="msg"></div></div></div><script>const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-ordenes',KEY='disprotel_trabajos_test',INSTKEY='disprotel_instalacion_orden_test';let US='',PIN='',ME=null,ultimoPend=0;const $=id=>document.getElementById(id);async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:US,pin:PIN,action,...payload})});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw new Error(d.error||'Error');return d}function fmt(x){try{return new Date(x).toLocaleString()}catch{return x}}function tipo(t){return ({INSTALACION_INTERNET:'Instalación internet',INSTALACION_INTERNET_TV:'Internet + TV',ACTIVACION_TV_EXISTENTE:'Activación TV',CAMBIO_EQUIPOS:'Cambio equipos',SOPORTE_TECNICO:'Soporte técnico',REUBICACION:'Reubicación',RETIRO:'Retiro',OTRO:'Otro'})[t]||t}function showMsg(t,ok=false){$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=t}function jobHtml(o,disp=false){const ip=o.ip_solicitudes?.find(x=>x.estado==='ASIGNADA');return `<div class="job"><b>${o.id_orden} · ${o.cliente_nombre}</b><br><span class="badge ${o.estado==='ESPERANDO_IP'?'waiting':o.estado==='IP_ASIGNADA'?'done':''}">${o.estado}</span><div class="muted">${tipo(o.tipo_trabajo)} · ${o.plan_final||o.plan_solicitado||'Sin plan'}${o.tv_final===true||o.tv_solicitada?' · TV':''}</div><div>${o.cliente_direccion||''}${o.cliente_referencia?' · '+o.cliente_referencia:''}</div><div class="muted">${o.cliente_telefono||''} · ${fmt(o.fecha_solicitud)}</div>${ip?`<div class="msg ok"><b>✅ IP ASIGNADA</b><br><span style="font-size:22px">${ip.ip_asignada}</span><br><span class="muted">${ip.asignada_por?.nombre||''} · ${fmt(ip.asignada_at)}</span><button class="secondary" onclick="copiar('${ip.ip_asignada}')">COPIAR IP</button></div>`:''}${disp?`<button onclick="aceptar('${o.id}')">ACEPTAR TRABAJO</button>`:`<div class="grid">${o.tipo_trabajo.startsWith('INSTALACION')||o.tipo_trabajo==='ACTIVACION_TV_EXISTENTE'||o.tipo_trabajo==='CAMBIO_EQUIPOS'?`<button onclick='abrirInst(${JSON.stringify(JSON.stringify(o))})'>ABRIR INSTALACIÓN</button>`:''}${!ip&&['ACEPTADA','EN_CAMINO','EN_PROCESO','ESPERANDO_IP'].includes(o.estado)?`<button class="secondary" onclick='pedirIp(${JSON.stringify(JSON.stringify(o))})'>SOLICITAR / REVISAR IP</button>`:''}</div>`}</div>`}async function cargar(){try{const d=await api('available-orders');const av=d.ordenes||[];$('disponibles').innerHTML=av.map(o=>jobHtml(o,true)).join('')||'<div class="muted">No hay trabajos disponibles.</div>';if(av.length>ultimoPend&&ultimoPend>0&&'Notification'in window&&Notification.permission==='granted')new Notification('DISPROTEL · Nuevo trabajo',{body:`Hay ${av.length} trabajo(s) disponibles para ${ME?.unidad_grupo||'tu grupo'}.`});ultimoPend=av.length;const m=await api('my-orders');const mine=(m.ordenes||[]).filter(o=>o.grupo_asignado===ME.unidad_grupo||o.aceptado_por_id===ME.id);$('mios').innerHTML=mine.map(o=>jobHtml(o,false)).join('')||'<div class="muted">No hay trabajos aceptados.</div>'}catch(e){showMsg(e.message)}}async function aceptar(id){try{await api('accept-order',{orden_id:id});showMsg('Trabajo aceptado por tu grupo.',true);await cargar()}catch(e){showMsg(e.message)}}function abrirInst(raw){const o=JSON.parse(raw);sessionStorage.setItem(INSTKEY,JSON.stringify(o));sessionStorage.setItem('disprotel_instalaciones_test_session',JSON.stringify({usuario:US,pin:PIN}));location.href='instalaciones.html?orden='+encodeURIComponent(o.id)}async function pedirIp(raw){const o=JSON.parse(raw),plan=prompt('Plan final que quedó contratado:',o.plan_final||o.plan_solicitado||'')||'';if(!plan)return;const tv=confirm('¿La instalación final incluye TV?\nAceptar = Sí / Cancelar = No');try{await api('request-ip',{orden_id:o.id,plan_final:plan,tv_final:tv});showMsg('IP solicitada. Los asignadores autorizados ya pueden responder.',true);await cargar()}catch(e){showMsg(e.message)}}async function copiar(t){try{await navigator.clipboard.writeText(t);showMsg('IP copiada.',true)}catch{prompt('Copia la IP:',t)}}async function entrar(){US=$('usuario').value.trim();PIN=$('pin').value.trim();try{const d=await api('context');if(d.me.rol!=='TÉCNICO')throw new Error('Este módulo es para técnicos.');ME=d.me;sessionStorage.setItem(KEY,JSON.stringify({usuario:US,pin:PIN}));$('login').classList.add('hidden');$('app').classList.remove('hidden');$('quien').textContent=`${ME.nombre}`;$('grupo').textContent=`Grupo: ${ME.unidad_grupo}`;if('Notification'in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{});await cargar();setInterval(cargar,20000)}catch(e){$('loginMsg').className='msg err';$('loginMsg').textContent=e.message}}$('entrar').onclick=entrar;$('recargar').onclick=cargar;$('salir').onclick=()=>{sessionStorage.removeItem(KEY);location.reload()};(async()=>{try{const s=JSON.parse(sessionStorage.getItem(KEY)||'null');if(s?.usuario&&s?.pin){$('usuario').value=s.usuario;$('pin').value=s.pin;await entrar()}}catch{sessionStorage.removeItem(KEY)}})();</script></body></html>
