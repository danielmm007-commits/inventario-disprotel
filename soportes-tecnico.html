<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soportes técnicos</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f7f9;color:#17313d;margin:0;padding:14px}.wrap{max-width:820px;margin:auto}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 7px 24px rgba(0,0,0,.08);margin:14px 0}h1,h2{margin-top:0}.muted{color:#60737c;font-size:13px}.job{border:1px solid #d7e1e5;border-radius:14px;padding:14px;margin-top:10px;background:#fff}.estado-pendiente{background:#fff8df;border-color:#ecd88c}.estado-aceptada,.estado-en_proceso{background:#eef7ff;border-color:#9ec9eb}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2f4;font-size:12px;font-weight:700}input{width:100%;padding:13px;border:1px solid #cbd8de;border-radius:11px;font-size:16px}label{display:block;font-weight:700;margin:12px 0 6px}button,a.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:#17313d;color:#fff;font-size:16px;font-weight:700;margin-top:10px;text-decoration:none;text-align:center}.secondary{background:#e8eef1!important;color:#17313d!important}.hidden{display:none!important}.msg{padding:12px;border-radius:10px;margin-top:12px}.ok{background:#e8f6ed;color:#1b6c43}.err{background:#fdecec;color:#9d2525}</style><link rel="stylesheet" href="responsive-global.css?v=20260818-2305"></head><body><div class="wrap"><section id="login" class="card"><h1>🛠️ Soportes técnicos</h1><div class="muted">Módulo exclusivo de soporte. Aquí no se muestran instalaciones ni otros trabajos.</div><label>Usuario técnico</label><input id="usuario"><label>PIN</label><input id="pin" inputmode="numeric"><button id="entrar">Entrar</button><div id="loginMsg"></div></section><div id="app" class="hidden"><section class="card"><h2 id="quien"></h2><div id="grupo" class="muted"></div><button id="recargar" class="secondary">🔄 Actualizar soportes</button><button id="salir" class="secondary">Cambiar usuario</button></section><section class="card"><h2>🔔 Soportes disponibles</h2><div id="disponibles"></div></section><section class="card"><h2>📋 Soportes activos del grupo</h2><div id="activos"></div></section><div id="msg"></div></div></div><script>const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-ordenes',KEY='disprotel_trabajos_test';let US='',PIN='',ME=null;const $=id=>document.getElementById(id);async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:US,pin:PIN,action,...payload})});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw new Error(d.error||'Error');return d}function show(t,ok=false){$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=t}function job(o,disp=false){return `<div class="job estado-${String(o.estado||'').toLowerCase()}"><b>${o.id_orden} · ${o.cliente_nombre}</b><br><span class="badge">${o.estado}</span><div style="margin-top:7px"><b>Servicio:</b> ${o.cliente_referencia||'—'}</div><div><b>Plan:</b> ${o.plan_solicitado||'—'}</div><div><b>Dirección:</b> ${o.cliente_direccion||'—'}</div><div><b>Teléfono:</b> ${o.cliente_telefono||'—'}</div>${disp?`<button onclick="aceptar('${o.id}')">ACEPTAR SOPORTE</button>`:`<button onclick="abrir('${o.id}')">ABRIR SOPORTE</button>`}</div>`}async function cargar(){try{const [a,m]=await Promise.all([api('available-orders'),api('my-active')]);const av=(a.ordenes||[]).filter(o=>o.tipo_trabajo==='SOPORTE_TECNICO');const ac=(m.ordenes||[]).filter(o=>o.tipo_trabajo==='SOPORTE_TECNICO');$('disponibles').innerHTML=av.map(o=>job(o,true)).join('')||'<div class="muted">No hay soportes disponibles.</div>';$('activos').innerHTML=ac.map(o=>job(o,false)).join('')||'<div class="muted">No hay soportes activos.</div>'}catch(e){show(e.message)}}async function aceptar(id){try{await api('accept-order',{orden_id:id});show('Soporte aceptado correctamente.',true);await cargar()}catch(e){show(e.message)}}function abrir(id){location.href='soporte-tecnico.html?orden='+encodeURIComponent(id)}async function entrar(){US=$('usuario').value.trim();PIN=$('pin').value.trim();try{const d=await api('context');if(d.me.rol!=='TÉCNICO')throw new Error('Este módulo es para técnicos.');ME=d.me;sessionStorage.setItem(KEY,JSON.stringify({usuario:US,pin:PIN}));$('login').classList.add('hidden');$('app').classList.remove('hidden');$('quien').textContent=ME.nombre;$('grupo').textContent='Grupo: '+ME.unidad_grupo;await cargar()}catch(e){$('loginMsg').className='msg err';$('loginMsg').textContent=e.message}}$('entrar').onclick=entrar;$('recargar').onclick=cargar;$('salir').onclick=()=>{sessionStorage.removeItem(KEY);location.reload()};const s=JSON.parse(sessionStorage.getItem(KEY)||'null');if(s?.usuario&&s?.pin){$('usuario').value=s.usuario;$('pin').value=s.pin;entrar()}</script></body></html>
