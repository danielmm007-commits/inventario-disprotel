<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paso 4 · Operación</title><style>:root{--navy:#0b2a5c;--blue:#1f75d8;--cyan:#3ab8ff;--ink:#17313d;--muted:#718692;--line:#dbe7ee}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);min-height:100vh;background:radial-gradient(circle at 88% 8%,rgba(58,184,255,.25),transparent 24%),radial-gradient(circle at 5% 90%,rgba(31,117,216,.18),transparent 28%),linear-gradient(135deg,#eef8fd,#cfe4f2);padding:16px}.shell{max-width:1180px;margin:auto;background:rgba(255,255,255,.96);border-radius:24px;box-shadow:0 24px 70px rgba(11,42,92,.2);overflow:hidden}.top{padding:18px 20px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--blue));display:flex;align-items:center;gap:14px}.brand{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:23px}.top h1{margin:0;font-size:24px}.top p{margin:4px 0 0;font-size:10px;color:#d9ecfb}.autosave{margin-left:auto;font-size:8px;font-weight:900;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.18)}.body{padding:16px}.panel{display:block}.hero{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}.heroIco{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;font-size:20px}.hero h2{margin:0;font-size:18px;color:#123d70}.hero p{margin:4px 0 0;font-size:9px;line-height:1.5;color:#718692}.btn{border:0;border-radius:10px;padding:9px 12px;font-size:9px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;box-shadow:0 7px 16px rgba(11,42,92,.18);transition:transform .14s,filter .14s,box-shadow .14s}.btn:hover{transform:translateY(-2px) scale(1.02);filter:brightness(1.06);box-shadow:0 11px 20px rgba(11,42,92,.24)}.btn:active{transform:translateY(2px) scale(.97)}.smallBtn{border:1px solid #d5e3ec;background:#f8fbfd;border-radius:9px;padding:8px;font-size:8px;font-weight:900;color:#2e5572;cursor:pointer;transition:.14s}.smallBtn:hover{transform:translateY(-1px)}.toast{position:fixed;right:16px;bottom:16px;width:min(360px,calc(100vw - 32px));background:#0c315f;color:#fff;border-radius:13px;padding:11px;display:none;box-shadow:0 18px 40px #0004;z-index:50}.toast.show{display:block}.toast b{font-size:10px}.toast p{font-size:8px;color:#dceafa;margin:4px 0 0}@media(max-width:560px){body{padding:0}.shell{border-radius:0;min-height:100vh}}</style></head><body><main class="shell"><header class="top"><div class="brand">🧭</div><div><h1>Paso 4 · Operación</h1><p>Vista independiente para probar bodegas, grupos y minibodegas sin depender del asistente.</p></div><div class="autosave">GUARDADO LOCAL</div></header><section class="body"><div class="panel" data-step="3"></div></section></main><div class="toast" id="toast"><b id="toastTitle"></b><p id="toastText"></p></div><script>const defaults={warehouses:['Bodega Matriz Salcedo','Bodega Saquisilí'],groups:['Grupo Salcedo · Camioneta','Grupo Salcedo · Furgoneta','Grupo Saquisilí–Latacunga'],minis:['Camioneta Mazda','Furgoneta','Unidad Saquisilí–Latacunga'],users:[]};function load(){try{return Object.assign(structuredClone(defaults),JSON.parse(localStorage.getItem('disprotel_puesta_en_marcha_v1')||'{}'))}catch{return structuredClone(defaults)}}window.state=load();function save(){localStorage.setItem('disprotel_puesta_en_marcha_v1',JSON.stringify(window.state))}function toast(t,m){const e=document.getElementById('toast');document.getElementById('toastTitle').textContent=t;document.getElementById('toastText').textContent=m||'';e.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>e.classList.remove('show'),2600)}window.save=save;window.toast=toast;</script><script src="operacion-ux-integrada-v3.js?v=standalone1"></script></body><
