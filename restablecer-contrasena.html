<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nueva contraseña · DISPROTEL</title><style>
:root{--navy:#0b2a5c;--blue:#1f75d8;--line:#d4e3ed;--ink:#17313d;--muted:#6c7f89}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;display:grid;place-items:center;background:radial-gradient(circle at 85% 10%,#d2efff,transparent 26%),linear-gradient(135deg,#edf5fa,#dce9f1);font-family:Arial,sans-serif;color:var(--ink)}.card{width:min(520px,100%);background:#fff;border:1px solid #fff;border-radius:25px;padding:28px;box-shadow:0 25px 70px rgba(11,42,92,.2)}.icon{width:55px;height:55px;border-radius:17px;display:grid;place-items:center;background:#e7f2fb;font-size:27px}.eyebrow{margin-top:17px;color:#2c6fae;font-size:11px;font-weight:1000;letter-spacing:.13em}.card h1{margin:7px 0 9px;color:var(--navy)}.sub{font-size:13px;line-height:1.55;color:var(--muted)}label{display:block;margin:15px 0 7px;font-size:12px;font-weight:900}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:16px;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,117,216,.1)}.rules{margin:13px 0;padding:12px 14px;border-radius:12px;background:#f4f8fb;font-size:11px;line-height:1.55;color:#56707e}.go{width:100%;margin-top:17px;padding:15px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--navy),#1e6cbb);color:#fff;font-weight:1000;cursor:pointer}.go:disabled{opacity:.55}.msg{margin-top:13px;padding:11px;border-radius:11px;font-size:12px;display:none}.msg.show{display:block}.ok{background:#e9f7ee;color:#226e49}.bad{background:#ffeded;color:#9a3535}.loading{text-align:center;padding:18px;color:var(--muted)}#form{display:none}</style></head><body><main class="card"><div class="icon">🔐</div><div class="eyebrow">DISPROTEL · RECUPERACIÓN SEGURA</div><h1>Crear nueva contraseña</h1><p class="sub">Este enlace permite reemplazar tu contraseña. La contraseña anterior dejará de funcionar inmediatamente.</p><div id="loading" class="loading">Validando el enlace seguro…</div><form id="form"><label for="password">Nueva contraseña</label><input id="password" type="password" autocomplete="new-password" maxlength="72"><label for="confirm">Repetir contraseña</label><input id="confirm" type="password" autocomplete="new-password" maxlength="72"><div class="rules">Debe contener al menos 10 caracteres, una mayúscula, una minúscula, un número y un carácter especial.</div><button id="save" class="go" type="submit">GUARDAR NUEVA CONTRASEÑA →</button></form><div id="msg" class="msg"></div></main><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='https://ajnbswrwnjpjypjiorye.supabase.co';
const KEY='sb_publishable_PUj8G-mCFGniennS16O7UQ_eIeL482Y';
const API=URL+'/functions/v1/inventario-password-admin';
const supabase=createClient(URL,KEY,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const form=document.getElementById('form'),loading=document.getElementById('loading'),msg=document.getElementById('msg'),save=document.getElementById('save');let session=null;
function show(t,type='bad'){msg.className='msg show '+type;msg.textContent=t}
function ready(s){session=s;loading.style.display='none';form.style.display='block';document.getElementById('password').focus()}
const hash=new URLSearchParams(location.hash.replace(/^#/,''));if(hash.get('error_description')){loading.style.display='none';show(decodeURIComponent(hash.get('error_description')))}
supabase.auth.onAuthStateChange((event,s)=>{if(event==='PASSWORD_RECOVERY'||(s&&!session))ready(s)});
const initial=await supabase.auth.getSession();if(initial.data?.session)ready(initial.data.session);else setTimeout(()=>{if(!session&&loading.style.display!=='none'){loading.style.display='none';show('El enlace no es válido o ya venció. Solicita una nueva recuperación.')}},4500);
form.addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('password').value,b=document.getElementById('confirm').value;if(a!==b){show('Las contraseñas no coinciden.');return}if(a.length<10||!/[A-Z]/.test(a)||!/[a-z]/.test(a)||!/\d/.test(a)||!/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>/?]/.test(a)){show('La contraseña todavía no cumple todas las reglas.');return}save.disabled=true;save.textContent='GUARDANDO…';try{const updated=await supabase.auth.updateUser({password:a});if(updated.error)throw updated.error;const current=(await supabase.auth.getSession()).data.session;const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+current.access_token},body:JSON.stringify({action:'confirm_changed'})});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw new Error(d.error||'No se pudo confirmar el cambio');show('Contraseña actualizada correctamente. Volviendo al inicio de sesión…','ok');await supabase.auth.signOut();setTimeout(()=>location.replace('login-general-v2.html?v=auth1'),1400)}catch(e){show(e.message||'No se pudo cambiar la contraseña.');save.disabled=false;save.textContent='GUARDAR NUEVA CONTRASEÑA →'}});
</script></body></html>
