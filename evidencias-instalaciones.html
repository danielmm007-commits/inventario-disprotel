<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidencias de instalaciones</title><script src="https://unpkg.com/heic2any@0.0.4/dist/heic2any.min.js"></script><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f7f9;color:#17313d;margin:0;padding:14px}.wrap{max-width:760px;margin:auto}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 7px 24px rgba(0,0,0,.08);margin:14px 0}h1,h2,h3{margin-top:0}.muted{color:#60737c;font-size:13px}label{display:block;font-weight:700;margin:12px 0 6px}input,select{width:100%;padding:13px;border:1px solid #cbd8de;border-radius:11px;font-size:16px;background:#fff}button,a.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:#17313d;color:#fff;font-size:16px;font-weight:700;margin-top:10px;text-decoration:none;text-align:center}.secondary{background:#e8eef1!important;color:#17313d!important}.hidden{display:none!important}.msg{padding:12px;border-radius:10px;margin-top:12px;display:none}.ok{display:block;background:#e8f6ed;color:#1b6c43}.err{display:block;background:#fdecec;color:#9d2525}.warn{display:block;background:#fff3cd;color:#725b00}.inst{border:1px solid #d7e1e5;border-radius:14px;padding:14px;margin-top:10px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.badge{padding:5px 8px;border-radius:999px;background:#eef2f4;font-size:12px}.done{background:#e8f6ed;color:#1b6c43}.pending{background:#fff3cd;color:#725b00}.photo{border:1px solid #d7e1e5;border-radius:12px;padding:12px;margin-top:10px}.status{font-size:13px;margin-top:6px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:600px){.actions{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="card" id="login"><h1>Evidencias de instalaciones</h1><div class="muted">Puedes volver a una instalación ya registrada y completar las fotos faltantes.</div><label>Usuario</label><input id="usuario" placeholder="Ej. luis"><label>PIN</label><input id="pin" inputmode="numeric"><button id="entrar">Entrar</button><div id="loginMsg" class="msg"></div></section><div id="app" class="hidden"><section class="card"><h2 id="quien"></h2><div id="lista"></div><button id="salir" class="secondary">Cambiar usuario</button></section><section class="card hidden" id="editor"><h2 id="tituloInst"></h2><div id="detalleInst" class="muted"></div><div class="photo"><label>Foto del serial / equipo</label><input id="fotoSerial" type="file" accept="image/*,.heic,.heif"><div id="stSerial" class="status muted">Sin seleccionar.</div></div><div class="photo"><label>Foto de fachada</label><input id="fotoFachada" type="file" accept="image/*,.heic,.heif"><div id="stFachada" class="status muted">Sin seleccionar.</div></div><div class="photo"><label>Speedtest</label><div class="actions"><button id="tomarSpeed" class="secondary">Tomar foto ahora</button><button id="elegirSpeed" class="secondary">Elegir foto guardada</button></div><input id="fotoSpeedCam" type="file" accept="image/*,.heic,.heif" capture="environment" class="hidden"><input id="fotoSpeedGal" type="file" accept="image/*,.heic,.heif" class="hidden"><a class="btn secondary" href="https://www.speedtest.net/" target="_blank" rel="noopener">Abrir Speedtest</a><div class="muted">Haz la prueba, vuelve aquí y toma una foto del resultado o selecciona una captura guardada.</div><div id="stSpeed" class="status muted">Sin seleccionar.</div></div><button id="guardar">GUARDAR EVIDENCIAS SELECCIONADAS</button><div id="msg" class="msg"></div></section></div></div><script>const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-instalaciones';const SESSION_KEY='disprotel_instalaciones_test_session';let US='',PIN='',insts=[],actual=null;const $=id=>document.getElementById(id);async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:US,pin:PIN,action,...payload})});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw new Error(d.error||'Error');return d}function msg(t,cls='err'){const e=$('msg');e.className='msg '+cls;e.textContent=t}function clearMsg(){$('msg').className='msg'}function fmt(x){try{return new Date(x).toLocaleString()}catch{return x}}function renderLista(){if(!insts.length){$('lista').innerHTML='<div class="muted">No hay instalaciones recientes.</div>';return}$('lista').innerHTML=insts.map((x,i)=>`<div class="inst"><b>${x.cliente_nombre}</b><br><span class="muted">${x.id_instalacion} · ${fmt(x.fecha_hora)}</span><div class="badges"><span class="badge ${x.evidencias.serial?'done':'pending'}">Serial ${x.evidencias.serial?'✓':'pendiente'}</span><span class="badge ${x.evidencias.vivienda?'done':'pending'}">Fachada ${x.evidencias.vivienda?'✓':'pendiente'}</span><span class="badge ${x.evidencias.speedtest?'done':'pending'}">Speedtest ${x.evidencias.speedtest?'✓':'pendiente'}</span></div><button onclick="abrir(${i})">Completar evidencias</button></div>`).join('')}function abrir(i){actual=insts[i];$('editor').classList.remove('hidden');$('tituloInst').textContent=actual.cliente_nombre;$('detalleInst').textContent=`${actual.id_instalacion} · ${fmt(actual.fecha_hora)}${actual.registro_tardio?' · REGISTRO TARDÍO':''}`;window.scrollTo({top:$('editor').offsetTop-10,behavior:'smooth'})}function status(input,status){const f=input.files?.[0];status.textContent=f?`Seleccionada: ${f.name}`:'Sin seleccionar.'}async function toJpeg(file){let blob=file;const n=(file.name||'').toLowerCase();if(file.type==='image/heic'||file.type==='image/heif'||n.endsWith('.heic')||n.endsWith('.heif')){const out=await heic2any({blob:file,toType:'image/jpeg',quality:.82});blob=Array.isArray(out)?out[0]:out}const url=URL.createObjectURL(blob);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const max=1600,s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('No se pudo comprimir')),'image/jpeg',.78))}finally{URL.revokeObjectURL(url)}}function b64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)})}async function subir(file,tipo){if(!file)return false;const blob=await toJpeg(file);await api('upload-evidence',{instalacion_id:actual.id,tipo_evidencia:tipo,mime_type:'image/jpeg',base64:await b64(blob),tomada_at_cliente:new Date(file.lastModified||Date.now()).toISOString()});return true}async function recargar(){const d=await api('recent-installations');insts=d.instalaciones||[];renderLista()}async function entrar(){const lm=$('loginMsg');lm.className='msg';US=$('usuario').value.trim();PIN=$('pin').value.trim();try{await api('context');sessionStorage.setItem(SESSION_KEY,JSON.stringify({usuario:US,pin:PIN}));$('login').classList.add('hidden');$('app').classList.remove('hidden');$('quien').textContent=`Evidencias · ${US}`;await recargar()}catch(e){lm.className='msg err';lm.textContent=e.message}}$('entrar').onclick=entrar;$('salir').onclick=()=>{sessionStorage.removeItem(SESSION_KEY);location.reload()};$('fotoSerial').onchange=()=>status($('fotoSerial'),$('stSerial'));$('fotoFachada').onchange=()=>status($('fotoFachada'),$('stFachada'));$('tomarSpeed').onclick=()=>{$('fotoSpeedCam').click()};$('elegirSpeed').onclick=()=>{$('fotoSpeedGal').click()};$('fotoSpeedCam').onchange=()=>{if($('fotoSpeedCam').files?.[0])$('fotoSpeedGal').value='';status($('fotoSpeedCam'),$('stSpeed'))};$('fotoSpeedGal').onchange=()=>{if($('fotoSpeedGal').files?.[0])$('fotoSpeedCam').value='';status($('fotoSpeedGal'),$('stSpeed'))};$('guardar').onclick=async()=>{clearMsg();if(!actual){msg('Selecciona una instalación.');return}try{const fs=$('fotoSerial').files?.[0],ff=$('fotoFachada').files?.[0],fsp=$('fotoSpeedCam').files?.[0]||$('fotoSpeedGal').files?.[0];if(!fs&&!ff&&!fsp){msg('Selecciona al menos una evidencia.');return}let n=0;if(await subir(fs,'SERIAL_EQUIPO'))n++;if(await subir(ff,'FACHADA'))n++;if(await subir(fsp,'SPEEDTEST'))n++;msg(`${n} evidencia(s) guardadas correctamente.`,'ok');$('fotoSerial').value='';$('fotoFachada').value='';$('fotoSpeedCam').value='';$('fotoSpeedGal').value='';$('stSerial').textContent='Sin seleccionar.';$('stFachada').textContent='Sin seleccionar.';$('stSpeed').textContent='Sin seleccionar.';await recargar()}catch(e){msg(e.message)}};(async()=>{try{const s=JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null');if(s?.usuario&&s?.pin){US=s.usuario;PIN=s.pin;$('usuario').value=US;$('pin').value=PIN;await api('context');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('quien').textContent=`Evidencias · ${US}`;await recargar()}}catch{sessionStorage.removeItem(SESSION_KEY)}})();</script></body></html>
