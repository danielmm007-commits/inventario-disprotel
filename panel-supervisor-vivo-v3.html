<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel vivo Fernando v3</title><style>html,body{margin:0;height:100%;background:#eef4f7}#base{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="base" src="panel-supervisor-vivo-v2.html"></iframe><script>
const GPS='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-panel-gps';const f=document.getElementById('base');
function ses(){try{return JSON.parse(sessionStorage.getItem('disprotel_login_general_v2')||'{}')}catch{return{}}}
function norm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase()}
function colorEstado(t){const s=norm(t);if(s.includes('ESPERANDO')||s.includes('REASIGN'))return'#dc3545';if(s.includes('EVID')||s.includes('COMPROB'))return'#7c4dff';if(s.includes('TRABAJO')||s.includes('INICIADO')||s.includes('PROCESO'))return'#ff8a00';if(s.includes('LLEGADA'))return'#f2b600';if(s.includes('CAMINO'))return'#1f8ef1';if(s.includes('TOMADA')||s.includes('RECIBIDA'))return'#25a768';if(s.includes('CERR'))return'#138a4b';return'#3978c7'}
function inject(){const d=f.contentDocument,w=f.contentWindow;if(!d||!d.body)return;const st=d.createElement('style');st.textContent=`
body{background:linear-gradient(180deg,#edf5fb,#f6f9fb)!important}.hero{box-shadow:0 16px 38px rgba(11,55,112,.20)!important}.stat{position:relative;overflow:hidden;box-shadow:0 5px 16px rgba(11,55,112,.06)}.stat:before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#2f80d0,#67b7ff)}
.work{position:relative;overflow:hidden;background:linear-gradient(135deg,#fff,#f7fbff);box-shadow:0 8px 22px rgba(7,26,56,.08);transition:.25s transform,.25s box-shadow}.work:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(7,26,56,.14)}.work.livePulse{animation:livePulse 2.2s ease-in-out infinite}.work> b{display:inline-block;padding:7px 10px;border-radius:999px;color:#fff!important}.group{background:linear-gradient(145deg,#fff,#f8fbfd)}.att{box-shadow:0 5px 14px rgba(184,64,64,.08)}
#gpsOrnament{width:min(330px,100%);margin:10px 0 0 auto;padding:8px!important}#gpsMini{background:linear-gradient(135deg,#0c3470,#176eb7);color:#fff;border-radius:14px;padding:10px;min-height:118px;cursor:pointer;position:relative;overflow:hidden}#gpsMini:after{content:'AMPLIAR';position:absolute;right:8px;top:8px;font-size:8px;font-weight:900;background:#ffffff22;padding:4px 6px;border-radius:999px}.gpsCanvas{position:relative;height:72px;margin-top:7px;border-radius:10px;background:linear-gradient(135deg,#dff1ff,#eff8ff);overflow:hidden}.gpsGrid{position:absolute;inset:0;background-image:linear-gradient(#8fb8d833 1px,transparent 1px),linear-gradient(90deg,#8fb8d833 1px,transparent 1px);background-size:22px 22px}.gpsPoint{position:absolute;width:14px;height:14px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 4px #22c55e33,0 4px 10px #0b376633;animation:ping 2s infinite}.gpsLabel{position:absolute;transform:translate(10px,-5px);background:#fff;color:#173b63;border-radius:7px;padding:3px 5px;font-size:7px;font-weight:900;white-space:nowrap;box-shadow:0 3px 8px #0b376622}.gpsEmpty{color:#d8e9f7;font-size:10px;padding:22px 8px;text-align:center}#gpsModal{position:fixed;inset:0;background:#071a38aa;z-index:999;display:none;align-items:center;justify-content:center;padding:20px}#gpsModal.show{display:flex}#gpsModalBox{width:min(1050px,96vw);height:min(720px,90vh);background:#fff;border-radius:22px;padding:16px;box-shadow:0 25px 70px #071a3866}#gpsBig{height:calc(100% - 54px);margin-top:10px;border-radius:16px;background:linear-gradient(135deg,#dff1ff,#eff8ff);position:relative;overflow:hidden}.gpsBigPoint{position:absolute;width:26px;height:26px;border:5px solid #fff;border-radius:50%;box-shadow:0 0 0 7px #22c55e33,0 8px 18px #0b376644}.gpsInfo{position:absolute;transform:translate(20px,-8px);min-width:210px;background:#fff;border-radius:12px;padding:8px 10px;box-shadow:0 7px 18px #0b376633;font-size:11px;color:#173b63}@keyframes ping{50%{box-shadow:0 0 0 8px #22c55e18,0 4px 10px #0b376633}}@keyframes livePulse{50%{box-shadow:0 0 0 5px rgba(255,138,0,.10),0 12px 28px rgba(7,26,56,.12)}}@media(max-width:620px){#gpsOrnament{width:100%;margin-left:0}}`;
d.head.appendChild(st);
const grid=d.querySelector('.grid');if(grid&&!d.getElementById('gpsMini')){const sec=d.createElement('section');sec.id='gpsOrnament';sec.className='card';sec.innerHTML='<div id="gpsMini"><div style="font-size:13px;font-weight:900">📍 Ubicación</div><div style="font-size:8px;color:#d8e9f7">Último GPS real</div><div id="gpsMiniCanvas" class="gpsCanvas"><div class="gpsGrid"></div></div></div>';grid.parentNode.insertBefore(sec,grid.nextSibling)}
if(!d.getElementById('gpsModal')){const m=d.createElement('div');m.id='gpsModal';m.innerHTML='<div id="gpsModalBox"><div style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:20px">📍 Mapa operativo ampliado</b><div style="font-size:11px;color:#6f818b">Último punto GPS real disponible por grupo</div></div><button id="gpsClose" style="border:1px solid #dbe5ec;background:#fff;border-radius:10px;padding:8px 10px">✕</button></div><div id="gpsBig"><div class="gpsGrid"></div></div></div>';d.body.appendChild(m);d.getElementById('gpsClose').onclick=()=>m.classList.remove('show');m.onclick=e=>{if(e.target===m)m.classList.remove('show')}}
const oldCall=w.callNov;if(typeof oldCall==='function'&&!w.__patchedCallNov){w.__patchedCallNov=true;w.callNov=async function(body){const token=ses().session_token||'';d.getElementById('msg').textContent='Guardando…';try{const r=await fetch('https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-novedades-operativas',{method:'POST',headers:{'Content-Type':'application/json','x-session':token},body:JSON.stringify(body)}),j=await r.json();if(!r.ok){d.getElementById('msg').textContent='⚠ '+(j.error||'No se pudo guardar');return}d.getElementById('msg').textContent='✅ Guardado';setTimeout(()=>{try{w.closeModal()}catch{}},300);setTimeout(()=>{try{w.load()}catch{}},450)}catch(e){d.getElementById('msg').textContent='⚠ '+e.message}}}
const obs=new MutationObserver(()=>{d.querySelectorAll('.work').forEach(x=>{const b=x.querySelector('b');if(!b)return;const c=colorEstado(b.textContent);b.style.background=c;x.style.borderLeftColor=c;if(norm(b.textContent).includes('TRABAJO')||norm(b.textContent).includes('ESPERANDO'))x.classList.add('livePulse')})});obs.observe(d.body,{subtree:true,childList:true});loadGPS(d)}
async function loadGPS(d){const token=ses().session_token||'';if(!token)return;try{const r=await fetch(GPS,{method:'POST',headers:{'Content-Type':'application/json','x-session':token},body:'{}'}),j=await r.json();if(!r.ok)return;renderGPS(d,j.puntos||[])}catch{}}
function renderGPS(d,pts){const mini=d.getElementById('gpsMiniCanvas'),big=d.getElementById('gpsBig');if(!mini||!big)return;mini.querySelectorAll('.gpsPoint,.gpsLabel,.gpsEmpty').forEach(x=>x.remove());big.querySelectorAll('.gpsBigPoint,.gpsInfo,.gpsEmpty').forEach(x=>x.remove());if(!pts.length){mini.insertAdjacentHTML('beforeend','<div class="gpsEmpty">Sin GPS reciente.</div>');big.insertAdjacentHTML('beforeend','<div class="gpsEmpty">Sin ubicaciones GPS recientes.</div>');return}const lats=pts.map(p=>p.latitud),lngs=pts.map(p=>p.longitud),minLa=Math.min(...lats),maxLa=Math.max(...lats),minLo=Math.min(...lngs),maxLo=Math.max(...lngs);const pos=p=>({x:10+80*((p.longitud-minLo)/((maxLo-minLo)||1)),y:15+70*(1-(p.latitud-minLa)/((maxLa-minLa)||1))});pts.forEach((p,i)=>{const q=pos(p),clr=i%3===0?'#22c55e':i%3===1?'#1f8ef1':'#f59e0b';mini.insertAdjacentHTML('beforeend',`<div class="gpsPoint" style="left:${q.x}%;top:${q.y}%;background:${clr}"></div><div class="gpsLabel" style="left:${q.x}%;top:${q.y}%">${p.grupo.replace('Grupo ','')}</div>`);big.insertAdjacentHTML('beforeend',`<div class="gpsBigPoint" style="left:${q.x}%;top:${q.y}%;background:${clr}"></div><div class="gpsInfo" style="left:${q.x}%;top:${q.y}%"><b>${p.grupo}</b><br>${p.id_orden||''} · ${p.cliente||''}<br>GPS: ${new Date(p.capturado_at).toLocaleString('es-EC')}<br>${p.capturado_por||''}${p.precision_m?` · ±${Math.round(p.precision_m)} m`:''}</div>`)});d.getElementById('gpsMini').onclick=()=>d.getElementById('gpsModal').classList.add('show')}
f.addEventListener('load',()=>setTimeout(inject,300));
</script></body></html>
