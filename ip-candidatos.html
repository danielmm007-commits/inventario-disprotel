<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IP instalación · DISPROTEL</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f7f9;color:#17313d;margin:0;padding:14px}.wrap{max-width:760px;margin:auto}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 7px 24px rgba(0,0,0,.08);margin:14px 0}h1,h2{margin-top:0}.muted{color:#60737c;font-size:13px}.status{padding:12px;border-radius:12px;background:#fff3cd;color:#725b00;margin-top:10px}.ok{background:#e8f6ed;color:#1b6c43}.err{background:#fdecec;color:#9d2525}.candidate{border:1px solid #d7e1e5;border-radius:14px;padding:14px;margin-top:10px}.ip{font-size:24px;font-weight:800}.score{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f4;font-size:12px;font-weight:700;margin-top:5px}.reason{font-size:12px;color:#60737c;margin-top:6px}button,a.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:#17313d;color:#fff;font-size:16px;font-weight:700;margin-top:10px;text-decoration:none;text-align:center}.secondary{background:#e8eef1!important;color:#17313d!important}.hidden{display:none!important}</style></head><body><div class="wrap"><section class="card"><h1>📡 IP de la instalación</h1><div class="muted">El sistema compara los registros PERMITIDOS del RB y te muestra las coincidencias más probables. Confirma únicamente la IP correcta.</div><div id="estado" class="status">Buscando candidatos...</div><div id="candidatos"></div><button id="actualizar" class="secondary">🔄 ACTUALIZAR</button><a class="btn secondary" href="trabajos-tecnicos.html">← VOLVER A TRABAJOS</a></section></div><script>const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-ip-candidatos',KEY='disprotel_trabajos_test',ORDEN=new URLSearchParams(location.search).get('orden');let US='',PIN='',timer=null;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:US,pin:PIN,action,orden_id:ORDEN,...payload})});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw new Error(d.error||'Error');return d}function fmt(x){try{return new Date(x).toLocaleString()}catch{return x||''}}async function cargar(){try{const d=await api('status');const q=d.solicitud;if(!q){$('estado').className='status err';$('estado').textContent='Esta orden todavía no tiene una solicitud de IP.';$('candidatos').innerHTML='';return}if(q.estado==='ASIGNADA'){$('estado').className='status ok';$('estado').innerHTML=`✅ IP CONFIRMADA<br><span class="ip">${esc(q.ip_asignada)}</span>`;$('candidatos').innerHTML='';if(timer){clearInterval(timer);timer=null}return}const cs=d.candidatos||[];$('estado').className='status';$('estado').innerHTML=cs.length?`Encontré <b>${cs.length}</b> candidato(s). Revisa antes de confirmar.`:`⏳ Esperando que aparezca la IP en PERMITIDOS...${q.detector_ultimo_scan?'<br><span class="muted">Última revisión: '+esc(fmt(q.detector_ultimo_scan))+'</span>':''}`;$('candidatos').innerHTML=cs.map(c=>`<div class="candidate"><div class="ip">${esc(c.address)}</div><div><span class="score">Coincidencia ${esc(c.score)} puntos</span></div><div style="margin-top:7px"><b>${esc(c.comentario||'Sin comentario')}</b></div>${c.codigo_dspr?`<div class="muted">${esc(c.codigo_dspr)}</div>`:''}${c.creation_time?`<div class="muted">Creado en RB: ${esc(fmt(c.creation_time))}</div>`:''}<div class="reason">${(c.razones||[]).map(esc).join(' · ')}</div><button onclick="confirmar('${c.id}','${String(c.address).replaceAll("'",'')}')">✅ CONFIRMAR ESTA IP</button></div>`).join('')}catch(e){$('estado').className='status err';$('estado').textContent=e.message}}async function confirmar(id,ip){if(!confirm(`¿Confirmar ${ip} como IP de esta instalación?`))return;try{const d=await api('confirm',{candidato_id:id});$('estado').className='status ok';$('estado').innerHTML=`✅ IP CONFIRMADA<br><span class="ip">${esc(d.ip)}</span>`;$('candidatos').innerHTML='';if(timer){clearInterval(timer);timer=null}}catch(e){$('estado').className='status err';$('estado').textContent=e.message}}$('actualizar').onclick=cargar;(async()=>{try{if(!ORDEN)throw new Error('Falta la orden.');const s=JSON.parse(sessionStorage.getItem(KEY)||'null');if(!s?.usuario||!s?.pin)throw new Error('Sesión técnica no disponible. Vuelve a Trabajos técnicos.');US=s.usuario;PIN=s.pin;await cargar();timer=setInterval(cargar,8000)}catch(e){$('estado').className='status err';$('estado').textContent=e.message}})();</script></body></html>
