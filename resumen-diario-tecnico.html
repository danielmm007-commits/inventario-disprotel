<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Resumen diario Área Técnica · DISPROTEL</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{--n:#071a38;--b:#0d5f98;--l:#d8e4ea;--bg:#eef3f6;--ink:#173b5c;--m:#71838e;--g:#237a52;--a:#a86b00}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.wrap{max-width:980px;margin:auto;padding:10px}.head{background:linear-gradient(135deg,#071a38,#0d5f98);color:#fff;border-radius:15px;padding:12px}.top{display:flex;gap:8px;align-items:center}.top div{flex:1}.top h1{font-size:17px;margin:0}.top p{font-size:9px;margin:4px 0 0;color:#dbeaf5}.back{border:1px solid #ffffff50;background:#ffffff15;color:#fff;border-radius:9px;padding:8px 10px;font-size:8px;font-weight:900}.actions{display:grid;grid-template-columns:160px repeat(3,auto);gap:6px;margin-top:9px}.actions input,.actions button{border:0;border-radius:9px;padding:9px;background:#fff;color:#245c7d;font-size:8px;font-weight:900}.actions .pdf{background:#f2a500;color:#fff}.actions .share{background:#237a52;color:#fff}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.metric{background:#fff;border:1px solid var(--l);border-radius:11px;padding:9px}.metric strong{display:block;font-size:20px;color:var(--b)}.metric span{font-size:7px;font-weight:900;color:var(--m)}.card{background:#fff;border:1px solid var(--l);border-radius:12px;margin-top:8px;padding:10px}.card h2{font-size:11px;margin:0 0 7px}.row{padding:6px 0;border-top:1px dashed #dde6eb;font-size:8.5px}.row:first-of-type{border-top:0}.row b{font-size:9px}.muted{color:var(--m)}.empty{padding:12px;text-align:center;color:var(--m);font-size:9px}.status{margin-top:6px;font-size:8px;color:#dbeaf5}
@media(max-width:620px){.actions{grid-template-columns:1fr 1fr}.actions input{grid-column:1/-1}.metrics{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.back{white-space:nowrap}}
</style></head>
<body><main class="wrap">
<section class="head"><div class="top"><div><h1>📊 Resumen diario del Área Técnica</h1><p>Consolidado de labores, OT y novedades para revisión de Fernando.</p></div><button id="back" class="back">← SUPERVISIÓN</button></div>
<div class="actions"><input id="date" type="date"><button id="refresh">↻ ACTUALIZAR</button><button id="pdf" class="pdf">📄 GENERAR PDF</button><button id="share" class="share">📤 COMPARTIR PDF</button></div><div id="status" class="status"></div></section>
<section class="metrics"><article class="metric"><strong id="mTotal">—</strong><span>ACTIVIDADES</span></article><article class="metric"><strong id="mFin">—</strong><span>FINALIZADAS</span></article><article class="metric"><strong id="mPend">—</strong><span>PENDIENTES</span></article><article class="metric"><strong id="mPers">—</strong><span>NOVEDADES PERSONAL</span></article><article class="metric"><strong id="mUnit">—</strong><span>NOVEDADES UNIDADES</span></article></section>
<section class="card"><h2>🛠️ Labores del día</h2><div id="orders"></div></section>
<section class="card"><h2>👨‍🔧 Novedades de personal</h2><div id="personal"></div></section>
<section class="card"><h2>🚐 Novedades de unidades</h2><div id="units"></div></section>
</main>
<script>
(()=>{const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-supervisor-informes',KEY='disprotel_login_general_v2',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let me={};try{me=JSON.parse(sessionStorage.getItem(KEY)||'{}')}catch{}if(!me.session_token){location.replace('login-general-v2.html');return}let DATA=null;const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Guayaquil',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
async function call(){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-session':me.session_token},body:JSON.stringify({action:'daily',date:$('date').value})}),j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||'No se pudo consultar');return j}
function paint(){const d=DATA,s=d?.summary||{};$('mTotal').textContent=s.total_actividades??0;$('mFin').textContent=s.finalizadas??0;$('mPend').textContent=s.pendientes??0;$('mPers').textContent=s.novedades_personal??0;$('mUnit').textContent=s.novedades_unidad??0;$('orders').innerHTML=(d.orders||[]).length?(d.orders||[]).map(x=>`<div class="row"><b>${esc(x.id_orden)} · ${esc(x.cliente_nombre||'Cliente')}</b><div class="muted">${esc(String(x.tipo_trabajo||'').replaceAll('_',' '))} · ${esc(x.tecnico||'Técnico')} · ${esc(x.grupo||'Sin grupo')} · ${esc(x.estado||'')}</div></div>`).join(''):'<div class="empty">Sin labores registradas para este día.</div>';$('personal').innerHTML=(d.personal||[]).length?d.personal.map(x=>`<div class="row"><b>${esc(x.responsable_nombre)} · ${esc(x.tipo)}</b><div class="muted">${esc(x.grupo_nombre||'Sin grupo')}${x.motivo?' · '+esc(x.motivo):''}</div></div>`).join(''):'<div class="empty">Sin novedades de personal.</div>';$('units').innerHTML=(d.unidades||[]).length?d.unidades.map(x=>`<div class="row"><b>${esc(x.unidad_nombre)} · ${esc(String(x.tipo||'').replaceAll('_',' '))}</b><div class="muted">${esc(x.grupo_nombre||'Sin grupo')}${x.motivo?' · '+esc(x.motivo):''} · ${esc(x.estado||'')}</div></div>`).join(''):'<div class="empty">Sin novedades de unidades.</div>'}
async function load(){try{$('status').textContent='Consultando operación…';DATA=await call();paint();$('status').textContent='Resumen actualizado.'}catch(e){$('status').textContent='⚠ '+e.message}}
function pdfBlob(){if(!DATA)throw new Error('Primero actualiza el resumen');const {jsPDF}=window.jspdf||{};if(!jsPDF)throw new Error('No se pudo cargar el generador PDF');const doc=new jsPDF({unit:'mm',format:'a4'}),d=DATA,s=d.summary||{};let y=16;const line=(t,size=9,bold=false)=>{doc.setFontSize(size);doc.setFont('helvetica',bold?'bold':'normal');const parts=doc.splitTextToSize(String(t),185);for(const p of parts){if(y>282){doc.addPage();y=15}doc.text(p,12,y);y+=5}};doc.setTextColor(7,26,56);line('DISPROTEL · RESUMEN DIARIO DEL ÁREA TÉCNICA',15,true);line('Fecha: '+d.date,10,true);line('Supervisor: '+(me.nombre||'Fernando'),9);y+=2;line('RESUMEN',11,true);line('Actividades: '+(s.total_actividades||0)+'   Finalizadas: '+(s.finalizadas||0)+'   Pendientes: '+(s.pendientes||0));line('Novedades personal: '+(s.novedades_personal||0)+'   Novedades unidades: '+(s.novedades_unidad||0));y+=3;line('LABORES DEL DÍA',11,true);if(!(d.orders||[]).length)line('Sin labores registradas.');for(const x of d.orders||[])line('• '+[x.id_orden,x.cliente_nombre,String(x.tipo_trabajo||'').replaceAll('_',' '),x.tecnico,x.grupo,x.estado].filter(Boolean).join(' · '),8);y+=3;line('NOVEDADES DE PERSONAL',11,true);if(!(d.personal||[]).length)line('Sin novedades de personal.');for(const x of d.personal||[])line('• '+[x.responsable_nombre,x.tipo,x.grupo_nombre,x.motivo].filter(Boolean).join(' · '),8);y+=3;line('NOVEDADES DE UNIDADES',11,true);if(!(d.unidades||[]).length)line('Sin novedades de unidades.');for(const x of d.unidades||[])line('• '+[x.unidad_nombre,String(x.tipo||'').replaceAll('_',' '),x.grupo_nombre,x.motivo,x.estado].filter(Boolean).join(' · '),8);y+=5;line('Documento generado desde Supervisión Técnica DISPROTEL.',7);return doc.output('blob')}
function filename(){return 'Resumen_Area_Tecnica_'+$('date').value+'.pdf'}
$('date').value=today();$('date').onchange=load;$('refresh').onclick=load;$('back').onclick=()=>location.href='panel-supervisor-vivo-v2.html';$('pdf').onclick=()=>{try{const b=pdfBlob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename();a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);$('status').textContent='✅ PDF generado.'}catch(e){$('status').textContent='⚠ '+e.message}};$('share').onclick=async()=>{try{const b=pdfBlob(),f=new File([b],filename(),{type:'application/pdf'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]}))){await navigator.share({title:'Resumen diario Área Técnica',text:'Resumen diario del Área Técnica DISPROTEL · '+$('date').value,files:[f]});$('status').textContent='✅ Compartido.'}else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename();a.click();$('status').textContent='Tu navegador no permite compartir archivos directamente. El PDF quedó generado para que lo envíes por WhatsApp.'}}catch(e){if(e.name!=='AbortError')$('status').textContent='⚠ '+e.message}};load()})();
</script></body></html>
