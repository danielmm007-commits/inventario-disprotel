<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17313d"><title>Inventario DISPROTEL · Cantidades</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7f9;color:#17313d;padding:12px}.wrap{max-width:640px;margin:14px auto}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 7px 24px rgba(0,0,0,.08);margin-bottom:14px}h1{margin:0 0 4px;font-size:27px}h2{margin:0 0 6px}.sub{color:#60737c;margin-bottom:14px}.tag{display:inline-block;background:#fff3cd;color:#725b00;padding:7px 10px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:12px}label{font-weight:700;display:block;margin:13px 0 6px}input,select,textarea{width:100%;padding:13px;border:1px solid #cbd8de;border-radius:11px;font-size:16px;background:#fff}textarea{min-height:75px;resize:vertical}button{width:100%;border:0;border-radius:12px;padding:14px;background:#17313d;color:#fff;font-size:16px;font-weight:700;margin-top:12px;cursor:pointer}.secondary{background:#e8eef1;color:#17313d}.hidden{display:none!important}.msg{padding:12px;border-radius:10px;margin-top:12px;display:none}.ok{display:block;background:#e8f6ed;color:#1b6c43}.err{display:block;background:#fdecec;color:#9d2525}.stock{margin-top:12px;background:#f4f7f9;border-radius:12px;overflow:hidden}.row{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border-bottom:1px solid #dde6ea}.row:last-child{border-bottom:0}.qty{font-weight:800}.muted{color:#667b84;font-size:13px}.back{display:block;text-decoration:none;text-align:center;background:#e8eef1;color:#17313d;font-weight:700;padding:13px;border-radius:12px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
<section class="card" id="loginCard"><h1>Inventario DISPROTEL</h1><div class="sub">Movimientos de productos por cantidad</div><span class="tag">DATOS DE PRUEBA</span><label>PIN de acceso</label><input id="pin" inputmode="numeric" maxlength="8" placeholder="Ingresa el PIN"><button id="btnEntrar">Entrar</button><div id="loginMsg" class="msg"></div><a class="back" href="./">← Volver a seriales</a></section>
<section class="card hidden" id="appCard"><h2>Mover productos por cantidad</h2><div class="sub">Para rosetas, patchcords, ONU, switches y otros productos sin serial.</div><label>Producto</label><select id="producto"></select><div id="productoDetalle" class="muted"></div><h3>Stock actual</h3><div id="stock" class="stock"></div><label>Origen</label><select id="origen"></select><label>Destino</label><select id="destino"></select><label>Cantidad</label><input id="cantidad" type="number" min="1" step="1" inputmode="numeric" placeholder="Ej. 10"><label>Responsable</label><select id="responsable"></select><div id="clienteWrap" class="hidden"><label>Cliente / detalle</label><input id="cliente" placeholder="Nombre, código o referencia"></div><label>Observación</label><textarea id="observacion" placeholder="Opcional"></textarea><button id="btnMover">Guardar movimiento</button><button id="btnActualizar" class="secondary">Actualizar stock</button><div id="msg" class="msg"></div><a class="back" href="./">← Volver a seriales</a></section>
</div>
<script>
const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-api';let PIN='',productos=[],ubicaciones=[],responsables=[],stockActual=[];const $=id=>document.getElementById(id);function mensaje(t,tipo='err'){const e=$('msg');e.className='msg '+(tipo==='ok'?'ok':'err');e.textContent=t}function clearMsg(id){const e=$(id);e.className='msg';e.textContent=''}async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-pin':PIN},body:JSON.stringify({action,...payload})});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw new Error(d.error||'Error del servidor');return d}
async function cargarTodo(){const [p,o]=await Promise.all([api('list-quantity-products'),api('list-options')]);productos=p.productos||[];ubicaciones=(o.ubicaciones||[]).filter(u=>u.ubicacion!=='PROVEEDOR');responsables=o.responsables||[];$('producto').innerHTML=productos.map(x=>`<option value="${x.id}">${x.codigo} · ${x.producto}</option>`).join('');$('responsable').innerHTML='<option value="">Selecciona responsable</option>'+responsables.map(r=>`<option value="${r.id}">${r.nombre} · ${r.unidad_grupo}</option>`).join('');if(productos.length)await cargarStock()}
function renderStock(){const disponibles=stockActual.filter(s=>Number(s.stock)>0);$('stock').innerHTML=stockActual.map(s=>`<div class="row"><span>${s.ubicacion}</span><span class="qty">${s.stock}</span></div>`).join('')||'<div class="row">Sin datos</div>';$('origen').innerHTML='<option value="">Selecciona origen</option>'+disponibles.map(s=>`<option value="${s.id}">${s.ubicacion} · ${s.stock} disponibles</option>`).join('');$('destino').innerHTML='<option value="">Selecciona destino</option>'+ubicaciones.map(u=>`<option value="${u.id}">${u.ubicacion}</option>`).join('')}
async function cargarStock(){clearMsg('msg');const id=$('producto').value;if(!id)return;try{const d=await api('quantity-stock',{producto_id:id});stockActual=d.stock||[];$('productoDetalle').textContent=`${d.producto.codigo} · ${d.producto.producto}`;renderStock()}catch(e){mensaje(e.message)}}
$('btnEntrar').onclick=async()=>{clearMsg('loginMsg');PIN=$('pin').value.trim();if(!PIN){const e=$('loginMsg');e.className='msg err';e.textContent='Ingresa el PIN';return}try{await cargarTodo();$('loginCard').classList.add('hidden');$('appCard').classList.remove('hidden')}catch(e){const x=$('loginMsg');x.className='msg err';x.textContent=e.message}};
$('producto').onchange=cargarStock;$('btnActualizar').onclick=cargarStock;$('destino').onchange=()=>{const u=ubicaciones.find(x=>x.id===$('destino').value);$('clienteWrap').classList.toggle('hidden',u?.ubicacion!=='CLIENTE')};
$('btnMover').onclick=async()=>{clearMsg('msg');const producto_id=$('producto').value,origen_id=$('origen').value,destino_id=$('destino').value,responsable_id=$('responsable').value,cantidad=Number($('cantidad').value),cliente_detalle=$('cliente').value.trim(),observacion=$('observacion').value.trim();if(!origen_id||!destino_id||!responsable_id||!cantidad){mensaje('Completa origen, destino, cantidad y responsable');return}if(origen_id===destino_id){mensaje('Origen y destino no pueden ser iguales');return}$('btnMover').disabled=true;try{const d=await api('move-quantity',{producto_id,origen_id,destino_id,responsable_id,cantidad,cliente_detalle,observacion});mensaje(`${d.cantidad} unidad(es): ${d.origen} → ${d.destino}. Movimiento guardado.`,'ok');$('cantidad').value='';$('cliente').value='';$('observacion').value='';stockActual=d.stock||[];renderStock()}catch(e){mensaje(e.message)}finally{$('btnMover').disabled=false}};
</script>
</body></html>
