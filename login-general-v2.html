<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06264d">
<title>Ingreso · DISPROTEL Telecomunicaciones</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:#eaf1f7}body{display:grid;place-items:center;overflow:hidden;padding:14px}.stage{position:relative;width:min(1672px,97vw);aspect-ratio:1672/941;max-height:96vh;background:url('login-bg-owner.jpg') center/100% 100% no-repeat;border-radius:20px;overflow:hidden;box-shadow:0 28px 80px rgba(4,28,59,.22)}.hot{position:absolute;z-index:8}.realInput{border:1px solid #cad8e7;outline:0;background:rgba(255,255,255,.97);color:#183a60;border-radius:8px;padding:0 16px;font-size:clamp(11px,.92vw,15px);box-shadow:inset 0 1px 1px rgba(0,0,0,.02)}.realInput:focus{border-color:#4a95d9;box-shadow:0 0 0 3px rgba(38,139,219,.12)}#usuario{left:70.05%;top:38.4%;width:23.0%;height:5.75%}#pin{left:70.05%;top:46.25%;width:20.9%;height:5.75%}#eye{left:91.15%;top:46.25%;width:2.0%;height:5.75%;border:0;background:transparent;color:transparent;cursor:pointer}#go{left:70.0%;top:54.45%;width:23.1%;height:5.9%;border:0;background:transparent;color:transparent;cursor:pointer;border-radius:10px}#forgot{left:74.5%;top:62.9%;width:14.2%;height:3.4%;border:0;background:transparent;color:transparent;cursor:pointer}.msg{position:absolute;left:70.1%;top:67.2%;width:23%;z-index:9;display:none;padding:8px 10px;border-radius:8px;font-size:clamp(8px,.72vw,11px);font-weight:700}.msg.show{display:block}.msg.ok{background:#eaf7ef;color:#246c47}.msg.err{background:#fdecec;color:#9a2c2c}.overlay{display:none;position:fixed;inset:0;z-index:30;background:rgba(4,18,39,.66);place-items:center;padding:18px}.overlay.show{display:grid}.recover{width:min(460px,100%);background:#fff;border-radius:18px;padding:23px;box-shadow:0 25px 70px rgba(0,0,0,.28);color:#17375d}.recover h3{margin:0 0 8px;color:#0e3266}.recover p{margin:0 0 12px;color:#687c87;font-size:13px;line-height:1.5}.recover label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px}.recover input{width:100%;height:44px;border:1px solid #cfdce6;border-radius:9px;padding:0 12px}.actions{display:flex;gap:8px;margin-top:15px}.actions button{flex:1;border:0;border-radius:9px;padding:12px;font-weight:900;cursor:pointer}.cancel{background:#eaf1f5;color:#17313d}.send{background:#0b2a5c;color:#fff}.recoverError{min-height:17px;margin-top:7px;color:#9a2c2c;font-size:12px}
.mobileCard{display:none}
@media(max-width:760px){body{padding:0;background:linear-gradient(160deg,#0a315d,#061a35)}.stage{width:100vw;height:100dvh;max-height:none;aspect-ratio:auto;border-radius:0;background:url('login-bg-owner.jpg') 78% center/auto 100% no-repeat}.stage:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,25,52,.08),rgba(4,25,52,.48) 48%,rgba(4,25,52,.88) 100%);z-index:5}.hot,.msg{display:none}.mobileCard{display:block;position:absolute;z-index:12;left:50%;bottom:18px;transform:translateX(-50%);width:calc(100vw - 28px);max-width:430px;background:rgba(255,255,255,.97);border-radius:18px;padding:17px 16px 14px;box-shadow:0 20px 60px rgba(0,0,0,.28)}.mobileCard h2{margin:0;text-align:center;color:#0e3266;font-size:23px}.mobileCard p{text-align:center;color:#7d8b98;font-size:10px;margin:4px 0 10px}.mobileCard label{display:block;font-size:9px;font-weight:800;color:#345775;margin:7px 0 4px}.mobileCard input{width:100%;height:38px;border:1px solid #cfdce6;border-radius:9px;padding:0 11px;font-size:12px}.mPin{position:relative}.mEye{position:absolute;right:5px;top:5px;width:32px;height:28px;border:0;background:transparent;color:#245e96}.mGo{width:100%;height:40px;border:0;border-radius:9px;margin-top:9px;background:linear-gradient(90deg,#10aaf0,#0b4db2);color:#fff;font-size:11px;font-weight:900}.mForgot{width:100%;border:0;background:transparent;color:#1768aa;font-size:9px;font-weight:800;margin-top:8px}.mMsg{display:none;margin-top:6px;padding:6px 8px;border-radius:7px;font-size:8px}.mMsg.show{display:block}.mMsg.ok{background:#eaf7ef;color:#246c47}.mMsg.err{background:#fdecec;color:#9a2c2c}}
</style>
</head>
<body>
<main class="stage" aria-label="Ingreso DISPROTEL">
  <input id="usuario" class="hot realInput" autocomplete="username" autocapitalize="none" placeholder="Cédula o correo" aria-label="Cédula o correo">
  <input id="pin" class="hot realInput" type="password" maxlength="64" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña">
  <button id="eye" class="hot" type="button" aria-label="Mostrar contraseña">Mostrar</button>
  <button id="go" class="hot" type="button" aria-label="Ingresar">Ingresar</button>
  <button id="forgot" class="hot" type="button" aria-label="Problemas para acceder">Recuperar acceso</button>
  <div id="msg" class="msg"></div>

  <div class="mobileCard">
    <h2>Bienvenido</h2><p>Acceso al sistema</p>
    <label for="mUsuario">Cédula o correo</label><input id="mUsuario" autocomplete="username" autocapitalize="none" placeholder="Ingresa tu cédula o correo">
    <label for="mPin">Contraseña</label><div class="mPin"><input id="mPin" type="password" maxlength="64" autocomplete="current-password" placeholder="Ingresa tu contraseña"><button id="mEye" class="mEye" type="button">◉</button></div>
    <button id="mGo" class="mGo" type="button">INGRESAR →</button><button id="mForgot" class="mForgot" type="button">¿Problemas para acceder?</button><div id="mMsg" class="mMsg"></div>
  </div>
</main>

<div id="recoverOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="recoverTitle"><div class="recover"><h3 id="recoverTitle">Recuperar contraseña</h3><p>Ingresa la cédula o el correo institucional registrado en tu ficha de usuario.</p><label for="recoverLogin">Cédula o correo</label><input id="recoverLogin" autocomplete="username" placeholder="Cédula de 10 dígitos o correo institucional"><div id="recoverError" class="recoverError"></div><div class="actions"><button id="recoverCancel" class="cancel" type="button">CANCELAR</button><button id="recoverSend" class="send" type="button">ENVIAR ENLACE</button></div></div></div>
<script>
const AUTH_API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-auth-login';
const LEGACY_API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-login';
const PASSWORD_API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-password-admin';
const desktop={u:document.getElementById('usuario'),p:document.getElementById('pin'),go:document.getElementById('go'),msg:document.getElementById('msg')};
const mobile={u:document.getElementById('mUsuario'),p:document.getElementById('mPin'),go:document.getElementById('mGo'),msg:document.getElementById('mMsg')};
function active(){return innerWidth<=760?mobile:desktop}
function show(text,type='err'){const x=active().msg;x.className=(innerWidth<=760?'mMsg':'msg')+' show '+type;x.textContent=text}
function prepararSesiones(me,usuario,credentials={}){const base={usuario,nombre:me.nombre||'',unidad_grupo:me.unidad_grupo||'',rol:me.rol||'',id:me.id||'',es_admin_principal:!!me.es_admin_principal,puede_asignar_ip:!!me.puede_asignar_ip,...credentials};sessionStorage.setItem('disprotel_login_general_v2',JSON.stringify(base));if(me.rol==='TÉCNICO')sessionStorage.setItem('disprotel_trabajos_test',JSON.stringify(base));if(me.rol==='ADMINISTRADOR'||me.es_admin_principal)sessionStorage.setItem('disprotel_ordenes_oficina_test',JSON.stringify(base));if(me.rol==='RESPONSABLE IP'||me.puede_asignar_ip)sessionStorage.setItem('disprotel_ip_test',JSON.stringify(base))}
async function jsonPost(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(()=>({error:'Respuesta inválida del servidor'}));return{r,d}}
async function entrar(){const a=active(),usuario=a.u.value.trim().toLowerCase(),password=a.p.value;if(!usuario||!password){show('Escribe usuario y contraseña para continuar.');return}a.go.disabled=true;show('Validando credenciales…','ok');try{const auth=await jsonPost(AUTH_API,{login:usuario,password});if(auth.r.ok&&auth.d?.ok){const me=auth.d.usuario||{};if(auth.d.change_required){if(!auth.d.auth_session?.access_token)throw new Error('No se pudo preparar el cambio obligatorio');sessionStorage.setItem('disprotel_auth_pending',JSON.stringify(auth.d.auth_session));a.p.value='';location.replace('cambiar-contrasena-obligatoria.html');return}prepararSesiones(me,usuario,{session_token:auth.d.session_token,expires_at:auth.d.expires_at,auth_mode:true});a.p.value='';show('Bienvenido, '+(me.nombre||usuario)+'. Abriendo tu área…','ok');setTimeout(()=>location.href='principal.html',250);return}const legacy=await jsonPost(LEGACY_API,{usuario,pin:password});if(!legacy.r.ok||!legacy.d?.ok)throw new Error('Usuario o contraseña incorrectos');const me=legacy.d.usuario||{};prepararSesiones(me,usuario,{pin:password,auth_mode:false});a.p.value='';show('Bienvenido, '+(me.nombre||usuario)+'. Abriendo tu área…','ok');setTimeout(()=>location.href='principal.html',250)}catch(e){show(e.message||'Usuario o contraseña incorrectos.');a.go.disabled=false;a.p.focus();a.p.select()}}
const recoverOverlay=document.getElementById('recoverOverlay'),recoverLogin=document.getElementById('recoverLogin'),recoverError=document.getElementById('recoverError'),recoverSend=document.getElementById('recoverSend');
function abrirRecuperacion(){const val=active().u.value.trim();recoverLogin.value=/^(\d{10}|[^\s@]+@[^\s@]+\.[^\s@]+)$/.test(val)?val:'';recoverError.textContent='';recoverOverlay.classList.add('show');setTimeout(()=>recoverLogin.focus(),50)}function cerrarRecuperacion(){recoverOverlay.classList.remove('show')}
async function solicitarRecuperacion(){const login=recoverLogin.value.trim().toLowerCase();if(!/^(\d{10}|[^\s@]+@[^\s@]+\.[^\s@]+)$/.test(login)){recoverError.textContent='Ingresa una cédula de 10 dígitos o un correo válido.';recoverLogin.focus();return}recoverSend.disabled=true;recoverSend.textContent='ENVIANDO…';recoverError.textContent='';try{const x=await jsonPost(PASSWORD_API,{action:'self_recovery',login});cerrarRecuperacion();show(x.d.message||'Si los datos corresponden a una cuenta activa, recibirás un correo.','ok')}catch{cerrarRecuperacion();show('Si los datos corresponden a una cuenta activa, recibirás un correo.','ok')}finally{recoverSend.disabled=false;recoverSend.textContent='ENVIAR ENLACE'}}

document.getElementById('eye').onclick=()=>desktop.p.type=desktop.p.type==='password'?'text':'password';document.getElementById('mEye').onclick=()=>mobile.p.type=mobile.p.type==='password'?'text':'password';desktop.go.onclick=entrar;mobile.go.onclick=entrar;document.getElementById('forgot').onclick=abrirRecuperacion;document.getElementById('mForgot').onclick=abrirRecuperacion;document.getElementById('recoverCancel').onclick=cerrarRecuperacion;recoverSend.onclick=solicitarRecuperacion;recoverOverlay.addEventListener('click',e=>{if(e.target===recoverOverlay)cerrarRecuperacion()});desktop.p.addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});mobile.p.addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});desktop.u.addEventListener('keydown',e=>{if(e.key==='Enter')desktop.p.focus()});mobile.u.addEventListener('keydown',e=>{if(e.key==='Enter')mobile.p.focus()});recoverLogin.addEventListener('keydown',e=>{if(e.key==='Enter')solicitarRecuperacion()});
</script>
</body></html>
