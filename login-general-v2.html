<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef5fb">
<title>Ingreso · DISPROTEL Telecomunicaciones</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#eef5fb}body{display:grid;place-items:center;overflow:hidden}.stage{position:relative;width:min(1500px,96vw);aspect-ratio:16/9;max-height:94vh;background:url('login-bg-web.jpg') center/100% 100% no-repeat;border-radius:24px;overflow:hidden;box-shadow:0 26px 80px rgba(7,38,78,.18)}.hot{position:absolute;z-index:5}.realInput{border:0;outline:0;background:#fff;color:#17375d;font-size:clamp(10px,.8vw,14px);padding:0 .35vw;border-radius:4px}.realInput:focus{box-shadow:0 0 0 2px rgba(31,132,221,.22)}#usuario{left:69.6%;top:43.85%;width:16.15%;height:4.8%}#pin{left:69.6%;top:52.95%;width:14.6%;height:4.8%}#eye{left:84.25%;top:53%;width:2.45%;height:4.7%;border:0;background:transparent;cursor:pointer;color:transparent}#go{left:67.45%;top:59.95%;width:19.05%;height:5.25%;border:0;background:transparent;cursor:pointer;color:transparent;border-radius:9px}#forgot{left:71.2%;top:66.35%;width:12.8%;height:3.3%;border:0;background:transparent;cursor:pointer;color:transparent}#go:focus,#forgot:focus,#eye:focus{outline:2px solid #29a8ef;outline-offset:2px}.toast{position:fixed;z-index:50;left:50%;top:16px;transform:translateX(-50%);max-width:min(560px,92vw);padding:10px 14px;border-radius:10px;font-size:12px;font-weight:700;display:none;box-shadow:0 10px 30px rgba(0,0,0,.14)}.toast.show{display:block}.toast.ok{background:#eaf7ef;color:#246c47}.toast.err{background:#fdecec;color:#9a2c2c}.overlay{display:none;position:fixed;inset:0;z-index:60;background:rgba(4,18,39,.66);place-items:center;padding:18px}.overlay.show{display:grid}.recover{width:min(460px,100%);background:#fff;border-radius:18px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.28);color:#17375d}.recover h3{margin:0 0 8px;color:#0e3266}.recover p{font-size:13px;line-height:1.45;color:#687c87}.recover label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px}.recover input{width:100%;height:44px;border:1px solid #cfdce6;border-radius:9px;padding:0 12px}.actions{display:flex;gap:8px;margin-top:15px}.actions button{flex:1;border:0;border-radius:9px;padding:12px;font-weight:900;cursor:pointer}.cancel{background:#eaf1f5;color:#17313d}.send{background:#0b2a5c;color:#fff}#recoverError{min-height:17px;margin-top:7px;color:#9a2c2c;font-size:12px}@media(max-width:700px){body{background:#fff}.stage{width:min(100vw,576px);height:100dvh;max-height:none;aspect-ratio:auto;border-radius:0;background:url('login-bg-mobile.jpg') center/100% 100% no-repeat;box-shadow:none}#usuario{left:21.2%;top:67.55%;width:64.5%;height:4.05%;font-size:14px;padding-left:3px}#pin{left:21.2%;top:72.55%;width:57.4%;height:4.05%;font-size:14px;padding-left:3px}#eye{left:80.3%;top:72.55%;width:9%;height:4.05%}#go{left:11.5%;top:77.55%;width:77.3%;height:4.55%}#forgot{left:30.8%;top:83.15%;width:38.5%;height:2.7%}}
</style>
</head>
<body>
<main class="stage" aria-label="Ingreso DISPROTEL">
<input id="usuario" class="hot realInput" autocomplete="username" autocapitalize="none" aria-label="Cédula o correo">
<input id="pin" class="hot realInput" type="password" maxlength="64" autocomplete="current-password" aria-label="Contraseña">
<button id="eye" class="hot" type="button" aria-label="Mostrar contraseña">Mostrar</button>
<button id="go" class="hot" type="button" aria-label="Ingresar">Ingresar</button>
<button id="forgot" class="hot" type="button" aria-label="Problemas para acceder">Recuperar acceso</button>
</main>
<div id="msg" class="toast"></div>
<div id="recoverOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="recoverTitle"><div class="recover"><h3 id="recoverTitle">Recuperar contraseña</h3><p>Ingresa la cédula o el correo institucional registrado en tu ficha de usuario.</p><label for="recoverLogin">Cédula o correo</label><input id="recoverLogin" autocomplete="username" placeholder="Cédula de 10 dígitos o correo institucional"><div id="recoverError"></div><div class="actions"><button id="recoverCancel" class="cancel" type="button">CANCELAR</button><button id="recoverSend" class="send" type="button">ENVIAR ENLACE</button></div></div></div>
<script>
const AUTH_API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-auth-login',LEGACY_API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-login',PASSWORD_API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-password-admin';
const u=document.getElementById('usuario'),p=document.getElementById('pin'),msg=document.getElementById('msg'),go=document.getElementById('go');document.getElementById('eye').onclick=()=>{p.type=p.type==='password'?'text':'password'};
function show(text,type='err'){msg.className='toast show '+type;msg.textContent=text;clearTimeout(show.t);show.t=setTimeout(()=>msg.className='toast',3500)}
function prepararSesiones(me,usuario,credentials={}){const base={usuario,nombre:me.nombre||'',unidad_grupo:me.unidad_grupo||'',rol:me.rol||'',id:me.id||'',es_admin_principal:!!me.es_admin_principal,puede_asignar_ip:!!me.puede_asignar_ip,...credentials};sessionStorage.setItem('disprotel_login_general_v2',JSON.stringify(base));if(me.rol==='TÉCNICO')sessionStorage.setItem('disprotel_trabajos_test',JSON.stringify(base));if(me.rol==='ADMINISTRADOR'||me.es_admin_principal)sessionStorage.setItem('disprotel_ordenes_oficina_test',JSON.stringify(base));if(me.rol==='RESPONSABLE IP'||me.puede_asignar_ip)sessionStorage.setItem('disprotel_ip_test',JSON.stringify(base))}
async function jsonPost(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(()=>({error:'Respuesta inválida del servidor'}));return{r,d}}
async function entrar(){const usuario=u.value.trim().toLowerCase(),password=p.value;if(!usuario||!password){show('Escribe usuario y contraseña para continuar.');return}go.disabled=true;show('Validando credenciales…','ok');try{const auth=await jsonPost(AUTH_API,{login:usuario,password});if(auth.r.ok&&auth.d?.ok){const me=auth.d.usuario||{};if(auth.d.change_required){if(!auth.d.auth_session?.access_token)throw new Error('No se pudo preparar el cambio obligatorio');sessionStorage.setItem('disprotel_auth_pending',JSON.stringify(auth.d.auth_session));p.value='';location.replace('cambiar-contrasena-obligatoria.html');return}prepararSesiones(me,usuario,{session_token:auth.d.session_token,expires_at:auth.d.expires_at,auth_mode:true});p.value='';show('Bienvenido, '+(me.nombre||usuario)+'. Abriendo tu área…','ok');setTimeout(()=>location.href='principal.html',250);return}const legacy=await jsonPost(LEGACY_API,{usuario,pin:password});if(!legacy.r.ok||!legacy.d?.ok)throw new Error('Usuario o contraseña incorrectos');const me=legacy.d.usuario||{};prepararSesiones(me,usuario,{pin:password,auth_mode:false});p.value='';show('Bienvenido, '+(me.nombre||usuario)+'. Abriendo tu área…','ok');setTimeout(()=>location.href='principal.html',250)}catch(e){show(e.message||'Usuario o contraseña incorrectos.');go.disabled=false;p.focus();p.select()}}
const recoverOverlay=document.getElementById('recoverOverlay'),recoverLogin=document.getElementById('recoverLogin'),recoverError=document.getElementById('recoverError'),recoverSend=document.getElementById('recoverSend');function abrirRecuperacion(){recoverLogin.value=/^(\d{10}|[^\s@]+@[^\s@]+\.[^\s@]+)$/.test(u.value.trim())?u.value.trim():'';recoverError.textContent='';recoverOverlay.classList.add('show');setTimeout(()=>recoverLogin.focus(),50)}function cerrarRecuperacion(){recoverOverlay.classList.remove('show')}async function solicitarRecuperacion(){const login=recoverLogin.value.trim().toLowerCase();if(!/^(\d{10}|[^\s@]+@[^\s@]+\.[^\s@]+)$/.test(login)){recoverError.textContent='Ingresa una cédula de 10 dígitos o un correo válido.';recoverLogin.focus();return}recoverSend.disabled=true;recoverSend.textContent='ENVIANDO…';recoverError.textContent='';try{const x=await jsonPost(PASSWORD_API,{action:'self_recovery',login});cerrarRecuperacion();show(x.d.message||'Si los datos corresponden a una cuenta activa, recibirás un correo.','ok')}catch{cerrarRecuperacion();show('Si los datos corresponden a una cuenta activa, recibirás un correo.','ok')}finally{recoverSend.disabled=false;recoverSend.textContent='ENVIAR ENLACE'}}
go.onclick=entrar;document.getElementById('forgot').onclick=abrirRecuperacion;document.getElementById('recoverCancel').onclick=cerrarRecuperacion;recoverSend.onclick=solicitarRecuperacion;recoverOverlay.addEventListener('click',e=>{if(e.target===recoverOverlay)cerrarRecuperacion()});p.addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});u.addEventListener('keydown',e=>{if(e.key==='Enter')p.focus()});recoverLogin.addEventListener('keydown',e=>{if(e.key==='Enter')solicitarRecuperacion()});
</script>
</body></html>
