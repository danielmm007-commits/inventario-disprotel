name: Convertir fondo login

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-login-bg.yml'

permissions:
  contents: write

jobs:
  convertir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruir WebP real
        shell: python
        run: |
          from pathlib import Path
          import base64, struct

          files=[
            Path('assets/login/bg-new-1.txt'),
            Path('assets/login/bg-new-2.txt'),
            Path('assets/login/bg-new-3.txt'),
            Path('assets/login/bg-new-4.txt'),
          ]
          raw=''.join(p.read_text(encoding='utf-8') for p in files)
          raw=''.join(raw.split())

          def ok(data:bytes):
            if len(data)<16 or data[:4]!=b'RIFF' or data[8:12]!=b'WEBP':
              return False
            declared=struct.unpack('<I',data[4:8])[0]+8
            return declared==len(data)

          data=None
          try:
            test=base64.b64decode(raw,validate=True)
            if ok(test): data=test
          except Exception:
            pass

          if data is None:
            # Los fragmentos heredados tienen un carácter sobrante. Probamos quitarlo.
            for i in range(len(raw)):
              candidate=raw[:i]+raw[i+1:]
              try:
                test=base64.b64decode(candidate,validate=True)
              except Exception:
                continue
              if ok(test):
                data=test
                print('Base64 reparado quitando carácter en posición',i)
                break

          if data is None:
            raise SystemExit('No se pudo reconstruir un WebP válido desde bg-new-*')

          out=Path('assets/login/login-background.webp')
          out.write_bytes(data)
          print('WebP válido:',len(data),'bytes')

      - name: Hacer que el login use el archivo directamente
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('login-general-v2.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('--login-bg:none','--login-bg:url("assets/login/login-background.webp?v=20260913-direct2")')
          s=s.replace('--login-bg:url("assets/login/login-background.webp?v=20260913-direct")','--login-bg:url("assets/login/login-background.webp?v=20260913-direct2")')
          s=re.sub(r"\(async\(\)=>\{try\{const files=\['assets/login/bg-new-1\.txt'[\s\S]*?\}\}\)\(\);\n?",'',s,count=1)
          p.write_text(s,encoding='utf-8')

      - name: Publicar imagen y login
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/login/login-background.webp login-general-v2.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Usar fondo real directo en login"
          git push
