name: Conectar fondo real login

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-login-bg.yml'

permissions:
  contents: write

jobs:
  conectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar fondo real
        shell: bash
        run: |
          test -s assets/login/login-background.webp
          test "$(head -c 4 assets/login/login-background.webp)" = "RIFF"
          file assets/login/login-background.webp

      - name: Apuntar login al archivo WebP directo
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('login-general-v2.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('--login-bg:none','--login-bg:url("assets/login/login-background.webp?v=20260913-real")')
          s=re.sub(r'--login-bg:url\("assets/login/login-background\.webp\?v=[^"\)]*"\)','--login-bg:url("assets/login/login-background.webp?v=20260913-real")',s)
          s=re.sub(r"\(async\(\)=>\{try\{const files=\['assets/login/bg-new-1\.txt'[\s\S]*?\}\}\)\(\);\n?",'',s,count=1)
          p.write_text(s,encoding='utf-8')

      - name: Publicar login
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add login-general-v2.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Usar fondo WebP directo en login"
          git push
