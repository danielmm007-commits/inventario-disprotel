name: Parche contexto ejecucion

on:
  push:
    paths:
      - '.github/workflows/parche-contexto-ejecucion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar cache del numeral 5
        run: python .github/scripts/actualizar_cache_evidencias_v2.py
      - name: Integrar visor de evidencias
        run: python .github/scripts/integrar_visor_evidencias.py
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instalacion-ejecucion.html
          git commit -m "Publicar visor modal de evidencias" || exit 0
          git push
