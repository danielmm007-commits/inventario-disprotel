name: Parche contexto ejecucion

on:
  push:
    paths:
      - '.github/workflows/parche-contexto-ejecucion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar formulario de cambio IP
        run: python .github/scripts/ajustar_cambio_ip_form.py
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asignacion-ip.html
          git commit -m "Mejorar formulario de cambio de IP" || exit 0
          git push
