name: Parche contexto ejecucion

on:
  push:
    paths:
      - '.github/workflows/parche-contexto-ejecucion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agregar tipo de trabajo al encabezado
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('instalacion-ejecucion.html')
          s=p.read_text(encoding='utf-8')
          old="const tec=up(s.nombre||s.usuario||'—'),grp=up(s.unidad_grupo||s.grupo||'—');ctx.innerHTML=`<div style=\"font-size:20px;font-weight:800\">${esc(up(O.id_orden||ordenId()||'—'))} · ${esc(up(O.cliente_nombre||'CLIENTE'))}</div><div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:10px\"><span class=\"badge\">👷 ${esc(tec)}</span><span class=\"badge okb\">🚐 ${esc(grp)}</span></div>`"
          new="const tec=up(s.nombre||s.usuario||'—'),grp=up(s.unidad_grupo||s.grupo||'—'),tipos={INSTALACION_INTERNET:'INSTALACIÓN',INSTALACION_INTERNET_TV:'INSTALACIÓN',ACTIVACION_TV_EXISTENTE:'ACTIVACIÓN TV',CAMBIO_EQUIPOS:'CAMBIO DE EQUIPOS',SOPORTE_TECNICO:'SOPORTE TÉCNICO',REUBICACION:'REUBICACIÓN',RETIRO:'RETIRO',OTRO:'OTRO'},tipo=tipos[O.tipo_trabajo]||up(O.tipo_trabajo||'—');ctx.innerHTML=`<div style=\"font-size:20px;font-weight:800\">${esc(up(O.id_orden||ordenId()||'—'))} · ${esc(up(O.cliente_nombre||'CLIENTE'))}</div><div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:10px\"><span class=\"badge\">👷 ${esc(tec)}</span><span class=\"badge okb\">🚐 ${esc(grp)}</span><span class=\"badge\">🛠️ ${esc(tipo)}</span></div>`"
          if old not in s:
              raise SystemExit('No se encontro el bloque actual del encabezado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit del parche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instalacion-ejecucion.html
          git commit -m "Mostrar tipo de trabajo en encabezado" || exit 0
          git push
