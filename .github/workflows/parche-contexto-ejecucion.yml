name: Parche contexto ejecucion

on:
  push:
    paths:
      - '.github/workflows/parche-contexto-ejecucion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dejar IP en solo lectura para técnico
        run: python .github/scripts/ip_solo_lectura_tecnico.py
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ip-servicio-v2.js instalacion-ejecucion.html
          git commit -m "Dejar confirmacion IP solo para responsables autorizados" || exit 0
          git push
