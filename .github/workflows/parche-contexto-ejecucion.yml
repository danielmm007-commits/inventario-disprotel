name: Parche contexto ejecucion

on:
  push:
    paths:
      - '.github/workflows/parche-contexto-ejecucion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parchar encabezado directo en HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('instalacion-ejecucion.html')
          s=p.read_text(encoding='utf-8')
          old='<section class="card intro"><h1>🔧 Ejecución técnica</h1><div class="muted">Continúa la misma orden. Abre únicamente la sección que necesitas.</div><div id="msg"></div></section>'
          new='<section class="card intro"><h1>🔧 Ejecución técnica</h1><div data-contexto-ejecucion="1" style="margin-top:8px"><div style="font-size:20px;font-weight:800">CARGANDO OT · CLIENTE...</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><span class="badge">👷 TÉCNICO</span><span class="badge okb">🚐 GRUPO</span></div></div><div id="msg"></div></section>'
          if old not in s:
              raise SystemExit('No se encontro el encabezado esperado')
          s=s.replace(old,new,1)
          old2="US=s.usuario;PIN=s.pin;O=JSON.parse(sessionStorage.getItem(INSTKEY)||'null');if(!O)throw new Error('No encuentro la instalación.');renderDatos();"
          new2="US=s.usuario;PIN=s.pin;O=JSON.parse(sessionStorage.getItem(INSTKEY)||'null');if(!O)throw new Error('No encuentro la instalación.');const ctx=document.querySelector('[data-contexto-ejecucion]');if(ctx){const tec=up(s.nombre||s.usuario||'—'),grp=up(s.unidad_grupo||s.grupo||'—');ctx.innerHTML=`<div style=\"font-size:20px;font-weight:800\">${esc(up(O.id_orden||ordenId()||'—'))} · ${esc(up(O.cliente_nombre||'CLIENTE'))}</div><div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:10px\"><span class=\"badge\">👷 ${esc(tec)}</span><span class=\"badge okb\">🚐 ${esc(grp)}</span></div>`}renderDatos();"
          if old2 not in s:
              raise SystemExit('No se encontro el bloque de sesion esperado')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit del parche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instalacion-ejecucion.html
          git commit -m "Pintar contexto directamente en ejecucion" || exit 0
          git push
