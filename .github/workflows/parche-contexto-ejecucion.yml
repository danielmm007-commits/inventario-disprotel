name: Parche contexto ejecucion

on:
  push:
    paths:
      - '.github/workflows/parche-contexto-ejecucion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar cierre y reporte
        run: python .github/scripts/actualizar_cache_evidencias_v2.py
      - name: Integrar visor de evidencias
        run: python .github/scripts/integrar_visor_evidencias.py
      - name: Integrar notificaciones
        run: python .github/scripts/integrar_notificaciones.py
      - name: Ajustar reporte A4
        run: python .github/scripts/ajustar_reporte_a4.py
      - name: Aplicar responsive global
        run: python .github/scripts/aplicar_responsive_global.py
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' responsive-global.css
          git commit -m "Publicar bloqueo estricto telefono" || exit 0
          git push
