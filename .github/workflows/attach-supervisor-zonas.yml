name: Conectar supervision por zonas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-supervisor-zonas.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insertar modulo de zonas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('panel-general-supervisor-visual.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="supervisor-zonas-interzonales-v1.js?v=20260914-1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel-general-supervisor-visual.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Activar supervision por zonas y apoyo interzonal"
            git push
          fi