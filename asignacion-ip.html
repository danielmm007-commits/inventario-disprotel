<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asignación de IP</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f7f9;color:#17313d;margin:0;padding:14px}.wrap{max-width:820px;margin:auto}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 7px 24px rgba(0,0,0,.08);margin:14px 0}h1,h2{margin-top:0}.muted{color:#60737c;font-size:13px}.req{border:1px solid #d7e1e5;border-radius:14px;padding:14px;margin-top:10px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#fff3cd;color:#725b00;font-size:12px;font-weight:700}input{width:100%;padding:13px;border:1px solid #cbd8de;border-radius:11px;font-size:16px;background:#fff}label{display:block;font-weight:700;margin:12px 0 6px}button{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:#17313d;color:#fff;font-size:16px;font-weight:700;margin-top:10px}.secondary{background:#e8eef1;color:#17313d}.hidden{display:none!important}.msg{padding:12px;border-radius:10px;margin-top:12px}.ok{background:#e8f6ed;color:#1b6c43}.err{background:#fdecec;color:#9d2525}</style></head><body><div class="wrap"><section class="card" id="login"><h1>Asignación de IP</h1><div class="muted">Solo usuarios autorizados pueden responder solicitudes de IP.</div><label>Usuario</label><input id="usuario"><label>PIN</label><input id="pin" inputmode="numeric"><button id="entrar">Entrar</button><div id="loginMsg"></div></section><div id="app" class="hidden"><section class="card"><h2 id="quien"></h2><button id="recargar" class="secondary">🔄 Actualizar solicitudes</button><button id="salir" class="secondary">Cambiar usuario</button></section><section class="card"><h2>🔔 IP pendientes</h2><div id="lista"></div></section><div id="msg"></div></div></div><script>const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-ordenes',KEY='disprotel_ip_test';let US='',PIN='',ultimo=0;const $=id=>document.getElementById(id);async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:US,pin:PIN,action,...payload})});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw new Error(d.error||'Error');return d}function fmt(x){try{return new Date(x).toLocaleString()}catch{return x}}function msg(t,ok=false){$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=t}async function cargar(){try{const d=await api('pending-ip');const arr=d.solicitudes||[];$('lista').innerHTML=arr.map(x=>`<div class="req"><b>${x.orden?.id_orden||''} · ${x.orden?.cliente_nombre||''}</b><br><span class="badge">ESPERANDO IP</span><div class="muted">Solicitada por ${x.solicitado_por?.nombre||''} · ${fmt(x.solicitado_at)}</div><div><b>Plan final:</b> ${x.orden?.plan_final||x.orden?.plan_solicitado||'—'}</div><div><b>TV:</b> ${x.orden?.tv_final?'Sí':'No'}</div><div><b>Dirección:</b> ${x.orden?.cliente_direccion||'—'}</div><label>IP asignada</label><input id="ip-${x.id}" placeholder="Ej. 172.x.x.x"><label>Observación</label><input id="ob-${x.id}" placeholder="Opcional"><button onclick="asignar('${x.id}')">CONFIRMAR IP ASIGNADA</button></div>`).join('')||'<div class="muted">No hay solicitudes de IP pendientes.</div>';if(arr.length>ultimo&&ultimo>0&&'Notification'in window&&Notification.permission==='granted')new Notification('DISPROTEL · Nueva solicitud de IP',{body:`Hay ${arr.length} solicitud(es) pendiente(s).`});ultimo=arr.length}catch(e){msg(e.message)}}async function asignar(id){const ip=$('ip-'+id).value.trim(),ob=$('ob-'+id).value.trim();if(!ip){msg('Ingresa la IP antes de confirmar.');return}try{await api('assign-ip',{solicitud_id:id,ip,observacion:ob});msg('IP asignada correctamente. El grupo técnico ya puede verla.',true);await cargar()}catch(e){msg(e.message)}}async function entrar(){US=$('usuario').value.trim();PIN=$('pin').value.trim();try{const d=await api('context');if(!d.me.puede_asignar_ip)throw new Error('Este usuario no está autorizado para asignar IP.');sessionStorage.setItem(KEY,JSON.stringify({usuario:US,pin:PIN}));$('login').classList.add('hidden');$('app').classList.remove('hidden');$('quien').textContent=`Asignación IP · ${d.me.nombre}`;if('Notification'in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{});await cargar();setInterval(cargar,15000)}catch(e){$('loginMsg').className='msg err';$('loginMsg').textContent=e.message}}$('entrar').onclick=entrar;$('recargar').onclick=cargar;$('salir').onclick=()=>{sessionStorage.removeItem(KEY);location.reload()};(async()=>{try{const s=JSON.parse(sessionStorage.getItem(KEY)||'null');if(s?.usuario&&s?.pin){$('usuario').value=s.usuario;$('pin').value=s.pin;await entrar()}}catch{sessionStorage.removeItem(KEY)}})();</script></body></html>
