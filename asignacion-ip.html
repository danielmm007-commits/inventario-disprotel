<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asignación de IP · DISPROTEL</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#f7f9fb,#eaf3ff);color:#17313d;margin:0;padding:14px}.wrap{max-width:950px;margin:auto}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 7px 24px rgba(0,0,0,.08);margin:14px 0}.muted{color:#60737c;font-size:13px}.req,.cand,.hist{border:1px solid #d7e1e5;border-radius:14px;padding:14px;margin-top:10px}.cand{background:#fbfdff}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#fff3cd;color:#725b00;font-size:12px;font-weight:800}.okb{background:#e8f6ed;color:#1b6c43}.ip{font-size:24px;font-weight:900;margin:7px 0}.label{font-size:12px;color:#60737c}.value{font-weight:800;margin-top:2px}input{width:100%;padding:12px;border:1px solid #cbd8de;border-radius:10px;font-size:16px}button{display:block;width:100%;border:0;border-radius:12px;padding:13px;background:#17313d;color:#fff;font-size:15px;font-weight:800;margin-top:10px}.secondary{background:#e8eef1;color:#17313d}.hidden{display:none!important}.msg{padding:12px;border-radius:10px;margin-top:12px}.ok{background:#e8f6ed;color:#1b6c43}.err{background:#fdecec;color:#9d2525}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab.active{background:#17313d;color:#fff}.searchRow{display:grid;grid-template-columns:1fr auto;gap:8px}.searchRow button{width:auto;margin:0}.hist b{display:block}.hist .meta{font-size:12px;color:#60737c;margin-top:4px}.changeBox{margin-top:10px;padding:12px;border:1px solid #d7e1e5;border-radius:12px;background:#f8fbfd}.changeActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.changeActions button{margin-top:8px}.fieldError{border-color:#c83d3d!important;background:#fff6f6}.inlineErr{color:#9d2525;font-size:12px;font-weight:700;margin-top:6px}@media(max-width:620px){body{padding:8px}.card{padding:14px;margin:8px 0}.row,.tabs,.searchRow{grid-template-columns:1fr}.searchRow button{width:100%}.ip{font-size:21px}}</style><link rel="stylesheet" href="responsive-global.css?v=20260818-2305"></head><body><div class="wrap"><section class="card" id="login"><h1>📡 Asignación de IP</h1><div class="muted">Asignación, reasignación e historial de IP.</div><input id="usuario" placeholder="Usuario" style="margin-top:10px"><input id="pin" inputmode="numeric" placeholder="PIN" style="margin-top:8px"><button id="entrar">ENTRAR</button><div id="loginMsg"></div></section><div id="app" class="hidden"><section class="card"><h2 id="quien"></h2><div class="tabs"><button id="tabPend" class="tab active">🔔 PENDIENTES</button><button id="tabHist" class="tab secondary">🔎 CONSULTA / HISTORIAL</button></div><button id="salir" class="secondary">CAMBIAR USUARIO</button></section><section class="card" id="secPend"><h2>🔔 Solicitudes de IP</h2><button id="recargar" class="secondary">🔄 ACTUALIZAR SOLICITUDES</button><div id="lista"></div></section><section class="card hidden" id="secHist"><h2>🔎 Consulta / Historial de IP</h2><div class="muted">Busca por IP, cliente u OT.</div><div class="searchRow" style="margin-top:10px"><input id="buscar" placeholder="Ej. 172.35.1.253, MOLINA o OT-20260816-51965"><button id="buscarBtn">BUSCAR</button></div><div id="asignadas"></div><div id="historial"></div></section><div id="msg"></div></div></div><script>const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-ip-candidatos',KEY='disprotel_ip_test';let US='',PIN='',timer=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const up=v=>String(v??'').toLocaleUpperCase('es-EC');const plan=v=>up(String(v||'').replace(/\/[0-9]+$/,''));async function api(action,p={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:US,pin:PIN,action,...p})});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw new Error(d.error||'Error');return d}function show(t,c='ok'){$('msg').className='msg '+c;$('msg').textContent=t}function fmt(v){try{return new Date(v).toLocaleString('es-EC')}catch{return v||'—'}}async function cargar(){try{const d=await api('pending-review'),arr=d.solicitudes||[];$('lista').innerHTML=arr.map(s=>{const o=s.orden||{},cs=s.candidatos||[],sol=s.solicitante||{};return `<div class="req"><b>${esc(o.id_orden||'')} · ${esc(up(o.cliente_nombre||''))}</b><div class="row" style="margin-top:9px"><div><div class="label">SOLICITADO POR</div><div class="value">${esc(up(sol.nombre||'—'))}</div></div><div><div class="label">GRUPO TÉCNICO</div><div class="value">${esc(up(o.grupo_asignado||sol.unidad_grupo||'—'))}</div></div></div><div class="muted" style="margin-top:7px">Fecha / hora solicitud: ${esc(fmt(s.solicitado_at))}</div>${cs.length?cs.map(c=>`<div class="cand"><span class="badge">⚠️ IP TENTATIVA</span><div class="ip">${esc(c.address)}</div><div class="row"><div><div class="label">CLIENTE OT</div><div class="value">${esc(up(o.cliente_nombre||'—'))}</div></div><div><div class="label">QUEUE MIKROTIK</div><div class="value">${esc(up(c.queue_name||c.comentario||'—'))}</div></div></div><div style="margin-top:8px"><div class="label">PLAN / GRUPO</div><div class="value">${esc(plan(c.plan_detectado||c.queue_parent||'PENDIENTE'))}</div></div><button onclick="confirmar('${o.id}','${c.id}')">✅ CONFIRMAR ESTA IP</button></div>`).join(''):'<div class="msg err">Todavía no hay candidata confiable.</div>'}<div class="cand"><b>✏️ CORREGIR / CONFIRMAR OTRA IP</b><input id="manual-${s.id}" inputmode="decimal" placeholder="Ej. 172.25.1.120"><input id="obs-${s.id}" placeholder="Observación opcional" style="margin-top:7px"><button onclick="manual('${s.id}','${o.id}')">✅ CONFIRMAR IP CORRECTA</button></div></div>`}).join('')||'<div class="muted">No hay solicitudes pendientes.</div>'}catch(e){show(e.message,'err')}}async function confirmar(orden,cand){if(!confirm('¿Confirmar esta IP como definitiva?'))return;try{await api('confirm',{orden_id:orden,candidato_id:cand});show('✅ IP confirmada.');await cargar()}catch(e){show(e.message,'err')}}async function manual(sol,orden){const ip=$('manual-'+sol).value.trim(),obs=$('obs-'+sol).value.trim();if(!ip)return show('Ingresa la IP correcta.','err');if(!confirm('¿Confirmar '+ip+' como IP definitiva?'))return;try{await api('assign-manual',{orden_id:orden,solicitud_id:sol,ip,observacion:obs});show('✅ IP corregida y confirmada.');await cargar()}catch(e){show(e.message,'err')}}async function buscarHist(){try{const d=await api('ip-history',{busqueda:$('buscar').value.trim()});const a=d.asignadas||[],h=d.historial||[];$('asignadas').innerHTML='<h3>IP actualmente asignadas</h3>'+ (a.map(x=>`<div class="hist"><span class="badge okb">✅ IP ACTUAL</span><div class="ip">${esc(x.ip_asignada||'—')}</div><b>${esc(x.id_orden)} · ${esc(up(x.cliente_nombre||''))}</b><div class="meta">Solicitada por ${esc(x.solicitado_por||'—')} · Grupo ${esc(x.grupo_asignado||'—')}</div><div class="meta">Confirmada por ${esc(x.asignada_por||'—')} · ${esc(fmt(x.asignada_at))}</div><button onclick="mostrarCambioIp('${x.orden_id}','${esc(x.ip_asignada||'')}')">🔁 REASIGNAR IP</button><div id="cambio-${x.orden_id}"></div></div>`).join('')||'<div class="muted">No hay IP actuales con ese criterio.</div>');$('historial').innerHTML='<h3>Historial</h3>'+ (h.map(x=>{const d=x.detalle||{};const txt=d.ip_nueva?`${d.ip_anterior||'—'} → ${d.ip_nueva}`:(d.ip||'');return `<div class="hist"><b>${esc(x.evento)}</b><div>${esc(txt)}</div><div class="meta">${esc(x.id_orden)} · ${esc(up(x.cliente_nombre||''))} · Grupo ${esc(x.grupo_asignado||'—')} · Solicitó ${esc(x.solicitado_por||'—')}</div><div class="meta">Realizado por ${esc(x.realizado_por||'—')} · ${esc(fmt(x.created_at))}</div>${d.motivo?`<div class="muted">Motivo: ${esc(d.motivo)}</div>`:''}</div>`}).join('')||'<div class="muted">No hay historial con ese criterio.</div>')}catch(e){show(e.message,'err')}}function mostrarCambioIp(orden,actual){const box=$('cambio-'+orden);if(!box)return;box.innerHTML=`<div class="changeBox"><b>🔁 REASIGNAR IP</b><div class="muted" style="margin-top:5px">IP ACTUAL: <b>${esc(actual)}</b></div><input id="nueva-${orden}" inputmode="decimal" placeholder="Nueva IP" style="margin-top:9px"><input id="motivo-${orden}" placeholder="Motivo de reasignación (obligatorio)" style="margin-top:7px"><div id="err-${orden}" class="inlineErr"></div><div class="changeActions"><button type="button" onclick="guardarCambioIp('${orden}','${esc(actual)}')">✅ GUARDAR REASIGNACIÓN</button><button type="button" class="secondary" onclick="cancelarCambioIp('${orden}')">✖ CANCELAR</button></div></div>`;setTimeout(()=>{const i=$('nueva-'+orden);if(i)i.focus()},0)}function cancelarCambioIp(orden){const box=$('cambio-'+orden);if(box)box.innerHTML=''}async function guardarCambioIp(orden,actual){const ipEl=$('nueva-'+orden),motivoEl=$('motivo-'+orden),err=$('err-'+orden);const nueva=(ipEl?.value||'').trim(),motivo=(motivoEl?.value||'').trim();if(ipEl)ipEl.classList.remove('fieldError');if(motivoEl)motivoEl.classList.remove('fieldError');if(err)err.textContent='';if(!nueva){if(ipEl)ipEl.classList.add('fieldError');if(err)err.textContent='Ingresa la nueva IP.';ipEl?.focus();return}if(!motivo){if(motivoEl)motivoEl.classList.add('fieldError');if(err)err.textContent='El motivo de reasignación es obligatorio.';motivoEl?.focus();return}if(!confirm('¿Cambiar '+actual+' por '+nueva+'?'))return;try{await api('change-confirmed-ip',{orden_id:orden,ip:nueva,motivo});show('✅ IP cambiada y registrada en historial.');await buscarHist()}catch(e){if(err)err.textContent=e.message;else show(e.message,'err')}}async function entrar(){US=$('usuario').value.trim();PIN=$('pin').value.trim();try{const d=await api('pending-review');sessionStorage.setItem(KEY,JSON.stringify({usuario:US,pin:PIN}));$('login').classList.add('hidden');$('app').classList.remove('hidden');$('quien').textContent='Asignación de IP · '+(d.me?.nombre||US);await cargar();timer=setInterval(cargar,8000)}catch(e){$('loginMsg').className='msg err';$('loginMsg').textContent=e.message}}function tab(hist){$('secPend').classList.toggle('hidden',hist);$('secHist').classList.toggle('hidden',!hist);$('tabPend').classList.toggle('active',!hist);$('tabHist').classList.toggle('active',hist);if(hist)buscarHist()}$('entrar').onclick=entrar;$('recargar').onclick=cargar;$('buscarBtn').onclick=buscarHist;$('buscar').onkeydown=e=>{if(e.key==='Enter')buscarHist()};$('tabPend').onclick=()=>tab(false);$('tabHist').onclick=()=>tab(true);$('salir').onclick=()=>{sessionStorage.removeItem(KEY);location.reload()};(async()=>{try{const s=JSON.parse(sessionStorage.getItem(KEY)||'null');if(s?.usuario&&s?.pin){$('usuario').value=s.usuario;$('pin').value=s.pin;await entrar()}}catch{sessionStorage.removeItem(KEY)}})();</script><script src="asignacion-ip-borrador-v1.js?v=20260818-1534"></script><script src="asignacion-ip-flujo-v2.js?v=20260818-1543"></script><script src="notificaciones-v1.js?v=20260817-2222"></script></body></html>
