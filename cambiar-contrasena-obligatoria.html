<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cambiar contraseña · DISPROTEL</title><style>
:root{--navy:#0b2a5c;--line:#d6e4ee;--bad:#9a2c2c;--ok:#246c47}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eaf3f9,#d8e8f3);font-family:Arial;color:#17313d}.card{width:min(500px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 24px 70px rgba(11,42,92,.2)}h1{margin:0 0 8px;color:var(--navy)}p{color:#687c87;line-height:1.5;font-size:14px}label{display:block;margin:15px 0 7px;font-weight:900;font-size:13px}input{width:100%;padding:14px;border:1px solid #c8dae6;border-radius:12px;font-size:16px}.rules{margin:14px 0;padding:12px;background:#f3f8fb;border-radius:12px;font-size:12px;line-height:1.55}.btn{width:100%;border:0;border-radius:13px;padding:15px;background:var(--navy);color:#fff;font-weight:900;font-size:15px;cursor:pointer}.msg{display:none;margin-top:13px;padding:11px;border-radius:10px;font-size:13px}.msg.show{display:block}.msg.bad{background:#fdecec;color:var(--bad)}.msg.ok{background:#eaf7ef;color:var(--ok)}
</style></head><body><main class="card"><small>DISPROTEL · SEGURIDAD</small><h1>Crea tu contraseña personal</h1><p>La contraseña temporal fue aceptada. Antes de ingresar al sistema debes reemplazarla.</p><label for="password">Nueva contraseña</label><input id="password" type="password" autocomplete="new-password"><label for="confirm">Repetir contraseña</label><input id="confirm" type="password" autocomplete="new-password"><div class="rules">Mínimo 10 caracteres e incluir mayúscula, minúscula, número y carácter especial.</div><button id="save" class="btn">GUARDAR CONTRASEÑA</button><div id="msg" class="msg"></div></main><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const url='https://ajnbswrwnjpjypjiorye.supabase.co',key='sb_publishable_PUj8G-mCFGniennS16O7UQ_eIeL482Y',api=url+'/functions/v1/inventario-password-admin';
const supabase=createClient(url,key,{auth:{persistSession:false,autoRefreshToken:false}}),pending=(()=>{try{return JSON.parse(sessionStorage.getItem('disprotel_auth_pending')||'null')}catch{return null}})();
const password=document.getElementById('password'),confirmPassword=document.getElementById('confirm'),save=document.getElementById('save'),msg=document.getElementById('msg');
function show(text,type='bad'){msg.className='msg show '+type;msg.textContent=text}
if(!pending?.access_token||!pending?.refresh_token){show('La sesión temporal no está disponible. Vuelve a iniciar sesión.');save.disabled=true}
save.onclick=async()=>{const value=password.value;if(value!==confirmPassword.value)return show('Las contraseñas no coinciden.');if(value.length<10||!/[A-Z]/.test(value)||!/[a-z]/.test(value)||!/[0-9]/.test(value)||!/[\W_]/.test(value))return show('La contraseña no cumple todos los requisitos.');save.disabled=true;save.textContent='GUARDANDO…';try{const set=await supabase.auth.setSession(pending);if(set.error)throw set.error;const updated=await supabase.auth.updateUser({password:value});if(updated.error)throw updated.error;const token=(await supabase.auth.getSession()).data.session?.access_token;if(!token)throw new Error('No se pudo confirmar la sesión');const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'confirm_changed'})});const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw new Error(d.error||'No se pudo confirmar el cambio');sessionStorage.removeItem('disprotel_auth_pending');sessionStorage.removeItem('disprotel_login_general_v2');await supabase.auth.signOut();show('Contraseña actualizada. Ya puedes iniciar sesión.','ok');setTimeout(()=>location.replace('login-general-v2.html'),1200)}catch(e){show(e.message||'No se pudo cambiar la contraseña.');save.disabled=false;save.textContent='GUARDAR CONTRASEÑA'}};
</script></body></html>
