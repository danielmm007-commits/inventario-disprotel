<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Incidencias de transferencias · Administración</title><style>body{margin:0;background:#eef4f7;font-family:Arial,sans-serif;color:#17313f}.wrap{max-width:1050px;margin:auto;padding:18px}.panel{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #17313f12}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.sub{color:#607583}.filters{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin:12px 0}.filters select,.filters input,.resolution textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c9d8df;border-radius:10px}.card{border:1px solid #dce7ec;border-radius:14px;padding:14px;margin-top:10px}.open{border-left:5px solid #d89b17;background:#fffaf0}.escalated{border-left:5px solid #b04b4b;background:#fff5f5}.resolved{border-left:5px solid #3b8f5a;background:#f5fff8}.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:5px 8px;background:#e8f1f5}.items{margin:8px 0}.resolution{margin-top:10px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.primary,.warning{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:#176b91;color:#fff}.warning{background:#f6e7bf;color:#775500}.empty{text-align:center;padding:18px;color:#71838c}@media(max-width:700px){.filters{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="panel"><div class="top"><div><h1 style="margin:0">Incidencias de transferencias</h1><p class="sub">Atención administrativa de recepciones con diferencia.</p></div><span id="sync">● CONECTANDO</span></div></section><section class="panel"><div class="filters"><select id="state"><option value="">Todos los estados</option><option value="ABIERTA">Abiertas</option><option value="ESCALADA">Escaladas</option><option value="SUBSANADA">Subsanadas</option></select><input id="search" placeholder="Buscar incidencia, transferencia, producto o persona"></div><div id="rows"></div></section></main><script>
const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-incidencias-transferencias';
const SESSION=(()=>{try{return JSON.parse(sessionStorage.getItem('disprotel_login_general_v2')||'null')}catch{return null}})();
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));let D=[];
async function api(action,payload={}){$('sync').textContent='🟡 GUARDANDO';const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-session':SESSION?.session_token||''},body:JSON.stringify({action,...payload})}),d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok||d.error){$('sync').textContent='🔴 ERROR';throw Error(d.error||'Error del servidor')}$('sync').textContent='● CONECTADO';return d}
function cardClass(s){return s==='SUBSANADA'?'resolved':s==='ESCALADA'?'escalated':'open'}
function render(){const st=$('state').value,q=$('search').value.trim().toLowerCase();let rows=D.filter(x=>(!st||x.estado===st)&&(!q||[x.id_incidencia,x.transferencia?.id_transferencia,x.producto?.codigo,x.producto?.producto,x.serial?.serial,x.responsable?.nombre,x.reportado_por?.nombre,x.descripcion,x.resolucion].some(v=>String(v||'').toLowerCase().includes(q))));$('rows').innerHTML=rows.length?rows.map(x=>'<article class="card '+cardClass(x.estado)+'"><span class="pill">'+esc(x.estado)+'</span><h3>'+esc(x.id_incidencia)+' · '+esc(x.transferencia?.id_transferencia||'SIN TRANSFERENCIA')+'</h3><div class="sub">'+new Date(x.fecha_apertura).toLocaleString('es-EC')+'</div><div class="items"><b>Artículo:</b> '+esc(x.producto?.codigo||'')+' · '+esc(x.producto?.producto||'')+(x.serial?.serial?'<br><b>Serial:</b> '+esc(x.serial.serial):'')+'<br><b>Faltante:</b> '+esc(x.cantidad_faltante)+' '+esc(x.producto?.unidad_medida||'')+'<br><b>Responsable origen:</b> '+esc(x.responsable?.nombre||'—')+'<br><b>Reportado por:</b> '+esc(x.reportado_por?.nombre||'—')+'<br><b>Ruta:</b> '+esc(x.transferencia?.origen?.ubicacion||'—')+' → '+esc(x.transferencia?.destino?.ubicacion||'—')+'<br><b>Detalle:</b> '+esc(x.descripcion||'—')+'</div>'+(x.estado==='SUBSANADA'?'<div class="items"><b>Resolución:</b> '+esc(x.resolucion||'—')+'<br><b>Atendido por:</b> '+esc(x.subsanado_por?.nombre||'—')+'<br><b>Fecha:</b> '+(x.fecha_subsanacion?new Date(x.fecha_subsanacion).toLocaleString('es-EC'):'—')+'</div>':'<div class="resolution"><textarea id="r_'+x.id+'" placeholder="Describe cómo se resolvió o por qué debe escalarse"></textarea><div class="buttons"><button class="primary" onclick="resolveInc(\''+x.id+'\')">✓ Marcar subsanada</button>'+(x.estado==='ABIERTA'?'<button class="warning" onclick="escalateInc(\''+x.id+'\')">⚠ Escalar</button>':'')+'</div></div>')+'</article>').join(''):'<div class="empty">No hay incidencias para estos filtros.</div>'}
async function resolveInc(id){const resolucion=$('r_'+id).value.trim();if(resolucion.length<10)return alert('Describe la resolución con al menos 10 caracteres.');if(!confirm('¿Marcar esta incidencia como subsanada?'))return;try{const d=await api('resolve',{id,resolucion});alert(d.message);await load()}catch(e){alert(e.message)}}
async function escalateInc(id){const resolucion=$('r_'+id).value.trim();if(resolucion.length<10)return alert('Describe el motivo del escalamiento con al menos 10 caracteres.');if(!confirm('¿Escalar esta incidencia?'))return;try{const d=await api('escalate',{id,resolucion});alert(d.message);await load()}catch(e){alert(e.message)}}
async function load(){if(!SESSION?.session_token)return location.replace('login-general-v2.html');const d=await api('list');D=d.incidencias||[];render()}
$('state').onchange=render;$('search').oninput=render;load().catch(e=>{$('sync').textContent='🔴 ERROR';alert(e.message)});
</script></body></html>
