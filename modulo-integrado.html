<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Módulo integrado · DISPROTEL</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#eef4f7;color:#17313d}.shell{height:100%;display:grid;grid-template-rows:auto 1fr}.bar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border-bottom:1px solid #dbe5ec;box-shadow:0 2px 12px rgba(7,26,56,.05);z-index:5}.brand{font-weight:1000;color:#0b2a5c}.brand small{display:block;color:#72838e;font-size:10px;margin-top:2px}.title{margin-left:auto;font-size:12px;font-weight:900;color:#526a78}.back{margin-left:8px;border:1px solid #dbe5ec;background:#0c3470;color:#fff;border-radius:10px;padding:9px 12px;font-weight:900;cursor:pointer}.frameWrap{position:relative;min-height:0}.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;color:#607583;font-weight:800;background:#eef4f7;z-index:2;text-align:center}.loading.hidden{display:none}.loading.error{color:#9d2525}.frame{width:100%;height:100%;border:0;display:block;visibility:hidden;opacity:0;transition:opacity .18s ease;background:#fff}.frame.show{visibility:visible;opacity:1}@media(max-width:680px){.bar{padding:8px 10px}.title{display:none}.back{padding:9px 10px}}</style></head><body><div class="shell"><header class="bar"><div class="brand">DISPROTEL<small>Centro de Control Principal</small></div><div class="title" id="title">Módulo integrado</div><button class="back" onclick="location.replace('principal.html')">← Panel principal</button></header><div class="frameWrap"><div class="loading" id="loading">Abriendo módulo…</div><iframe class="frame" id="frame" title="Módulo DISPROTEL"></iframe></div></div><script>(()=>{const KEY='disprotel_login_general_v2';let me=null;try{me=JSON.parse(sessionStorage.getItem(KEY)||'null')}catch{}if(!me?.usuario||(!me?.session_token&&!me?.pin)){location.replace('login-general-v2.html');return}const p=new URLSearchParams(location.search);const src=p.get('src')||'';const allowed={'index.html':'Inventario','trabajos-tecnicos.html':'Área técnica','solicitudes-oficina.html':'Solicitudes','asignacion-ip.html':'IP y acceso remoto'};if(!allowed[src]){location.replace('principal.html');return}title.textContent=p.get('titulo')||allowed[src];const base={usuario:me.usuario,pin:me.pin||'',session_token:me.session_token||'',nombre:me.nombre||'',unidad_grupo:me.unidad_grupo||''};if(src==='trabajos-tecnicos.html')sessionStorage.setItem('disprotel_trabajos_test',JSON.stringify(base));if(src==='solicitudes-oficina.html')sessionStorage.setItem('disprotel_ordenes_oficina_test',JSON.stringify({usuario:me.usuario,pin:me.pin||'',session_token:me.session_token||''}));if(src==='asignacion-ip.html')sessionStorage.setItem('disprotel_ip_test',JSON.stringify({usuario:me.usuario,pin:me.pin||'',session_token:me.session_token||''}));const f=document.getElementById('frame'),load=document.getElementById('loading');function listo(d){if(src==='index.html')return d.getElementById('loginCard')?.classList.contains('hidden')&&!d.getElementById('mainApp')?.classList.contains('hidden');return d.getElementById('login')?.classList.contains('hidden')&&!d.getElementById('app')?.classList.contains('hidden')}function errorTexto(d){if(src==='index.html')return d.getElementById('loginMsg')?.textContent?.trim()||'';return d.getElementById('loginMsg')?.textContent?.trim()||''}function mostrar(){load.classList.add('hidden');f.classList.add('show')}function fallo(t){load.classList.add('error');load.innerHTML='<div><b>No se pudo abrir este módulo con tu sesión actual.</b><br><span style="font-size:12px;font-weight:600">'+(t||'Verifica que tu perfil tenga permiso para este módulo.')+'</span><br><button onclick="location.replace(\'principal.html\')" style="margin-top:14px;border:0;border-radius:10px;padding:10px 13px;background:#0c3470;color:#fff;font-weight:900">Volver al panel</button></div>'}f.src=src+'?integrado=1&v='+Date.now();f.onload=async()=>{let d,w;try{d=f.contentDocument;w=f.contentWindow}catch{fallo('No se pudo abrir el módulo.');return}try{if(src==='index.html'){const nativeFetch=w.fetch.bind(w);w.fetch=(input,init={})=>{const url=typeof input==='string'?input:input?.url||'';if(url.includes('/functions/v1/inventario-api')){const h=new Headers(init.headers||{});h.set('x-user',me.usuario);h.set('x-pin',me.pin||'');h.set('x-session',me.session_token||'');init={...init,headers:h}}return nativeFetch(input,init)};w.eval('PIN='+JSON.stringify(me.pin||''));await w.eval('Promise.all([cargar(),cargarOpciones(),cargarProductosQ()])');d.getElementById('loginCard')?.classList.add('hidden');d.getElementById('mainApp')?.classList.remove('hidden');mostrar();return}if(listo(d)){mostrar();return}const u=d.getElementById('usuario'),pin=d.getElementById('pin'),btn=d.getElementById('entrar');if(u&&pin&&btn){u.value=me.usuario;pin.value=me.pin;btn.click()}}catch(e){fallo(e?.message||'No se pudo iniciar el módulo automáticamente.');return}let n=0;const timer=setInterval(()=>{n++;try{if(listo(d)){clearInterval(timer);mostrar();return}const e=errorTexto(d);if(e&&n>3){clearInterval(timer);fallo(e);return}}catch{}if(n>=40){clearInterval(timer);fallo('La sesión no pudo validarse a tiempo.')}} ,150)}})();</script></body></html>
