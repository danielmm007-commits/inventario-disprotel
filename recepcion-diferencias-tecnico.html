<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recepción con diferencias · Técnico</title><style>body{margin:0;background:#eef4f7;font-family:Arial,sans-serif;color:#17313f}.wrap{max-width:950px;margin:auto;padding:18px}.panel{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #17313f12}h1,h2{margin-top:0}.sub{color:#607583}.request{border:1px solid #dce7ec;border-radius:14px;padding:14px;margin-top:12px}.item{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #edf2f4}.item:first-child{border-top:0}.item input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c9d8df;border-radius:10px}.field{margin-top:12px}.field textarea{width:100%;box-sizing:border-box;min-height:72px;padding:10px;border:1px solid #c9d8df;border-radius:10px}.primary,.secondary{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:#176b91;color:white}.secondary{background:#f6e7bf;color:#775500}.empty{padding:18px;text-align:center;color:#71838c}.pill{display:inline-block;background:#f6e7bf;color:#775500;font-size:11px;font-weight:700;border-radius:999px;padding:5px 8px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.sync{font-size:12px;font-weight:700}@media(max-width:650px){.item{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="panel"><div class="top"><div><h1>Recepción con diferencias</h1><p class="sub">Prueba técnica aislada. Solo mueve al inventario lo que realmente recibiste y registra el faltante como incidencia.</p></div><span id="sync" class="sync">● CONECTANDO</span></div></section><section class="panel"><h2>📥 Transferencias pendientes</h2><div id="rows"></div></section></main><script>
const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-solicitudes-transferencias';
const DIFF='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-transferencia-diferencia';
const SESSION=(()=>{try{return JSON.parse(sessionStorage.getItem('disprotel_login_general_v2')||'null')}catch{return null}})();
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));let D=null;
async function post(url,payload){$('sync').textContent='🟡 GUARDANDO';const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-session':SESSION?.session_token||''},body:JSON.stringify(payload)}),d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok||d.error){$('sync').textContent='🔴 ERROR';throw Error(d.error||'Error del servidor')}$('sync').textContent='● CONECTADO';return d}
function label(i){return i.tipo_control==='SERIAL'?(i.producto?.producto||'EQUIPO')+' · S/N '+(i.serial?.serial||'SIN SERIAL'):(i.producto?.producto||'MATERIAL')+' · enviado: '+Number(i.cantidad||0)}
function render(){const rows=D?.incoming_transfers||[];$('rows').innerHTML=rows.length?rows.map(t=>'<article class="request"><span class="pill">PENDIENTE DE RECEPCIÓN</span><h3>'+esc(t.id_transferencia)+'</h3><div class="sub">'+esc(t.emisor?.nombre||'')+' · '+esc(t.origen?.ubicacion||'')+' → '+esc(t.destino?.ubicacion||'')+'</div><div style="margin-top:10px">'+(t.items||[]).map(i=>'<div class="item"><div><b>'+esc(label(i))+'</b><div class="sub">'+(i.tipo_control==='SERIAL'?'0 = no recibido · 1 = recibido':'Indica la cantidad física recibida')+'</div></div><input id="q_'+i.id+'" type="number" min="0" max="'+Number(i.cantidad||1)+'" step="1" value="'+Number(i.cantidad||1)+'"></div>').join('')+'</div><div class="field"><label><b>Detalle de la diferencia</b></label><textarea id="n_'+t.id+'" placeholder="Ej.: Se enviaron 10 conectores y llegaron 8; faltaron 2 unidades."></textarea></div><div style="margin-top:12px"><button class="secondary" onclick="sendDiff(\''+t.id+'\')">⚠ Registrar recepción con diferencia</button></div></article>').join(''):'<div class="empty">No tienes transferencias pendientes de recepción.</div>'}
async function sendDiff(id){const t=(D.incoming_transfers||[]).find(x=>x.id===id);if(!t)return;let hay=false,recepciones=[];for(const i of t.items||[]){const q=Number($('q_'+i.id).value),max=Number(i.cantidad||0);if(!Number.isFinite(q)||q<0||q>max||!Number.isInteger(q))return alert('Revisa la cantidad recibida de '+label(i));if(i.tipo_control==='SERIAL'&&![0,1].includes(q))return alert('Un equipo por serial solo puede marcarse 0 o 1');if(q<max)hay=true;recepciones.push({item_id:i.id,cantidad_recibida:q})}if(!hay)return alert('No existe ninguna diferencia. Para recepción completa usa “Recibí todo” en la pantalla normal.');const nota=$('n_'+id).value.trim();if(nota.length<5)return alert('Describe brevemente la diferencia detectada.');const resumen=(t.items||[]).map((i,k)=>label(i)+' → recibido: '+recepciones[k].cantidad_recibida).join('\n');if(!confirm('¿Registrar esta recepción con diferencia?\n\n'+resumen+'\n\nSe moverá únicamente lo recibido y se abrirá una incidencia por el faltante.'))return;try{const d=await post(DIFF,{id,recepciones,nota});alert(d.message||'Recepción registrada');await load()}catch(e){alert(e.message)}}
async function load(){if(!SESSION?.session_token)return location.replace('login-general-v2.html');D=await post(API,{action:'bootstrap'});if(!D.is_technician)return location.replace('solicitudes-transferencias.html');render()}
load().catch(e=>{$('sync').textContent='🔴 ERROR';alert(e.message)});
</script></body></html>
