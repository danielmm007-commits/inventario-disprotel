<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abrir captura · DISPROTEL</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef5f8;color:#17313d}.wrap{max-width:520px;margin:auto;padding:18px}.card{margin-top:12vh;background:#fff;border:1px solid #d5e4ec;border-radius:20px;padding:20px;box-shadow:0 10px 30px #0b2a5c18;text-align:center}.ico{font-size:48px}.card h1{font-size:22px;color:#0b2a5c;margin:8px 0}.card p{font-size:13px;color:#607583;line-height:1.5}.btn{display:block;width:100%;border:0;border-radius:13px;padding:15px;margin-top:12px;font-weight:900;font-size:15px;text-decoration:none;cursor:pointer}.chrome{background:linear-gradient(135deg,#0b2a5c,#1874d1);color:#fff}.copy{background:#edf6fc;color:#155c96;border:1px solid #c8e0f0}.note{margin-top:12px;font-size:11px;color:#738692;line-height:1.45}</style></head><body><main class="wrap"><section class="card"><div class="ico">🌐</div><h1>Abre esta captura en Chrome</h1><p>El visor interno del lector QR puede bloquear la cámara. Para tomar fotos, abre este enlace en Chrome.</p><button id="openChrome" class="btn chrome">🌐 Abrir en Chrome</button><button id="copy" class="btn copy">📋 Copiar enlace</button><div id="msg" class="note">Regla DISPROTEL: los flujos QR que usan cámara deben abrirse en un navegador con permisos de cámara.</div></section></main><script>const q=new URLSearchParams(location.search),target=q.get('target')||'';const msg=document.getElementById('msg');function isRealChrome(){const u=navigator.userAgent||'';return /Chrome\//.test(u)&&!/; wv\)|\bwv\b|FBAN|FBAV|Instagram|Line\//i.test(u)}if(target&&isRealChrome()){location.replace(target)}document.getElementById('openChrome').onclick=()=>{if(!target)return msg.textContent='Enlace de captura inválido.';try{const u=new URL(target);if(/Android/i.test(navigator.userAgent)){location.href='intent://'+u.host+u.pathname+u.search+'#Intent;scheme=https;package=com.android.chrome;end'}else{location.href=target}}catch{location.href=target}};document.getElementById('copy').onclick=async()=>{if(!target)return;try{await navigator.clipboard.writeText(target);msg.textContent='✅ Enlace copiado. Pégalo en Chrome.'}catch{msg.textContent='Mantén pulsado el enlace y elige Abrir en Chrome.'}};</script></body></html>
