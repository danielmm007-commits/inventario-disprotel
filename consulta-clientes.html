<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta de clientes · DISPROTEL</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#f4f7f9;color:#17313d;font-family:Arial,sans-serif}.wrap{max-width:920px;margin:auto}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 7px 24px rgba(0,0,0,.08);margin:14px 0}h1,h2,h3{margin-top:0}label{display:block;font-weight:700;margin:12px 0 6px}input{width:100%;padding:13px;border:1px solid #cbd8de;border-radius:11px;font-size:16px}button{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:#17313d;color:#fff;font-size:16px;font-weight:700;margin-top:10px}.secondary{background:#e8eef1;color:#17313d}.hidden{display:none!important}.muted{color:#60737c;font-size:13px}.msg{padding:12px;border-radius:10px;margin-top:12px}.ok{background:#e8f6ed;color:#1b6c43}.err{background:#fdecec;color:#9d2525}.cliente{border:1px solid #cfdde3;border-radius:16px;padding:15px;margin-top:14px}.clienteHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8eef1;font-size:12px;font-weight:700;white-space:nowrap}.servicio{border:1px solid #d7e1e5;border-radius:13px;padding:13px;margin-top:10px;background:#f9fbfc}.servicio strong{font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:9px}.dato{font-size:14px}.dato b{display:block;color:#60737c;font-size:11px;text-transform:uppercase;margin-bottom:2px}.ip{font-family:Consolas,monospace;font-weight:700}.searchRow{display:grid;grid-template-columns:1fr 180px;gap:10px;align-items:end}.searchRow button{margin:0}@media(max-width:650px){.grid,.searchRow{grid-template-columns:1fr}.clienteHead{display:block}.badge{margin-top:8px}}</style></head><body><div class="wrap"><section id="login" class="card"><h1>Clientes · DISPROTEL</h1><div class="muted">Consulta de clientes existentes y sus servicios.</div><label>Usuario</label><input id="usuario" autocomplete="username"><label>PIN</label><input id="pin" inputmode="numeric" autocomplete="current-password"><button id="entrar">Entrar</button><div id="loginMsg"></div></section><div id="app" class="hidden"><section class="card"><h2 id="quien"></h2><div class="muted">Busque por nombre, cédula, teléfono o código de servicio.</div><button id="salir" class="secondary">Cambiar usuario</button></section><section class="card"><div class="searchRow"><div><label>Buscar cliente o servicio</label><input id="q" placeholder="Ej.: JAMI MINTA, 0501742217, 09... o DSPR..."></div><button id="buscar">BUSCAR</button></div><div id="msg"></div><div id="resultados"></div></section></div></div><script>const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-clientes',KEY='disprotel_consulta_clientes_test';let US='',PIN='';const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function box(text,ok=false){const e=$('msg');e.className='msg '+(ok?'ok':'err');e.textContent=text}async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:US,pin:PIN,action,...payload})});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw new Error(d.error||'Error');return d}async function entrar(){US=$('usuario').value.trim().toLowerCase();PIN=$('pin').value.trim();try{const d=await api('context');sessionStorage.setItem(KEY,JSON.stringify({usuario:US,pin:PIN}));$('login').classList.add('hidden');$('app').classList.remove('hidden');$('quien').textContent='Consulta de clientes · '+d.me.nombre;$('q').focus()}catch(e){const m=$('loginMsg');m.className='msg err';m.textContent=e.message}}function render(clientes){const r=$('resultados');if(!clientes.length){r.innerHTML='<div class="msg err">No encontré clientes con esa búsqueda.</div>';return}r.innerHTML=clientes.map(c=>`<div class="cliente"><div class="clienteHead"><div><h3>${esc(c.nombre_completo)}</h3><div class="muted">Cédula / documento: <b>${esc(c.identificacion||'Sin dato')}</b>${c.telefono?' · Tel. '+esc(c.telefono):''}</div>${c.correo?`<div class="muted">${esc(c.correo)}</div>`:''}</div><span class="badge">${c.servicios.length} servicio${c.servicios.length===1?'':'s'}</span></div>${c.servicios.map((s,i)=>`<div class="servicio"><strong>Servicio ${i+1} · ${esc(s.codigo_servicio||'Sin código')}</strong><div class="grid"><div class="dato"><b>Dirección</b>${esc(s.direccion||'Sin dato')}</div><div class="dato"><b>Plan</b>${esc(s.plan||'Sin dato')}</div><div class="dato"><b>Router</b>${esc(s.router||'Sin dato')}</div><div class="dato"><b>IP registrada</b><span class="ip">${esc(s.ip||'Sin dato')}</span></div><div class="dato"><b>Conexión</b>${esc(s.tipo_conexion||'Sin dato')}</div><div class="dato"><b>Estado</b>${esc(s.estado||'Sin dato')}</div></div></div>`).join('')}</div>`).join('')}async function buscar(){const q=$('q').value.trim();if(q.length<2){box('Escriba al menos 2 caracteres.');return}try{box('Buscando...',true);const d=await api('search',{q});$('msg').className='';$('msg').textContent='';render(d.clientes||[])}catch(e){box(e.message)}}$('entrar').onclick=entrar;$('buscar').onclick=buscar;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')buscar()});$('salir').onclick=()=>{sessionStorage.removeItem(KEY);location.reload()};const saved=JSON.parse(sessionStorage.getItem(KEY)||'null');if(saved?.usuario&&saved?.pin){$('usuario').value=saved.usuario;$('pin').value=saved.pin;entrar()}</script></body></html>
