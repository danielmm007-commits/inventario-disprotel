<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingreso administrador · Puesta en marcha</title><style>:root{--navy:#0b2a5c;--blue:#1f75d8;--ink:#17313d;--muted:#687c87}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--ink);display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 86% 14%,#3ab8ff29,transparent 23%),linear-gradient(135deg,#edf5fb,#dceaf3)}.card{width:min(430px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 24px 70px #0b2a5c33}.ico{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;font-size:24px}h1{font-size:23px;color:#0e3266;margin:16px 0 7px}.sub{font-size:13px;line-height:1.5;color:var(--muted);margin-bottom:20px}label{display:block;margin:13px 0 6px;font-size:12px;font-weight:900;color:#254b72}input{width:100%;border:1px solid #c8dae6;border-radius:13px;padding:14px;font-size:15px;outline:none}input:focus{border-color:#2f82dc;box-shadow:0 0 0 4px #2f82dc1f}button{width:100%;border:0;border-radius:13px;margin-top:19px;padding:14px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;font-weight:900;cursor:pointer}button:disabled{opacity:.65}.msg{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;font-size:12px}.msg.show{display:block}.msg.err{background:#fdecec;color:#9a2c2c}.msg.ok{background:#eaf7ef;color:#246c47}.note{margin-top:13px;padding:10px;border-radius:10px;background:#eef6fb;color:#54707f;font-size:11px;line-height:1.45}.back{display:block;text-align:center;margin-top:13px;color:#195f9c;font-size:11px;font-weight:900;text-decoration:none}</style></head><body><main class="card"><div class="ico">🔐</div><h1>Sesión administrativa requerida</h1><div class="sub">Ingresa con tu cédula o correo institucional y tu contraseña actual.</div><label>CÉDULA O CORREO</label><input id="login" autocomplete="username" placeholder="Cédula o correo institucional"><label>CONTRASEÑA</label><input id="password" type="password" autocomplete="current-password"><button id="go">INGRESAR Y CONTINUAR →</button><div id="msg" class="msg"></div><div class="note">Este acceso utiliza la misma cuenta segura del Centro de Control. Los usuarios y PIN antiguos ya no se aceptan aquí.</div><a class="back" href="principal.html">← VOLVER AL CENTRO DE CONTROL</a></main><script>const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-auth-login',u=document.getElementById('login'),p=document.getElementById('password'),go=document.getElementById('go'),msg=document.getElementById('msg');const requestedReturn=new URLSearchParams(location.search).get('return')||'puesta-en-marcha-integrada.html';const returnTo=/^puesta-en-marcha-integrada\.html(?:\?[A-Za-z0-9._~%=&+-]*)?$/.test(requestedReturn)?requestedReturn:'puesta-en-marcha-integrada.html';function show(t,k='err'){msg.className='msg show '+k;msg.textContent=t}function saveSession(d){const x=d.usuario||{};sessionStorage.setItem('disprotel_login_general_v2',JSON.stringify({usuario:x.usuario||u.value.trim(),nombre:x.nombre||'',rol:x.rol||'',id:x.id||'',es_admin_principal:!!x.es_admin_principal,unidad_grupo:x.unidad_grupo||'',puede_asignar_ip:!!x.puede_asignar_ip,panel_vista:x.panel_vista||'AMPLIA',avatar_tipo:x.avatar_tipo||'NEUTRO',session_token:d.session_token||'',expires_at:d.expires_at||'',auth_session:d.auth_session||null}))}async function entrar(){const login=u.value.trim().toLowerCase(),password=p.value;if(!login||!password)return show('Escribe tu cédula o correo y contraseña.');go.disabled=true;go.textContent='VALIDANDO…';show('Conectando con el servidor…','ok');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login,password})}),d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok||!d.ok)throw new Error(d.error||'No se pudo iniciar sesión');const me=d.usuario||{},rol=String(me.rol||'').toUpperCase();if(!(me.es_admin_principal||rol==='ADMINISTRADOR'||rol==='ADMINISTRADOR SUPREMO'))throw new Error('La puesta en marcha requiere un Administrador Supremo autorizado.');saveSession(d);show('🟢 Sesión segura válida. Abriendo puesta en marcha…','ok');setTimeout(()=>location.replace(returnTo),250)}catch(e){show(e.message||'No se pudo iniciar sesión');go.disabled=false;go.textContent='INGRESAR Y CONTINUAR →'}}go.onclick=entrar;p.addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});u.addEventListener('keydown',e=>{if(e.key==='Enter')p.focus()});</script></body></html>
