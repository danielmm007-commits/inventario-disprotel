<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingreso administrador · Puesta en marcha</title><style>:root{--navy:#0b2a5c;--blue:#1f75d8;--ink:#17313d;--muted:#687c87}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--ink);display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 86% 14%,rgba(58,184,255,.16),transparent 23%),linear-gradient(135deg,#edf5fb,#dceaf3)}.card{width:min(430px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 24px 70px rgba(11,42,92,.2)}.ico{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;font-size:24px}h1{font-size:23px;color:#0e3266;margin:16px 0 7px}.sub{font-size:13px;line-height:1.5;color:var(--muted);margin-bottom:20px}label{display:block;margin:13px 0 6px;font-size:12px;font-weight:900;color:#254b72}input{width:100%;border:1px solid #c8dae6;border-radius:13px;padding:14px;font-size:15px;outline:none}input:focus{border-color:#2f82dc;box-shadow:0 0 0 4px rgba(47,130,220,.12)}button{width:100%;border:0;border-radius:13px;margin-top:19px;padding:14px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;font-weight:900;cursor:pointer;transition:.15s}button:hover{transform:translateY(-2px)}button:active{transform:translateY(1px) scale(.98)}button:disabled{opacity:.65}.msg{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;font-size:12px}.msg.show{display:block}.msg.err{background:#fdecec;color:#9a2c2c}.msg.ok{background:#eaf7ef;color:#246c47}</style></head><body><main class="card"><div class="ico">🔐</div><h1>Sesión administrativa requerida</h1><div class="sub">Ingresa con tu usuario administrador. Al validar, volverás automáticamente a la puesta en marcha.</div><label>USUARIO</label><input id="usuario" autocomplete="username"><label>CONTRASEÑA / PIN</label><input id="pin" type="password" autocomplete="current-password"><button id="go">INGRESAR Y CONTINUAR →</button><div id="msg" class="msg"></div></main><script>const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-login',u=document.getElementById('usuario'),p=document.getElementById('pin'),go=document.getElementById('go'),msg=document.getElementById('msg');const requestedReturn=new URLSearchParams(location.search).get('return')||'puesta-en-marcha-integrada.html';const returnTo=/^puesta-en-marcha-integrada\.html(?:\?[A-Za-z0-9._~%=&+-]*)?$/.test(requestedReturn)?requestedReturn:'puesta-en-marcha-integrada.html';function show(t,k='err'){msg.className='msg show '+k;msg.textContent=t}function saveSession(me,usuario,pin){const base={usuario,pin,nombre:me.nombre||'',unidad_grupo:me.unidad_grupo||''};sessionStorage.setItem('disprotel_login_general_v2',JSON.stringify({...base,rol:me.rol||'',id:me.id||''}));sessionStorage.setItem('disprotel_ordenes_oficina_test',JSON.stringify({usuario,pin}))}async function entrar(){const usuario=u.value.trim().toLowerCase(),pin=p.value.trim();if(!usuario||!pin)return show('Escribe usuario y contraseña.');go.disabled=true;go.textContent='VALIDANDO…';show('Validando sesión administrativa…','ok');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario,pin})}),d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok||!d?.ok)throw new Error(d?.error||'No se pudo iniciar sesión');const me=d.usuario||{},rol=String(me.rol||'').toUpperCase();if(!(me.es_admin_principal||rol==='ADMINISTRADOR'||rol==='ADMINISTRADOR SUPREMO'))throw new Error('Esta puesta en marcha requiere un administrador autorizado.');saveSession(me,usuario,pin);show('Sesión válida. Abriendo puesta en marcha…','ok');setTimeout(()=>location.replace(returnTo),250)}catch(e){show(e.message||'No se pudo iniciar sesión');go.disabled=false;go.textContent='INGRESAR Y CONTINUAR →'}}go.onclick=entrar;p.addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});u.addEventListener('keydown',e=>{if(e.key==='Enter')p.focus()});</script></body></html>
