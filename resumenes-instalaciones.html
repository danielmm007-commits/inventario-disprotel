<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resúmenes de instalaciones</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f7f9;color:#17313d;margin:0;padding:14px}.wrap{max-width:760px;margin:auto}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 7px 24px rgba(0,0,0,.08);margin:14px 0}.inst{border:1px solid #d7e1e5;border-radius:14px;padding:14px;margin-top:10px}.muted{color:#60737c;font-size:13px}button,a.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:#17313d;color:#fff;font-size:16px;font-weight:700;margin-top:10px;text-decoration:none;text-align:center}.secondary{background:#e8eef1;color:#17313d}.hidden{display:none}.msg{padding:12px;border-radius:10px;margin-top:12px}.err{background:#fdecec;color:#9d2525}input{width:100%;padding:13px;border:1px solid #cbd8de;border-radius:11px;font-size:16px;margin-top:6px}</style></head><body><div class="wrap"><section class="card" id="login"><h1>Resúmenes de instalaciones</h1><div class="muted">Consulta las fichas completas de tus instalaciones recientes.</div><label>Usuario</label><input id="usuario"><label>PIN</label><input id="pin" inputmode="numeric"><button id="entrar">Entrar</button><div id="loginMsg"></div></section><section class="card hidden" id="app"><h2 id="quien"></h2><div id="lista"></div><a class="btn secondary" href="instalaciones.html">← Nueva instalación</a><a class="btn secondary" href="evidencias-instalaciones.html">📷 Evidencias</a><button id="salir" class="secondary">Cambiar usuario</button></section></div><script>const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-instalaciones',SESSION_KEY='disprotel_instalaciones_test_session';let US='',PIN='';const $=id=>document.getElementById(id);async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:US,pin:PIN,action,...payload})});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw new Error(d.error||'Error');return d}function fmt(x){try{return new Date(x).toLocaleString()}catch{return x}}function render(items){$('lista').innerHTML=items.length?items.map(x=>`<div class="inst"><b>${x.cliente_nombre}</b><br><span class="muted">${x.id_instalacion} · ${fmt(x.fecha_hora)}</span><br><span class="muted">${x.tipo_trabajo}${x.registro_tardio?' · REGISTRO TARDÍO':''}</span><a class="btn" href="resumen-instalacion.html?id=${encodeURIComponent(x.id)}">VER RESUMEN</a></div>`).join(''):'<div class="muted">No hay instalaciones recientes.</div>'}async function entrar(){const lm=$('loginMsg');lm.textContent='';US=$('usuario').value.trim();PIN=$('pin').value.trim();try{await api('context');sessionStorage.setItem(SESSION_KEY,JSON.stringify({usuario:US,pin:PIN}));const d=await api('recent-installations');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('quien').textContent=`Resúmenes · ${US}`;render(d.instalaciones||[])}catch(e){lm.className='msg err';lm.textContent=e.message}}$('entrar').onclick=entrar;$('salir').onclick=()=>{sessionStorage.removeItem(SESSION_KEY);location.reload()};(async()=>{try{const s=JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null');if(s?.usuario&&s?.pin){US=s.usuario;PIN=s.pin;$('usuario').value=US;$('pin').value=PIN;await api('context');const d=await api('recent-installations');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('quien').textContent=`Resúmenes · ${US}`;render(d.instalaciones||[])}}catch{sessionStorage.removeItem(SESSION_KEY)}})();</script></body></html>
