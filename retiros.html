<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retiros DISPROTEL</title><script src="https://unpkg.com/@zxing/browser@0.2.0"></script><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f7f9;color:#17313d;margin:0;padding:14px}.wrap{max-width:640px;margin:auto}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 7px 24px rgba(0,0,0,.08);margin:14px 0}h1,h2{margin-top:0}.muted{color:#60737c;font-size:13px}label{display:block;font-weight:700;margin:13px 0 6px}input,select,textarea{width:100%;padding:13px;border:1px solid #cbd8de;border-radius:11px;font-size:16px;background:#fff}textarea{min-height:70px}button{width:100%;border:0;border-radius:12px;padding:14px;background:#17313d;color:white;font-size:16px;font-weight:700;margin-top:12px}.secondary{background:#e8eef1;color:#17313d}.hidden{display:none!important}.msg{padding:12px;border-radius:10px;margin-top:12px;display:none}.ok{display:block;background:#e8f6ed;color:#1b6c43}.err{display:block;background:#fdecec;color:#9d2525}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.scanbox{margin-top:10px;padding:10px;background:#f4f7f9;border-radius:12px}.scanbox video{width:100%;max-height:320px;background:#111;border-radius:12px}.stock{font-weight:700;color:#26734d}</style></head><body><div class="wrap"><section class="card" id="login"><h1>Retirar de Bodega Matriz</h1><div class="muted">Prueba de retiros hacia la minibodega del técnico.</div><label>Usuario</label><input id="usuario" placeholder="Ej. luis"><label>PIN</label><input id="pin" inputmode="numeric"><button id="entrar">Entrar</button><div id="loginMsg" class="msg"></div></section><div id="app" class="hidden"><section class="card"><h2 id="quien"></h2><div id="rol" class="muted"></div><button id="salir" class="secondary">Cambiar usuario</button></section><section class="card"><h2>Nuevo retiro</h2><div id="destinoFijo" class="muted"></div><div id="adminCampos" class="hidden"><label>Destino</label><select id="destino"></select><label>¿Quién se llevó el material?</label><select id="retiradoPor"></select></div><label>Tipo</label><select id="tipo"><option value="SERIAL">Equipo por serial</option><option value="CANTIDAD">Material por cantidad</option></select><div id="serialWrap"><label>Equipo disponible en Matriz</label><select id="serial"></select><div class="grid"><button id="abrirCamara" type="button" class="secondary">📷 Escanear con cámara</button><button id="cerrarCamara" type="button" class="secondary hidden">Cerrar cámara</button></div><div id="scanBox" class="scanbox hidden"><video id="video" playsinline></video><div class="muted">Apunta al código de barras o QR del equipo.</div></div></div><div id="cantWrap" class="hidden"><label>Material disponible en Matriz</label><select id="producto"></select><div id="stockInfo" class="muted"></div><label>Cantidad</label><input id="cantidad" type="number" min="1" step="1"></div><label>Observación</label><textarea id="obs" placeholder="Opcional"></textarea><button id="retirar">Registrar retiro</button><div id="msg" class="msg"></div></section></div></div><script>const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-retiros';let US='',PIN='',ctx=null,scanControls=null;const $=id=>document.getElementById(id);function showMsg(t,ok=false){$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=t}function clearMsg(){ $('msg').className='msg';$('msg').textContent=''}async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:US,pin:PIN,action,...payload})});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw new Error(d.error||'Error');return d}function cargar(){ $('serial').innerHTML='<option value="">Selecciona un equipo</option>'+ctx.seriales.map(s=>`<option value="${s.serial}">${s.codigo||''} · ${s.producto||''} · ${s.serial}</option>`).join('');$('producto').innerHTML='<option value="">Selecciona</option>'+ctx.cantidades.map(p=>`<option value="${p.id}" data-stock="${p.disponible}">${p.codigo} · ${p.producto} — disponibles: ${p.disponible}</option>`).join('');if(ctx.me.admin){$('adminCampos').classList.remove('hidden');$('destino').innerHTML='<option value="">Selecciona</option>'+ctx.destinos.map(d=>`<option value="${d.id}">${d.ubicacion}</option>`).join('');filtrarPersonas()}else{$('adminCampos').classList.add('hidden');$('destinoFijo').textContent='Destino automático: '+(ctx.destino_fijo?.ubicacion||ctx.me.grupo)}actualizarStock()}async function refrescar(){ctx=await api('context');cargar()}async function entrar(){US=$('usuario').value.trim();PIN=$('pin').value.trim();try{await refrescar();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('quien').textContent=ctx.me.nombre;$('rol').textContent=`${ctx.me.rol} · ${ctx.me.grupo}`;}catch(e){$('loginMsg').className='msg err';$('loginMsg').textContent=e.message}}function filtrarPersonas(){const nombre=$('destino').selectedOptions[0]?.textContent||'';$('retiradoPor').innerHTML='<option value="">Selecciona</option>'+ctx.personas.filter(p=>p.unidad_grupo===nombre).map(p=>`<option value="${p.id}">${p.nombre}</option>`).join('')}function actualizarStock(){const o=$('producto').selectedOptions[0];const st=o?.dataset?.stock;$('stockInfo').innerHTML=st?`Disponible en Matriz: <span class="stock">${st}</span>`:'';if(st)$('cantidad').max=st;else $('cantidad').removeAttribute('max')}function cerrarCamara(){try{scanControls?.stop()}catch{}scanControls=null;const v=$('video');if(v.srcObject){for(const t of v.srcObject.getTracks())t.stop();v.srcObject=null}$('scanBox').classList.add('hidden');$('cerrarCamara').classList.add('hidden');$('abrirCamara').classList.remove('hidden')}async function abrirCamara(){clearMsg();if(!window.ZXingBrowser){showMsg('No se pudo cargar el lector de cámara.');return}try{$('scanBox').classList.remove('hidden');$('cerrarCamara').classList.remove('hidden');$('abrirCamara').classList.add('hidden');const reader=new ZXingBrowser.BrowserMultiFormatReader();scanControls=await reader.decodeFromVideoDevice(undefined,$('video'),(result,error,controls)=>{if(result){const code=result.getText().trim().toUpperCase();const opt=[...$('serial').options].find(o=>o.value.toUpperCase()===code);if(opt){$('serial').value=opt.value;showMsg(`Equipo detectado: ${opt.text}`,true);controls.stop();cerrarCamara()}else showMsg(`Leí ${code}, pero ese serial no está disponible en BODEGA MATRIZ.`)}})}catch(e){cerrarCamara();showMsg('No pude abrir la cámara. Revisa el permiso del navegador.')}}$('entrar').onclick=entrar;$('salir').onclick=()=>{cerrarCamara();location.reload()};$('destino').onchange=filtrarPersonas;$('producto').onchange=actualizarStock;$('abrirCamara').onclick=abrirCamara;$('cerrarCamara').onclick=cerrarCamara;$('tipo').onchange=()=>{const s=$('tipo').value==='SERIAL';$('serialWrap').classList.toggle('hidden',!s);$('cantWrap').classList.toggle('hidden',s);if(!s)cerrarCamara()};$('retirar').onclick=async()=>{clearMsg();try{const tipo=$('tipo').value,p={tipo_control:tipo,observacion:$('obs').value.trim()};if(ctx.me.admin){p.destino_id=$('destino').value;p.retirado_por_id=$('retiradoPor').value}if(tipo==='SERIAL')p.serial=$('serial').value;else{p.producto_id=$('producto').value;p.cantidad=Number($('cantidad').value)}const d=await api('withdraw',p);showMsg(`${d.detalle} → ${d.destino}. Registrado por: ${d.registrado_por}. Retiró: ${d.retirado_por}.`,true);$('cantidad').value='';await refrescar()}catch(e){showMsg(e.message)}};</script></body></html>
