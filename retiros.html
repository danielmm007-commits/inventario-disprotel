<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retiros DISPROTEL</title><script src="https://unpkg.com/@zxing/browser@0.2.0"></script><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f7f9;color:#17313d;margin:0;padding:14px}.wrap{max-width:720px;margin:auto}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 7px 24px rgba(0,0,0,.08);margin:14px 0}h1,h2,h3{margin-top:0}.muted{color:#60737c;font-size:13px}label{display:block;font-weight:700;margin:13px 0 6px}input,select,textarea{width:100%;padding:13px;border:1px solid #cbd8de;border-radius:11px;font-size:16px;background:#fff}textarea{min-height:70px}button{width:100%;border:0;border-radius:12px;padding:14px;background:#17313d;color:white;font-size:16px;font-weight:700;margin-top:12px}.secondary{background:#e8eef1;color:#17313d}.danger{background:#8a2d2d}.hidden{display:none!important}.msg{padding:12px;border-radius:10px;margin-top:12px;display:none}.ok{display:block;background:#e8f6ed;color:#1b6c43}.err{display:block;background:#fdecec;color:#9d2525}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.scanbox{margin-top:10px;padding:10px;background:#f4f7f9;border-radius:12px}.scanbox video{width:100%;max-height:320px;background:#111;border-radius:12px}.stock{font-weight:700;color:#26734d}.cart{margin-top:12px}.cartItem{display:flex;gap:10px;align-items:flex-start;background:#f4f7f9;border-radius:12px;padding:12px;margin-top:8px}.cartText{flex:1}.cartItem button{width:auto;margin:0;padding:8px 10px;font-size:13px}.badge{display:inline-block;background:#e8eef1;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:700}.summary{background:#eef6f9;border-radius:12px;padding:12px;margin-top:12px}.summary strong{display:block;margin-bottom:4px}.empty{color:#60737c;padding:12px 0}.serialList{max-height:320px;overflow:auto;border:1px solid #d7e1e5;border-radius:12px;padding:6px;background:#fff}.serialRow{display:flex;gap:10px;align-items:flex-start;padding:10px;border-bottom:1px solid #edf2f4}.serialRow:last-child{border-bottom:0}.serialRow input{width:22px;height:22px;margin:1px 0 0}.serialMeta{flex:1}.serialMeta b{display:block}.counter{font-weight:700;margin-top:8px}</style></head><body><div class="wrap"><section class="card" id="login"><h1>Retirar de Bodega Matriz</h1><div class="muted">Arma el retiro completo y confírmalo una sola vez.</div><label>Usuario</label><input id="usuario" placeholder="Ej. luis"><label>PIN</label><input id="pin" inputmode="numeric"><button id="entrar">Entrar</button><div id="loginMsg" class="msg"></div></section><div id="app" class="hidden"><section class="card"><h2 id="quien"></h2><div id="rol" class="muted"></div><button id="salir" class="secondary">Cambiar usuario</button></section><section class="card"><h2>Nuevo retiro</h2><div id="destinoFijo" class="muted"></div><div id="adminCampos" class="hidden"><label>Destino</label><select id="destino"></select><label>¿Quién se llevó el material?</label><select id="retiradoPor"></select></div><label>Tipo de artículo</label><select id="tipo"><option value="SERIAL">Equipo por serial</option><option value="CANTIDAD">Material por cantidad</option></select><div id="serialWrap"><label>Equipos disponibles en Matriz</label><div id="serialList" class="serialList"></div><div id="seleccionados" class="muted counter"></div><div class="grid"><button id="agregarSeleccionados" type="button">Agregar seleccionados</button><button id="abrirCamara" type="button" class="secondary">📷 Escanear</button></div><button id="cerrarCamara" type="button" class="secondary hidden">Cerrar cámara</button><div id="scanBox" class="scanbox hidden"><video id="video" playsinline></video><div class="muted">Cada serial leído se agrega directamente al carrito.</div></div></div><div id="cantWrap" class="hidden"><label>Material disponible en Matriz</label><select id="producto"></select><div id="stockInfo" class="muted"></div><label>Cantidad</label><input id="cantidad" type="number" min="1" step="1"><button id="agregarCantidad" type="button">Agregar al retiro</button></div></section><section class="card"><h2>Resumen del retiro</h2><div id="carrito" class="cart"></div><div id="totales" class="summary hidden"></div><label>Observación general</label><textarea id="obs" placeholder="Opcional"></textarea><button id="confirmar" class="hidden">CONFIRMAR RETIRO</button><button id="vaciar" class="secondary hidden">Vaciar carrito</button><div id="msg" class="msg"></div></section></div></div><script>const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-retiros';let US='',PIN='',ctx=null,scanControls=null,carrito=[];const $=id=>document.getElementById(id);function showMsg(t,ok=false){$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=t}function clearMsg(){$('msg').className='msg';$('msg').textContent=''}async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:US,pin:PIN,action,...payload})});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw new Error(d.error||'Error');return d}function cargar(){const usados=new Set(carrito.filter(x=>x.tipo_control==='SERIAL').map(x=>x.serial));const disponibles=ctx.seriales.filter(s=>!usados.has(s.serial));$('serialList').innerHTML=disponibles.length?disponibles.map(s=>`<label class="serialRow"><input type="checkbox" class="serialCheck" value="${s.serial}"><span class="serialMeta"><b>${s.producto||''}</b><span>${s.codigo||''} · ${s.serial}</span></span></label>`).join(''):'<div class="empty">No hay equipos serializados disponibles en Matriz.</div>';$('producto').innerHTML='<option value="">Selecciona</option>'+ctx.cantidades.map(p=>{const enCarrito=carrito.filter(x=>x.tipo_control==='CANTIDAD'&&x.producto_id===p.id).reduce((a,x)=>a+x.cantidad,0),rest=Math.max(0,p.disponible-enCarrito);return `<option value="${p.id}" data-stock="${rest}" ${rest<=0?'disabled':''}>${p.codigo} · ${p.producto} — disponibles: ${rest}</option>`}).join('');if(ctx.me.admin){$('adminCampos').classList.remove('hidden');const sel=$('destino').value;$('destino').innerHTML='<option value="">Selecciona</option>'+ctx.destinos.map(d=>`<option value="${d.id}">${d.ubicacion}</option>`).join('');if(sel)$('destino').value=sel;filtrarPersonas()}else{$('adminCampos').classList.add('hidden');$('destinoFijo').textContent='Destino automático: '+(ctx.destino_fijo?.ubicacion||ctx.me.grupo)}actualizarStock();renderCarrito();actualizarSeleccionados()}async function refrescar(){ctx=await api('context');cargar()}async function entrar(){US=$('usuario').value.trim();PIN=$('pin').value.trim();try{await refrescar();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('quien').textContent=ctx.me.nombre;$('rol').textContent=`${ctx.me.rol} · ${ctx.me.grupo}`;}catch(e){$('loginMsg').className='msg err';$('loginMsg').textContent=e.message}}function filtrarPersonas(){if(!ctx?.me?.admin)return;const nombre=$('destino').selectedOptions[0]?.textContent||'',actual=$('retiradoPor').value;$('retiradoPor').innerHTML='<option value="">Selecciona</option>'+ctx.personas.filter(p=>p.unidad_grupo===nombre).map(p=>`<option value="${p.id}">${p.nombre}</option>`).join('');if(actual)$('retiradoPor').value=actual}function actualizarStock(){const o=$('producto').selectedOptions[0],st=Number(o?.dataset?.stock||0);$('stockInfo').innerHTML=st?`Disponible para agregar: <span class="stock">${st}</span>`:'';if(st)$('cantidad').max=st;else $('cantidad').removeAttribute('max')}function actualizarSeleccionados(){const n=document.querySelectorAll('.serialCheck:checked').length;$('seleccionados').textContent=n?`${n} equipo${n===1?'':'s'} seleccionado${n===1?'':'s'}`:'Ningún equipo seleccionado'}function renderCarrito(){if(!carrito.length){$('carrito').innerHTML='<div class="empty">Todavía no has agregado artículos.</div>';$('totales').classList.add('hidden');$('confirmar').classList.add('hidden');$('vaciar').classList.add('hidden');return}$('carrito').innerHTML=carrito.map((x,i)=>`<div class="cartItem"><div class="cartText"><span class="badge">${x.tipo_control==='SERIAL'?'SERIAL':'CANTIDAD'}</span><br><b>${x.detalle}</b></div><button class="danger" onclick="quitar(${i})">Quitar</button></div>`).join('');const seriales=carrito.filter(x=>x.tipo_control==='SERIAL').length,unidades=carrito.filter(x=>x.tipo_control==='CANTIDAD').reduce((a,x)=>a+x.cantidad,0);$('totales').innerHTML=`<strong>${carrito.length} líneas en el retiro</strong>${seriales} equipos serializados · ${unidades} unidades por cantidad`;$('totales').classList.remove('hidden');$('confirmar').classList.remove('hidden');$('vaciar').classList.remove('hidden')}function quitar(i){carrito.splice(i,1);cargar()}function agregarSerialCodigo(code){const serial=String(code||'').trim().toUpperCase();if(!serial)return;const s=ctx.seriales.find(x=>x.serial.toUpperCase()===serial);if(!s){showMsg(`El serial ${serial} no está disponible en BODEGA MATRIZ.`);return}if(carrito.some(x=>x.tipo_control==='SERIAL'&&x.serial===s.serial)){showMsg('Ese serial ya está en el carrito.');return}carrito.push({tipo_control:'SERIAL',serial:s.serial,detalle:`${s.codigo||''} · ${s.producto||''} · ${s.serial}`});clearMsg();cargar()}function agregarSeleccionados(){clearMsg();const vals=[...document.querySelectorAll('.serialCheck:checked')].map(x=>x.value);if(!vals.length){showMsg('Marca al menos un equipo.');return}let agregados=0;for(const serial of vals){const s=ctx.seriales.find(x=>x.serial===serial);if(s&&!carrito.some(x=>x.tipo_control==='SERIAL'&&x.serial===serial)){carrito.push({tipo_control:'SERIAL',serial:s.serial,detalle:`${s.codigo||''} · ${s.producto||''} · ${s.serial}`});agregados++}}cargar();showMsg(`${agregados} equipo${agregados===1?'':'s'} agregado${agregados===1?'':'s'} al retiro.`,true)}function agregarCantidad(){clearMsg();const id=$('producto').value,cant=Number($('cantidad').value),o=$('producto').selectedOptions[0],stock=Number(o?.dataset?.stock||0);if(!id||!Number.isInteger(cant)||cant<=0){showMsg('Selecciona un material y una cantidad válida.');return}if(cant>stock){showMsg(`Solo puedes agregar ${stock} unidades más de ese producto.`);return}const p=ctx.cantidades.find(x=>x.id===id);const existente=carrito.find(x=>x.tipo_control==='CANTIDAD'&&x.producto_id===id);if(existente){existente.cantidad+=cant;existente.detalle=`${existente.cantidad} × ${p.producto}`}else carrito.push({tipo_control:'CANTIDAD',producto_id:id,cantidad:cant,detalle:`${cant} × ${p.producto}`});$('cantidad').value='';cargar()}function cerrarCamara(){try{scanControls?.stop()}catch{}scanControls=null;const v=$('video');if(v.srcObject){for(const t of v.srcObject.getTracks())t.stop();v.srcObject=null}$('scanBox').classList.add('hidden');$('cerrarCamara').classList.add('hidden');$('abrirCamara').classList.remove('hidden')}async function abrirCamara(){clearMsg();if(!window.ZXingBrowser){showMsg('No se pudo cargar el lector de cámara.');return}try{$('scanBox').classList.remove('hidden');$('cerrarCamara').classList.remove('hidden');$('abrirCamara').classList.add('hidden');const reader=new ZXingBrowser.BrowserMultiFormatReader();let ultima='',ts=0;scanControls=await reader.decodeFromVideoDevice(undefined,$('video'),(result)=>{if(result){const code=result.getText().trim().toUpperCase(),now=Date.now();if(code===ultima&&now-ts<1500)return;ultima=code;ts=now;agregarSerialCodigo(code)}})}catch(e){cerrarCamara();showMsg('No pude abrir la cámara. Revisa el permiso del navegador.')}}document.addEventListener('change',e=>{if(e.target.classList?.contains('serialCheck'))actualizarSeleccionados()});$('entrar').onclick=entrar;$('salir').onclick=()=>{cerrarCamara();location.reload()};$('destino').onchange=filtrarPersonas;$('producto').onchange=actualizarStock;$('agregarSeleccionados').onclick=agregarSeleccionados;$('agregarCantidad').onclick=agregarCantidad;$('abrirCamara').onclick=abrirCamara;$('cerrarCamara').onclick=cerrarCamara;$('tipo').onchange=()=>{const s=$('tipo').value==='SERIAL';$('serialWrap').classList.toggle('hidden',!s);$('cantWrap').classList.toggle('hidden',s);if(!s)cerrarCamara()};$('vaciar').onclick=()=>{carrito=[];cargar();clearMsg()};$('confirmar').onclick=async()=>{clearMsg();if(!carrito.length)return;try{const p={items:carrito.map(({detalle,...x})=>x),observacion:$('obs').value.trim()};if(ctx.me.admin){p.destino_id=$('destino').value;p.retirado_por_id=$('retiradoPor').value}const d=await api('withdraw-batch',p);showMsg(`Retiro ${d.id_retiro} confirmado. Destino: ${d.destino}. Registrado por: ${d.registrado_por}. Retiró: ${d.retirado_por}. ${d.total_lineas} líneas procesadas.`,true);carrito=[];$('obs').value='';await refrescar()}catch(e){showMsg(e.message)}};</script></body></html>
