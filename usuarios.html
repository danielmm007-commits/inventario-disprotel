<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuarios DISPROTEL</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f7f9;color:#17313d;margin:0;padding:16px}.card{max-width:520px;margin:24px auto;background:white;padding:22px;border-radius:18px;box-shadow:0 7px 24px rgba(0,0,0,.08)}h1{margin-top:0}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #cbd8de;border-radius:11px;font-size:16px}button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:#17313d;color:#fff;font-size:16px;font-weight:700}.msg{margin-top:14px;padding:12px;border-radius:10px;display:none}.ok{display:block;background:#e8f6ed;color:#1b6c43}.err{display:block;background:#fdecec;color:#9d2525}.box{margin-top:14px;background:#f4f7f9;padding:14px;border-radius:12px}.muted{color:#60737c;font-size:13px}</style></head><body><div class="card"><h1>Prueba de usuarios</h1><div class="muted">Solo verifica identidad y rol. Todavía no mueve inventario.</div><label>Usuario</label><input id="usuario" autocomplete="username" placeholder="Ej. luis"><label>PIN</label><input id="pin" inputmode="numeric" autocomplete="current-password" placeholder="PIN de prueba"><button id="entrar">Entrar</button><div id="msg" class="msg"></div><div id="info" class="box" style="display:none"></div></div><script>const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-login';const $=id=>document.getElementById(id);$('entrar').onclick=async()=>{const usuario=$('usuario').value.trim(),pin=$('pin').value.trim(),m=$('msg');m.className='msg';$('info').style.display='none';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario,pin})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');const u=d.usuario;m.className='msg ok';m.textContent='Acceso correcto';$('info').innerHTML=`<b>${u.nombre}</b><br>Rol: ${u.rol}<br>Grupo: ${u.unidad_grupo}<br>Puede asignar a otros: ${u.puede_asignar_a_otros?'Sí':'No'}`;$('info').style.display='block'}catch(e){m.className='msg err';m.textContent=e.message}};</script></body></html>
