<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Informes de técnicos · DISPROTEL</title>
<style>
:root{--n:#071a38;--b:#0d5f98;--l:#d8e4ea;--bg:#eef3f6;--ink:#173b5c;--m:#71838e;--g:#237a52}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.wrap{max-width:980px;margin:auto;padding:10px}.head{background:linear-gradient(135deg,#071a38,#0d5f98);color:#fff;border-radius:15px;padding:12px;box-shadow:0 8px 22px #071a3820}.top{display:flex;gap:8px;align-items:center}.top div{flex:1}.top h1{font-size:17px;margin:0}.top p{font-size:9px;margin:4px 0 0;color:#dbeaf5}.back{border:1px solid #ffffff50;background:#ffffff15;color:#fff;border-radius:9px;padding:8px 10px;font-size:8px;font-weight:900}.tools{display:grid;grid-template-columns:160px 1fr auto;gap:6px;margin-top:9px}.tools input,.tools button{border:1px solid var(--l);border-radius:9px;padding:9px;background:#fff}.tools button{font-size:8px;font-weight:900;color:#245c7d}.list{display:grid;gap:7px;margin-top:9px}.card{background:#fff;border:1px solid var(--l);border-radius:12px;padding:9px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.card b{font-size:10px}.card small{display:block;margin-top:3px;color:var(--m);font-size:8px}.view{border:0;background:#0d5f98;color:#fff;border-radius:8px;padding:8px 10px;font-size:8px;font-weight:900}.empty{background:#fff;border:1px solid var(--l);border-radius:12px;padding:25px;text-align:center;color:var(--m);font-size:9px}.pill{display:inline-block;margin-top:4px;background:#eaf6ef;color:var(--g);font-size:7px;font-weight:900;border-radius:999px;padding:4px 6px}
@media(max-width:620px){.tools{grid-template-columns:1fr 1fr}.tools #search{grid-column:1/-1}.card{grid-template-columns:1fr}.view{width:100%}.top{align-items:flex-start}.back{white-space:nowrap}}
</style></head>
<body><main class="wrap">
<section class="head"><div class="top"><div><h1>📄 Informes de técnicos</h1><p>Informes individuales generados al finalizar las actividades técnicas.</p></div><button id="back" class="back">← SUPERVISIÓN</button></div>
<div class="tools"><input id="date" type="date"><input id="search" placeholder="Buscar OT, cliente, técnico o grupo..."><button id="refresh">↻ ACTUALIZAR</button></div></section>
<section id="list" class="list"><div class="empty">Cargando informes…</div></section>
</main>
<script>
(()=>{const API='https://ajnbswrwnjpjypjiorye.supabase.co/functions/v1/inventario-supervisor-informes',KEY='disprotel_login_general_v2',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let me={};try{me=JSON.parse(sessionStorage.getItem(KEY)||'{}')}catch{}if(!me.session_token){location.replace('login-general-v2.html');return}let rows=[];const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Guayaquil',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const fmt=v=>v?new Date(v).toLocaleString('es-EC',{timeZone:'America/Guayaquil',dateStyle:'short',timeStyle:'short'}):'—';
async function call(){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-session':me.session_token},body:JSON.stringify({action:'reports',date:$('date').value})}),j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||'No se pudo consultar');return j}
function paint(){const q=$('search').value.trim().toLowerCase(),x=rows.filter(r=>!q||[r.id_orden,r.cliente_nombre,r.tecnico,r.grupo_asignado,r.tipo_trabajo].some(v=>String(v||'').toLowerCase().includes(q)));$('list').innerHTML=x.length?x.map(r=>`<article class="card"><div><b>${esc(r.id_orden)} · ${esc(r.cliente_nombre||'Cliente')}</b><small>${esc(String(r.tipo_trabajo||'').replaceAll('_',' '))} · ${esc(r.tecnico||'Técnico no identificado')} · ${esc(r.grupo_asignado||'Sin grupo')}</small><small>${fmt(r.cerrado_at)}</small><span class="pill">${r.tiene_cierre?'INFORME DE CIERRE':'OT FINALIZADA'}</span></div><button class="view" data-id="${esc(r.id)}">📄 VER INFORME</button></article>`).join(''):'<div class="empty">No hay informes finalizados para esta fecha.</div>'}
async function load(){try{$('list').innerHTML='<div class="empty">Consultando informes…</div>';const j=await call();rows=j.reports||[];paint()}catch(e){$('list').innerHTML='<div class="empty">⚠ '+esc(e.message)+'</div>'}}
$('date').value=today();$('date').onchange=load;$('search').oninput=paint;$('refresh').onclick=load;$('back').onclick=()=>location.href='panel-supervisor-vivo-v2.html';$('list').onclick=e=>{const b=e.target.closest('[data-id]');if(b)location.href='reporte-trabajo-v2.html?orden='+encodeURIComponent(b.dataset.id)};load()})();
</script></body></html>
